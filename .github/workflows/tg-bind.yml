name: Bind Telegram Chat Id

# THROWAWAY, AND DELETED THE MOMENT IT HAS RUN ONCE.
#
# Why it has to exist at all: TELEGRAM_CHAT_ID is not set, and a local process
# cannot set it, because the bot token and the chat id only ever coexist inside
# an Actions run. scripts/delivery_selftest.py discovers the id there but masks
# it (`16****`) before logging, which is correct and is why the value has to be
# moved by the run that holds it rather than by a human reading a log.
#
# What it does, in order, and nothing else:
#   1. reads the newest PRIVATE chat from getUpdates (the same rule
#      breaking_monitor.tg_get_chat_id applies) and writes it to a file,
#      printing only `found=<masked> length=<n>`;
#   2. feeds that file to `gh secret set` on stdin, so the value is never an
#      argument, never an environment variable and never a log line.
#
# It is dispatch-only and has no schedule. Anyone who can dispatch a workflow on
# this repository can therefore rewrite this one secret while the file exists --
# that standing risk is the reason for deleting it, not a reason to keep it.
on:
  workflow_dispatch:

# The automatic GITHUB_TOKEN is not used to write the secret and needs no more
# than a read checkout, so this is the whole permission set.
permissions:
  contents: read

concurrency:
  group: tg-bind
  cancel-in-progress: false

jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Discover the owner's private chat id
        env:
          # The only secret this step may see. Nothing below prints it.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          url = "https://api.telegram.org/bot%s/getUpdates" % token
          with urllib.request.urlopen(url, timeout=15) as resp:
              payload = json.loads(resp.read().decode("utf-8"))

          # Same preference as breaking_monitor.tg_get_chat_id: the newest
          # private chat wins, and a bot's own message is never a destination.
          chat_id = None
          for update in payload.get("result") or []:
              message = update.get("message") or {}
              chat = message.get("chat") or {}
              sender = message.get("from") or {}
              if chat.get("id") is None:
                  continue
              if sender.get("is_bot") is True:
                  continue
              if str(chat.get("type") or "").lower() == "private":
                  chat_id = chat["id"]

          if chat_id is None:
              raise SystemExit(
                  "no private chat in getUpdates -- the owner must message the "
                  "bot directly first; nothing was changed")

          text = str(chat_id)
          # Same mask as delivery_selftest._mask, so the two reports agree.
          print("found=%s**** length=%d" % (text[:2], len(text)))

          path = os.path.join(os.environ["RUNNER_TEMP"], "chat_id")
          with open(path, "w", encoding="utf-8") as fh:
              fh.write(text)
          os.chmod(path, 0o600)
          PY

      - name: Write it to the repository secret
        # GH_TOKEN is the repository's own PAT -- the Worker uses the same one.
        # If it lacks secret-write this step fails with the API's 403 and that
        # is the correct outcome: no fallback credential is attempted.
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set +x
          gh secret set TELEGRAM_CHAT_ID --repo "$GITHUB_REPOSITORY" \
            < "$RUNNER_TEMP/chat_id"
          # Assert it exists without reading it back -- the API never returns a
          # secret's value, only its name and update time.
          gh secret list --repo "$GITHUB_REPOSITORY" \
            | grep -q '^TELEGRAM_CHAT_ID' \
            && echo "secret TELEGRAM_CHAT_ID present"
