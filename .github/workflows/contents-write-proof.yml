name: contents-write-proof

# TEMPORARY WORKFLOW. Added only to prove one thing, then removed:
# that this repository's workflow token, holding `contents: write`, can create
# a real commit through the GitHub contents API and delete the branch again.
#
# It is `workflow_dispatch`-only, behind a typed confirmation, with no
# schedule and no push trigger, so nothing can start it by accident.
#
# This proves the WORKFLOW TOKEN path. It says nothing about the Cloudflare
# Worker's personal access token, which is a different credential.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROVE-WRITE to authorise this run. Any other value aborts.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prove:
    name: Prove contents write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create, read back, and delete a scratch branch via the contents API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ "${INPUT_CONFIRM}" != "PROVE-WRITE" ]; then
            echo "::error::confirm input must equal PROVE-WRITE, got '${INPUT_CONFIRM}'"
            exit 1
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::workflow token is empty"
            exit 1
          fi

          auth=(-H "Authorization: Bearer ${GH_TOKEN}"
                -H "Accept: application/vnd.github+json"
                -H "X-GitHub-Api-Version: 2022-11-28")

          ts="$(date -u +%Y%m%d-%H%M%S)"
          branch="contents-proof-${ts}"
          path="PROOF-MARKER.md"

          echo "repo=${REPO}"
          echo "branch=${branch}"
          echo "actor=${GITHUB_ACTOR}"

          # 1. Resolve master so the scratch branch starts from a real commit.
          base_sha="$(curl -fsSL "${auth[@]}" "${API}/repos/${REPO}/git/ref/heads/master" | jq -r '.object.sha')"
          if [ -z "${base_sha}" ] || [ "${base_sha}" = "null" ]; then
            echo "::error::could not resolve master HEAD"
            exit 1
          fi
          echo "base_sha=${base_sha}"

          # 2. Create the scratch branch from master.
          create_code="$(curl -sS -o create.json -w '%{http_code}' -X POST "${auth[@]}" \
            "${API}/repos/${REPO}/git/refs" \
            -d "{\"ref\":\"refs/heads/${branch}\",\"sha\":\"${base_sha}\"}")"
          echo "create_ref_http=${create_code}"
          if [ "${create_code}" != "201" ]; then
            echo "::error::branch creation failed"
            cat create.json
            exit 1
          fi

          # 3. PUT a one-file commit onto that branch through the contents API.
          body="contents-write proof for ${REPO} generated at ${ts}Z by run ${GITHUB_RUN_ID}"
          content_b64="$(printf '%s' "${body}" | base64 -w0)"
          payload="$(jq -n \
            --arg msg "chore(proof): contents write probe ${ts}" \
            --arg content "${content_b64}" \
            --arg branch "${branch}" \
            '{message:$msg, content:$content, branch:$branch}')"
          put_code="$(curl -sS -o put.json -w '%{http_code}' -X PUT "${auth[@]}" \
            "${API}/repos/${REPO}/contents/${path}" -d "${payload}")"
          echo "put_contents_http=${put_code}"
          if [ "${put_code}" != "201" ]; then
            echo "::error::contents PUT failed"
            cat put.json
            exit 1
          fi

          commit_sha="$(jq -r '.commit.sha // empty' put.json)"
          if [ -z "${commit_sha}" ]; then
            echo "::error::contents PUT returned no commit sha"
            cat put.json
            exit 1
          fi
          echo "COMMIT_SHA=${commit_sha}"
          echo "BRANCH=${branch}"

          # 4. Read the file back from the branch and compare its contents.
          read_code="$(curl -sS -o read.json -w '%{http_code}' "${auth[@]}" \
            "${API}/repos/${REPO}/contents/${path}?ref=${branch}")"
          echo "read_back_http=${read_code}"
          if [ "${read_code}" != "200" ]; then
            echo "::error::read back of ${path} failed"
            cat read.json
            exit 1
          fi
          read_body="$(jq -r '.content' read.json | tr -d '\n' | base64 -d)"
          if [ "${read_body}" != "${body}" ]; then
            echo "::error::read-back content mismatch"
            echo "expected: ${body}"
            echo "actual:   ${read_body}"
            exit 1
          fi
          echo "READ_BACK=verified"

          # 5. Confirm the commit object itself exists on the remote.
          commit_code="$(curl -sS -o commit.json -w '%{http_code}' "${auth[@]}" \
            "${API}/repos/${REPO}/commits/${commit_sha}")"
          verified_sha="$(jq -r '.sha // empty' commit.json)"
          echo "get_commit_http=${commit_code}"
          if [ "${commit_code}" != "200" ] || [ "${verified_sha}" != "${commit_sha}" ]; then
            echo "::error::commit ${commit_sha} could not be read back"
            cat commit.json
            exit 1
          fi
          echo "COMMIT_EXISTS=${verified_sha}"

          # 6. Delete the scratch branch.
          del_code="$(curl -sS -o delete.json -w '%{http_code}' -X DELETE "${auth[@]}" \
            "${API}/repos/${REPO}/git/refs/heads/${branch}")"
          echo "delete_ref_http=${del_code}"
          if [ "${del_code}" != "204" ]; then
            echo "::error::branch deletion failed"
            cat delete.json
            exit 1
          fi

          # 7. Confirm the branch is gone: the ref must now return 404.
          gone_code="$(curl -sS -o gone.json -w '%{http_code}' "${auth[@]}" \
            "${API}/repos/${REPO}/git/ref/heads/${branch}")"
          echo "post_delete_get_http=${gone_code}"
          if [ "${gone_code}" != "404" ]; then
            echo "::error::branch ${branch} still resolves after delete"
            cat gone.json
            exit 1
          fi
          echo "BRANCH_DELETED=${branch}"

          {
            echo "### contents write proof"
            echo ""
            echo "- branch: \`${branch}\`"
            echo "- commit sha: \`${commit_sha}\`"
            echo "- read back: verified"
            echo "- branch delete: 204, ref now 404"
            echo ""
            echo "This proves the workflow token can write. It says nothing about"
            echo "the Worker PAT, which is a different credential."
          } >> "${GITHUB_STEP_SUMMARY}"
