name: Daily Media News Digest

# The deployment's private proper nouns, read by scripts/private_values.py at
# the moment they are printed. Unset, each falls back to a visible placeholder
# AND says so on stderr, because a digest that quietly renders "Example
# College" reaches the owner's phone looking correct and is not.
env:
  BANK_NAME: ${{ secrets.BANK_NAME }}
  COLLEGE_NAME: ${{ secrets.COLLEGE_NAME }}
  BANK_URL: ${{ secrets.BANK_URL }}
  COLLEGE_URL: ${{ secrets.COLLEGE_URL }}

on:
  schedule:
    # DEAD-MAN'S-SWITCH FALLBACK ONLY — Worker normally dispatched this
    # 30 min earlier (Cloudflare cron 35 1/13 * * * POSTs workflow_dispatch
    # to this workflow; this GitHub-side schedule fires only if the worker
    # failed, and the "Fallback no-op check" step skips it otherwise).
    # Fires 02:05/14:05 UTC = 07:50/19:50 NPT.
    # Two separate entries (not a combined "2,14" hour list) so that
    # github.event.schedule below is a distinct, matchable string per slot.
    - cron: '5 2 * * *'
    - cron: '5 14 * * *'
  workflow_dispatch:
    inputs:
      digest_time:
        description: 'Digest time'
        required: true
        type: choice
        options:
          - morning
          - evening
      dry_run:
        description: 'Dry run (validate/build/artifacts only — skip SMTP send)'
        required: false
        type: boolean
        default: false
      trigger_source:
        description: 'Trigger origin (the Cloudflare worker dispatches with "worker")'
        required: false
        type: string
        default: manual
      retry_slot:
        description: 'Retry of an empty digest for this slot (dispatched by digest-watchdog.yml)'
        required: false
        type: string
        default: ''
      retry_of:
        description: 'NPT date of the empty digest being retried (digest-watchdog.yml)'
        required: false
        type: string
        default: ''
      slot_date:
        # The SLOT's Nepal date, not the build's. A dispatcher that knows which
        # slot it is asking for must say so, because a dispatch accepted before
        # midnight NPT can START after it: run 2026-10-17T18:16:53Z (00:01 NPT
        # on the 18th) was dispatched for `evening` and pushed the 18th's
        # evening digest 19 hours before its slot, purely because the date came
        # from the wall clock. Empty means "I do not know the date, derive it
        # from the named slot's own firing" -- never "use the clock".
        description: 'NPT date of the slot being built, YYYY-MM-DD (empty = derive it from the slot''s firing)'
        required: false
        type: string
        default: ''
      phase:
        # U6. `full` is the delivery build. `prebuild` builds the SAME digest
        # ahead of its slot (digest-prebuild.yml dispatches it 30 min early) so
        # the slot's own run only has to hand the artifact to the Worker. A
        # prebuild pushes NOTHING to the owner, which is why it is a choice and
        # not a flag: the difference between the two is a 07:20 push arriving
        # twice a day.
        description: 'Build phase (prebuild builds ahead of the slot and seals an artifact; full builds for delivery)'
        required: false
        type: choice
        options:
          - full
          - prebuild
        default: full

permissions:
  contents: write
  # A. `actions: write` for the ONE `gh workflow run` at the end of a prebuild:
  # POST .../dispatches on this repository, from a job that already holds a
  # token. It publishes nothing by itself -- the run it wakes is
  # digest-prebuild.yml, whose own gates are unchanged -- and it is the same
  # capability that workflow's seal job already holds for the supersede.
  actions: write

concurrency:
  # Fixed group: a worker-dispatched run and its 30-min-later fallback twin
  # can never execute concurrently (the fallback queues behind it, then no-ops).
  group: daily-news
  cancel-in-progress: false

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Initialize timing clock
        run: |
          set -eo pipefail
          echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # fetch-depth: 0 (full history) chosen over shallow (1): the final
          # step commits state back to master from this checkout and pushes,
          # and a full clone keeps that bot push reliable. The repo is small,
          # so the extra fetch cost is negligible.
          fetch-depth: 0
          # DEFECT 2 (P1 security, 2026-09-30). `actions/checkout` defaults to
          # persist-credentials: TRUE, which writes GITHUB_TOKEN into
          # `.git/config` in the workspace and leaves it there for the whole
          # job. "Run OpenCode agent" below then executes `opencode run --auto`
          # -- auto-approved, no tool allowlist -- against prompts/daily-digest.md
          # plus text harvested from RSS feeds. Untrusted feed text reaches that
          # agent, so anything the prompt's defences miss can plausibly
          # `git push` with this job's `contents: write`. The token is still
          # used for the initial fetch; only the on-disk persistence is
          # switched off. "Commit state changes" injects the token explicitly,
          # for its own pull/push only, so the `[skip ci]` state commit keeps
          # working.
          persist-credentials: false

      - name: Determine date, digest time and trigger source
        # Runs EARLY (right after checkout) so the fallback no-op check below
        # can bail out before any expensive setup (Node, OpenCode, agent).
        # Dispatch input wins; the GitHub-side schedule derives the slot from
        # the UTC hour.
        id: digest_time
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Bound, not interpolated into the shell. The `time` below used to
          # compare `${{ github.event.schedule }}` inline, which puts an
          # expression's value into the script text; the env binding is the
          # same value with none of that, and it is what the date derivation
          # needs to read anyway.
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_DIGEST_TIME: ${{ github.event.inputs.digest_time }}
          INPUT_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_RETRY_SLOT: ${{ github.event.inputs.retry_slot }}
          INPUT_RETRY_OF: ${{ github.event.inputs.retry_of }}
          # The date the DISPATCHER named. Bound like every other input rather
          # than spliced into the script text, so the value cannot become a
          # second source of truth that the shell re-parses.
          INPUT_SLOT_DATE: ${{ github.event.inputs.slot_date }}
          INPUT_PHASE: ${{ github.event.inputs.phase }}
        run: |
          set -eo pipefail
          # A SLOT IS AN (NEPAL DATE, morning|evening) PAIR, AND BOTH HALVES
          # MUST COME FROM THE SAME PLACE.
          #
          # The name half already came from `github.event.schedule`. The date
          # half used to come from the wall clock, and that is what mislabelled
          # the archive: run 38076000974 started at 2026-10-10T18:29:48Z --
          # 00:29 NPT on the 11th -- and reported
          # "TODAY: 2026-10-11 / DIGEST_TIME: evening", rendering
          # docs/digests/2026-10-11-evening.html for the 10th's evening slot.
          # The watchdog then demanded a 2026-10-10-evening record that can
          # never exist, because the only evening digest in existence had been
          # filed under the wrong day.
          #
          # THE SLOT IS THE SCHEDULED SLOT. A digest for the 19:20 slot built
          # after midnight NPT is still <that date> evening. Delay moves the
          # job; it does not renumber it -- which is the same anchoring
          # digest-watchdog.yml's digest_due() already uses, and the same rule
          # digest-prebuild.yml's slot step uses for its own `today` output.
          #
          # A DISPATCH MUST NAME ITS DATE; THERE IS NO DERIVED FALLBACK FOR IT.
          # A cron only names the most recent instant it fired, so a dispatch
          # that carries no date can only ever be dated to a firing that has
          # ALREADY happened. At 14:00 NPT on the 26th the evening slot's most
          # recent firing is the 25th's, so the old fallback silently produced
          # the 25th for a run that meant the 26th. Observed twice on
          # 2026-10-26 from the same input:
          #   state/digest-archive/2026-10-25-evening-undated.html
          #     -> header 2026-10-26
          #   state/digest-archive/2026-10-25-evening-undated-2.html
          #     -> header 2026-10-25
          # Run 2026-10-17T18:16:53Z is the same defect in the other direction:
          # 00:01 NPT on the 18th, dispatched for `evening`, took the 18th from
          # the wall clock and pushed it 19 hours before its slot. `slot_date`
          # travels with the dispatch, the Worker sends it on both digest
          # dispatches (deploy/cloudflare-worker.js dispatchDigest /
          # dispatchPrebuild), and digest-watchdog.yml relays it on a retry. A
          # caller that cannot say which day it means now FAILS rather than
          # guessing a day in the past.
          #
          # THE SLOT TIMES LIVE IN ONE PLACE: deploy/schedule.json
          # (`dispatcher_crons.digest_slots`). This step keeps no private copy
          # of them. It used to carry `SLOT_CRON="5 2 * * *"` / `"5 14 * * *"`
          # for the dispatch path -- the WORKFLOW's dead-man's-switch crons,
          # which fire 30 minutes AFTER the real slots -- so even an on-time
          # dispatch resolved its walk-back to the previous day. That variable
          # is gone; the scheduled path derives its date from the firing that
          # actually happened, which is the only arm that has one.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_DIGEST_TIME" in
              morning|evening) time="$INPUT_DIGEST_TIME" ;;
              *) echo "FATAL: invalid digest_time input: $INPUT_DIGEST_TIME"; exit 1 ;;
            esac
            trigger="${INPUT_TRIGGER_SOURCE:-manual}"
          else
            # The SAME string the date is derived from, so the name and the date
            # cannot disagree about which firing this is.
            if [[ "$EVENT_SCHEDULE" == "5 2 * * *" ]]; then
              time=morning
            else
              time=evening
            fi
            trigger="github-schedule-fallback"
          fi
          today=$(INPUT_SLOT_DATE="${INPUT_SLOT_DATE:-}" python3 - <<'PY'
          import datetime, os, re, sys

          NPT_OFFSET_MINUTES = 345  # Nepal is UTC+05:45, no DST. Same 345 the
                                     # lint pins and digest-prebuild.yml mirrors.
          UTC = datetime.timezone.utc


          def firing_npt_date(expr, now):
              """The NEPAL date of the scheduled firing this run belongs to.

              Walks back over four days rather than trying only today, because
              the whole point is that the job can start hours late -- or after
              the Nepal midnight that follows its own firing, which is the case
              that produced the mislabelled archive.

              Built from the cron's own fields rather than from any component
              of the clock the job started on, so nothing here can pick a day
              by the time of day the build happened to begin.
              """
              fields = str(expr or '').split()
              if len(fields) != 5:
                  raise ValueError('not a 5-field cron: %r' % expr)
              minute, hour, dom, month, dow = fields
              if (dom, month, dow) != ('*', '*', '*'):
                  raise ValueError(
                      'cron %r restricts the date fields, so its most recent '
                      'matching instant is not answerable' % expr)
              if not (minute.isdigit() and hour.isdigit()):
                  raise ValueError('cron %r is not one fixed time of day' % expr)
              mm, hh = int(minute), int(hour)
              if not (0 <= hh <= 23 and 0 <= mm <= 59):
                  raise ValueError('cron %r is not a time of day' % expr)
              day = now.date()
              for _back in range(0, 4):
                  candidate = datetime.datetime(
                      day.year, day.month, day.day, hh, mm, tzinfo=UTC)
                  if candidate <= now:
                      return (candidate + datetime.timedelta(
                          minutes=NPT_OFFSET_MINUTES)).strftime('%Y-%m-%d')
                  day = day - datetime.timedelta(days=1)
              raise ValueError('cron %r has no firing at or before %s'
                               % (expr, now.isoformat()))


          def slot_date_from_input(raw):
              """The date the DISPATCHER named, or None when it named none.

              Validated and then used verbatim. It is the only way a caller can
              say "I mean the 17th's evening slot" while the runner is already
              living on the 18th -- which is precisely the case the wall clock
              could not express, and the one that cost run 2026-10-17T18:16:53Z.
              """
              text = str(raw or '').strip()
              if not text:
                  return None
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', text):
                  raise ValueError('slot_date %r is not a YYYY-MM-DD date' % text)
              try:
                  return datetime.datetime.strptime(
                      text, '%Y-%m-%d').strftime('%Y-%m-%d')
              except ValueError as exc:
                  raise ValueError('slot_date %r is not a real calendar date: %s'
                                   % (text, exc))


          try:
              named = slot_date_from_input(os.environ.get('INPUT_SLOT_DATE'))
              # The arm that ACTUALLY FIRED. A workflow_dispatch has no
              # `github.event.schedule`, so this is empty for one -- and an
              # empty one is refused below rather than turned into a guess.
              schedule = (os.environ.get('EVENT_SCHEDULE') or '').strip()
              if named is not None:
                  print(named)
              elif not schedule:
                  raise ValueError('this run names no slot_date and has no '
                                   'scheduled firing to be dated from; a '
                                   'dispatch must say which day its slot '
                                   'belongs to')
              else:
                  print(firing_npt_date(schedule, datetime.datetime.now(UTC)))
          except (KeyError, ValueError) as exc:
              print('FATAL: the slot date could not be established: %s. A named '
                    'slot_date must be a real YYYY-MM-DD date; without one the '
                    'slot is dated from its own scheduled firing. Refusing to '
                    'walk back or to use the clock, which is how a dispatch at '
                    '14:00 NPT on 2026-10-26 produced 2026-10-25, and how run '
                    '38076000974 produced 2026-10-11-evening for the 10th '
                    'evening slot.' % exc,
                    file=sys.stderr)
              raise SystemExit(1)
          PY
          )
          # EMPTY-DIGEST RETRY (FROZEN CONTRACT 1d). digest-watchdog.yml
          # re-dispatches the SAME slot after a zero-story run, so the retry
          # overwrites that slot's page and marker instead of producing a
          # second, differently-slotted digest. A retry_slot that disagrees
          # with digest_time is a dispatch bug and is fatal, not a warning: a
          # retry that silently renders into the wrong slot is worse than no
          # retry, because it looks like it worked.
          if [ -n "${INPUT_RETRY_SLOT:-}" ] && [ "$INPUT_RETRY_SLOT" != "$time" ]; then
            echo "FATAL: retry_slot '$INPUT_RETRY_SLOT' does not match digest_time '$time'"
            exit 1
          fi
          echo "RETRY_OF=${INPUT_RETRY_OF:-}" >> "$GITHUB_ENV"
          # DRY_RUN is promoted to the job-wide env exactly once, HERE, so
          # every outward-facing step below can gate on a single canonical
          # value (and so a `dry_run=true` run can never half-deliver: a step
          # that forgets its own guard still sees it in `if:`). A scheduled
          # run has no inputs, which is never a dry run.
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then dry_run=true; else dry_run=false; fi
          # PHASE (U6). `full` is the delivery build; `prebuild` builds the same
          # digest ahead of its slot and must send NOTHING to the owner.
          #
          # NTFY_DRY_RUN, NOT DRY_RUN, IS WHAT A PREBUILD SETS. DRY_RUN stays
          # false so the prebuild still deploys the Pages site, still commits the
          # archive and still writes history -- that work IS the prebuild's
          # product, and if it were skipped there would be nothing to hand over.
          # Only the NOTIFICATION path is forced dry, so the artifact can be
          # sealed without the owner being pushed to at 06:50 and again at 18:50.
          #
          # Validated against the choice list, and anything else is FATAL exactly
          # like digest_time: a typo that silently fell back to `full` would mail
          # the owner twice a day from an arm that is supposed to be silent, with
          # every job green.
          case "${INPUT_PHASE:-full}" in
            full|prebuild) phase="${INPUT_PHASE:-full}" ;;
            *) echo "FATAL: invalid phase input: $INPUT_PHASE"; exit 1 ;;
          esac
          echo "PHASE=$phase" >> "$GITHUB_ENV"
          if [ "$phase" = "prebuild" ]; then
            echo "NTFY_DRY_RUN=true" >> "$GITHUB_ENV"
          elif [ "$dry_run" = "true" ]; then
            echo "NTFY_DRY_RUN=true" >> "$GITHUB_ENV"
          else
            echo "NTFY_DRY_RUN=false" >> "$GITHUB_ENV"
          fi
          echo "time=$time" >> "$GITHUB_OUTPUT"
          echo "TODAY=$today" >> "$GITHUB_ENV"
          echo "DIGEST_TIME=$time" >> "$GITHUB_ENV"
          echo "TRIGGER_SOURCE=$trigger" >> "$GITHUB_ENV"
          echo "DRY_RUN=$dry_run" >> "$GITHUB_ENV"
          echo "Digest run: $time for $today (Asia/Kathmandu), trigger: $trigger, dry_run: $dry_run, phase: $phase"

      - name: Fallback no-op check
        # Dead-man's-switch guard: if the Cloudflare worker already delivered
        # this slot's digest (state/last_digest_sent.json records date+time
        # for the slot), this fallback run must do NOTHING. A bare `exit 0`
        # cannot stop a job, so the check exports FALLBACK_NOOP=true and every
        # later step is gated on it; the run then finishes green having done
        # nothing. Only markers with delivered=true suppress the fallback;
        # legacy markers without a delivered field are treated as delivered
        # (old code wrote them only after a successful send), while a
        # delivered=false marker (all channels failed) must NOT suppress it.
        # Missing/corrupt marker file => proceed (fail-open: prefer a
        # duplicate-risk-free delivery over silently skipping the digest).
        # A marker written by a DRY RUN never suppresses anything, even if it
        # somehow says delivered=true: drift-canary.yml dispatches
        # dry_run=true for the very same slot the real worker run delivers, so
        # a canary that could suppress the real run would silently cancel the
        # owner's ntfy push. The `dry_run` clause is the belt to the
        # delivered=false brace.
        #
        # AND A ZERO-STORY RUN NEVER SUPPRESSES ANYTHING, ON THIS RUN OR THE
        # NEXT. `stories > 0` is a hard term. Without it an empty digest that
        # reached ONE channel wrote delivered=true, and the self-seal closed:
        # the next run for that slot read the marker, saw delivered=true, and
        # armed FALLBACK_NOOP -- so the fallback ladder never fired and a
        # broken/quiet-then-empty morning stayed unreported for the rest of
        # the day. Half of that self-seal (this step) was invisible in every
        # audit; this term is what closes it.
        #
        # U4. THE KV LEDGER IS CONSULTED TOO, AND IT OUTRANKS THE FILE.
        # `state/last_digest_sent.json` describes what a GITHUB RUN did, it is
        # a single slot, and it is overwritten by every run. Since the Worker
        # began delivering the digest itself (unit U5) the 07:20 push never
        # touches it at all, so this check would see nothing and would deliver
        # the digest a second time by email and Telegram thirty minutes after
        # the push that already succeeded. The Worker's own ledger
        # (`digest:ledger`) records `ntfy_sent_at` for the slot, and that is
        # what this step now reads as well.
        #
        # TWO LEDGER FACTS OUTRANK IT, AND THEY ARE THE ONES THAT COST THE
        # OWNER A DIGEST. A slot whose ntfy send FAILED, or whose only push was
        # the "digest unavailable" notice, has STILL written `ntfy_sent_at` --
        # a push did happen, and it told the owner nothing they can read. So
        # `ntfy_failed`, or `kind == "unavailable"`, means the ladder is the
        # only thing left that can deliver, and it runs.
        #
        # EVERY WAY OF NOT READING THE LEDGER IS `unknown`, NEVER `arm` AND
        # NEVER `no_arm`. An unset secret, an unparsable config, a 403 from a
        # token without the storage scope, a 5xx, a timeout, a value that is
        # not JSON: each falls back to exactly today's file rule. A KV outage
        # must not be able to stand the whole ladder down -- that would be the
        # silent-outage failure the single-slot marker already caused once.
        #
        # AND A DRY RUN IS STILL NEVER SUPPRESSED. That term existed for the
        # MARKER, because a marker written by a dry run must not cancel the
        # real run. The ledger needs the same term for the opposite reason:
        # drift-canary.yml dispatches a dry run for the SAME slot twice a day
        # (06:15 and 09:02 NPT), and once the Worker delivers at 07:20 the
        # ledger would arm at 09:02 and skip the canary's end-to-end check --
        # a run that finishes green having done nothing. That is the same
        # silent-loss class this step exists to prevent, one layer along.
        #
        # U7. A `supersede` RUN IS NEVER STOOD DOWN. digest-prebuild.yml's seal
        # job dispatches this workflow at `phase=full` when the ledger says the
        # slot was pushed as `partial` / `fallback_last_good` / `unavailable`,
        # and the point of that dispatch is to REPLACE the push already recorded
        # in `ntfy_sent_at`. Arming on that record — or on the marker — would
        # make the supersede a green run that delivered nothing, while the seal
        # job latched the slot as superseded and would never try again.
        #
        # What stops the supersede from repeating is NOT this step: it is
        # `full_artifact_available_at`, read and written by the seal job that
        # dispatches it. So this term fails OPEN even when the ledger cannot be
        # read at all, exactly like every other unreadable case here. Standing a
        # supersede down because Cloudflare had a bad minute would leave the
        # owner holding a partial digest for the rest of the day.
        #
        # U7. THE BRANCH IS NAMED IN THE LOG, AND SO IS THE REASON THE LEDGER
        # COULD NOT BE READ. Every way of failing to read the ledger lands in
        # one bare `except Exception`, which is correct — they all mean
        # `unknown`, and they all fall back to the file rule — but printed as
        # the bare word they are indistinguishable from each other. A
        # `CF_PAGES_API_TOKEN` that can deploy Pages and cannot read KV looks
        # exactly like a Cloudflare outage, forever, and nothing in the log
        # says which. The line below names both the branch taken and the reason,
        # so a mis-scoped token is diagnosable from one run instead of
        # discovered weeks later.
        id: noop_check
        env:
          SLOT: ${{ steps.digest_time.outputs.time }}
          TODAY: ${{ env.TODAY }}
          DRY_RUN: ${{ env.DRY_RUN }}
          # Both are derived once in 'Determine date, digest time and trigger
          # source' and exported job-wide. A prebuild sets NTFY_DRY_RUN=true
          # while DRY_RUN stays false, so neither is a substitute for the other.
          PHASE: ${{ env.PHASE }}
          NTFY_DRY_RUN: ${{ env.NTFY_DRY_RUN }}
          TRIGGER_SOURCE: ${{ env.TRIGGER_SOURCE }}
          # Both already exist for the Pages deploy below; neither is new.
          CF_LEDGER_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # The namespace id, from a repository variable. Not a secret: an id
          # grants nothing without the token above.
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import datetime, json, os, re, urllib.request

          # The Worker's own DIGEST_LEDGER_KEY. tests/digest/test_fallback_
          # ledger.py pins this literal against that constant rather than
          # trusting it, because a second copy is a second place to correct.
          LEDGER_KEY = 'digest:ledger'
          KV_API = 'https://api.cloudflare.com/client/v4'
          # THE ONLY SOURCE OF THE NAMESPACE ID: a repository VARIABLE, not a
          # secret (an id grants nothing without a token). deploy/wrangler.toml
          # carries a PLACEHOLDER and is deliberately never read -- reading it
          # is what made every run query a namespace that does not exist
          # (Cloudflare 10013, HTTP 404).
          KV_NAMESPACE_ENV = 'CF_KV_NAMESPACE_ID'
          KV_PLACEHOLDER = 'abcdefabcdefabcdefabcdefabcdefab'
          KIND_UNAVAILABLE = 'unavailable'
          # The 60s of early slack the archive steps already allow a cron that
          # fires marginally before its own scheduled minute.
          SLOT_EARLY_SLACK_S = 60
          # The same literal digest-prebuild.yml's seal lists in its
          # SUPERSEDED_KINDS -- the three kinds a complete digest may replace --
          # and the copy tests/digest/test_ladder_trigger.py pins. A heredoc
          # cannot import from another workflow, so instead of hoping the three
          # stay equal, the pin test below fails if any one of them is renamed.
          # Every way this step can fail to read the ledger. One tuple, one
          # branch: a new failure mode cannot be added without being asked
          # which of the three answers it gets.
          UNKNOWN = 'unknown'
          ARM = 'arm'
          NO_ARM = 'no_arm'

          slot = os.environ['SLOT']
          today = os.environ['TODAY']
          path = 'state/last_digest_sent.json'

          # WHY THE LEDGER COULD NOT BE CONSULTED, IN WORDS, and the entry it
          # was read from. Printed in the decision line below. Every failure
          # below is `unknown` — that is the fail-open answer and it is right —
          # but printed as the bare word they are indistinguishable from each
          # other, and a `CF_PAGES_API_TOKEN` that can deploy Pages and cannot
          # read KV looks exactly like a Cloudflare outage, forever.
          LEDGER_REASON = 'not consulted'
          LEDGER_ENTRY = None

          def read_marker():
              """The committed single-slot marker, or None. Never raises."""
              try:
                  with open(path, encoding='utf-8') as fh:
                      return json.load(fh)
              except FileNotFoundError:
                  print(f'{path} missing — the file rule alone decides this run')
              except ValueError:  # fail-open reset for malformed JSON
                  print(f'WARNING: {path} unreadable as JSON — resetting to empty (fail-open)')
                  try:
                      with open(path, 'w', encoding='utf-8') as wf:
                          json.dump({}, wf)
                  except OSError as exc_write:
                      print(f'ERROR: could not reset {path}: {exc_write}')
              return None

          def file_arms(marked):
              """Today's rule, term for term. True => stand the ladder down."""
              if not isinstance(marked, dict):
                  return False
              try:
                  stories = int(marked.get('stories', 0) or 0)
              except (TypeError, ValueError):
                  stories = 0
              if not stories:
                  print(f'marker reports {stories} stories for {slot} — an empty '
                        f'digest is NOT a delivered slot; the fallback runs')
              return bool(((marked.get('time') == slot and marked.get('date') == today)
                           or marked.get(slot) == today)
                          and marked.get('delivered', True)
                          and not marked.get('dry_run', False) and stories > 0)

          def kv_namespace():
              """The KV namespace id, from the CF_KV_NAMESPACE_ID variable.

              NEVER deploy/wrangler.toml: its id is a published placeholder that
              names no namespace. There is deliberately no fallback — an absent,
              malformed or placeholder value returns '' and says which it was, so
              this step stands down loudly instead of querying a namespace that
              cannot answer.
              """
              raw = (os.environ.get(KV_NAMESPACE_ENV) or '').strip()
              if not raw:
                  print(f'{KV_NAMESPACE_ENV} is unset — there is no fallback to '
                        f'deploy/wrangler.toml, whose id is a placeholder')
                  return ''
              if not re.fullmatch(r'[0-9a-fA-F]{32}', raw):
                  print(f'{KV_NAMESPACE_ENV} is not a 32-hex namespace id (value not shown)')
                  return ''
              if raw.lower() == KV_PLACEHOLDER:
                  print(f'{KV_NAMESPACE_ENV} is the PLACEHOLDER id committed in '
                        f'deploy/wrangler.toml — it names no namespace; set the '
                        f'repository variable to the real id')
                  return ''
              return raw

          def kv_error_detail(exc):
              """(HTTP status, Cloudflare errors[0].code, printable label).

              The body is read ONCE, here. The label never quotes the request
              URL, because that URL carries the account and namespace ids.
              10013 is "namespace not found"; 10009 is "key not found", i.e. an
              empty ledger rather than a broken namespace.
              """
              status = getattr(exc, 'code', None)
              code = None
              if status is not None:
                  try:
                      payload = json.loads((exc.read() or b'').decode('utf-8', 'replace'))
                      code = (payload.get('errors') or [{}])[0].get('code')
                  except Exception:
                      code = None
              printable = (f'HTTP {status}, Cloudflare code {code or "none"}'
                           if status is not None else exc.__class__.__name__)
              return status, code, printable

          def instant_or_none(text):
              """An aware UTC datetime, or None. A naive or unparseable value is None.

              None means "no usable instant", never "epoch": treating an
              unreadable stamp as a very old one would make every comparison
              below silently true.
              """
              raw = str(text or '').strip()
              if not raw:
                  return None
              if raw[-1] in 'Zz':
                  raw = raw[:-1] + '+00:00'
              try:
                  moment = datetime.datetime.fromisoformat(raw)
              except ValueError:
                  return None
              if moment.tzinfo is None:
                  return None
              return moment.astimezone(datetime.timezone.utc)

          def send_instant_fits_slot(entry, when_text):
              """False when the recorded send provably cannot belong to this slot.

              THE FALSE-GREEN GUARD. `ntfy_sent_at` alone is not evidence that
              this slot went out: on 2026-10-26 evening the entry claimed
              12:34:19Z while the run itself had only written `pending_at`
              13:55:26Z and its own `scheduled_instant` was 13:35Z — the stamp
              came from an earlier attempt and the slot never sent. Two
              comparisons, both from the record itself, no clock of ours:

                * a send cannot precede the write-ahead `pending_at` that this
                  same run wrote before the first byte went to ntfy;
                * a send cannot precede the slot's own `scheduled_instant` by
                  more than the 60s early slack the archive steps allow.

              A stamp that fails either test is not evidence, so this gate does
              not stand the ladder down on it. An unreadable stamp is not
              evidence either. A record with neither instant carries no timing
              claim at all and keeps the pre-existing behaviour.
              """
              sent = instant_or_none(when_text)
              if sent is None:
                  return False
              pending = instant_or_none(entry.get('pending_at'))
              if pending is not None and sent < pending:
                  return False
              due = instant_or_none(entry.get('scheduled_instant'))
              if due is not None and sent < due - datetime.timedelta(
                      seconds=SLOT_EARLY_SLACK_S):
                  return False
              return True

          def ledger_verdict():
              """'arm' | 'no_arm' | 'unknown' for this slot, from the ledger.

              'unknown' is the fail-open answer and it is the answer to every
              failure below. The token travels in an Authorization header and
              never in the URL, so an exception string cannot quote it.

              Also records LEDGER_REASON (why it could not answer) and
              LEDGER_ENTRY (what it read), which the decision line below
              prints. This is deliberately not a detection heuristic: nothing
              here guesses whether a 403 means "bad token" or "bad scope",
              because a guess that is wrong would hide the other cause. The
              exception's own words are printed instead, and a human reads them.
              """
              global LEDGER_REASON, LEDGER_ENTRY
              token = os.environ.get('CF_LEDGER_TOKEN', '').strip()
              account = os.environ.get('CF_ACCOUNT_ID', '').strip()
              if not token or not account:
                  LEDGER_REASON = 'secret unset (CF_PAGES_API_TOKEN/CF_ACCOUNT_ID)'
                  print('ledger not consulted: CF_PAGES_API_TOKEN / CF_ACCOUNT_ID '
                        'unset — the file rule alone decides')
                  return UNKNOWN
              namespace = kv_namespace()
              if not namespace:
                  LEDGER_REASON = 'no KV namespace id in CF_KV_NAMESPACE_ID'
                  return UNKNOWN
              url = (f'{KV_API}/accounts/{account}/storage/kv/namespaces/{namespace}'
                     f'/values/{LEDGER_KEY}')
              request = urllib.request.Request(
                  url, headers={'Authorization': 'Bearer ' + token,
                                'Accept': 'text/plain'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read().decode('utf-8', errors='replace')
              except Exception as exc:
                  # A 403 HERE IS THE MIS-SCOPED-TOKEN CASE, and it is the one
                  # this log line exists for. Nothing below tries to tell it
                  # apart from a 5xx or a timeout — a wrong guess would hide
                  # the other cause — but printing the status and Cloudflare's
                  # OWN error code makes it readable from the run without any
                  # guessing, and 10013 names a namespace that does not exist.
                  status, code, detail = kv_error_detail(exc)
                  if status == 404 and code == 10009:
                      LEDGER_REASON = 'ledger key absent (HTTP 404 / Cloudflare 10009)'
                      print('the KV ledger key is absent (HTTP 404, Cloudflare 10009) '
                            '— an empty ledger; the file rule alone decides')
                      return UNKNOWN
                  LEDGER_REASON = f'read failed ({detail})'
                  print(f'WARNING: the delivery ledger could not be read ({detail}) — '
                        f'falling back to the file rule; a KV outage must never '
                        f'stand the fallback ladder down')
                  return UNKNOWN
              try:
                  parsed = json.loads(raw)
              except ValueError as exc:
                  LEDGER_REASON = f'value is not JSON ({exc})'
                  print(f'WARNING: the delivery ledger is not JSON ({exc}) — falling '
                        f'back to the file rule')
                  return UNKNOWN
              days = parsed.get('days') if isinstance(parsed, dict) else None
              entry = (days.get(today) or {}).get(slot) if isinstance(days, dict) else None
              if not isinstance(entry, dict):
                  LEDGER_REASON = f'no entry for {slot} {today}'
                  print(f'the ledger records nothing for {slot} {today} — the file '
                        f'rule alone decides')
                  return UNKNOWN
              # THE ENTRY IS KEPT FOR THE DECISION LINE, not for the verdict:
              # each term below must stay the two adjacent lines that
              # tests/digest/test_fallback_ledger.py mutates by exact string, and
              # an assignment between them would silently turn the mutation
              # proof into a no-op that still passed. The reason is derived from
              # the same entry, one place, below — so the log and the verdict
              # can never describe different facts.
              LEDGER_ENTRY = entry
              if entry.get('ntfy_failed'):
                  return NO_ARM
              if str(entry.get('kind') or '') == KIND_UNAVAILABLE:
                  return NO_ARM
              if entry.get('ntfy_sent_at'):
                  if not send_instant_fits_slot(entry, entry.get('ntfy_sent_at')):
                      return NO_ARM
                  return ARM
              # A `pending` write-ahead entry, or one that never recorded an
              # instant: we cannot say this slot went out, so we do not stand
              # anything down.
              return UNKNOWN

          marked = read_marker()
          armed_by_file = file_arms(marked)
          verdict = ledger_verdict()
          dry_run = os.environ.get('DRY_RUN', 'false').strip().lower() == 'true'
          # A PREBUILD IS NOT A DRY RUN, AND `DRY_RUN` CANNOT TELL THEM APART.
          # A prebuild publishes the page for real -- so `website_ok` is
          # genuinely true -- and pushes nothing, because its notification path
          # runs in payload-only mode. DRY_RUN deliberately stays FALSE for it
          # and NTFY_DRY_RUN carries the payload-only signal instead, so a
          # prebuild read through DRY_RUN alone looks exactly like an ordinary
          # delivered run and gets stood down. Standing it down skips the ntfy
          # step entirely, and that step's dry-run branch is the ONLY place the
          # payload digest-prebuild.yml's seal reads is ever written.
          phase = (os.environ.get('PHASE') or 'full').strip().lower() or 'full'
          prebuild = phase == 'prebuild'
          ntfy_dry_run = (os.environ.get('NTFY_DRY_RUN', 'false').strip().lower()
                          == 'true')
          trigger = (os.environ.get('TRIGGER_SOURCE') or '').strip()

          if isinstance(LEDGER_ENTRY, dict):
              if LEDGER_ENTRY.get('ntfy_failed'):
                  LEDGER_REASON = 'entry records ntfy_failed (a verified push failure)'
              elif str(LEDGER_ENTRY.get('kind') or '') == KIND_UNAVAILABLE:
                  LEDGER_REASON = f'entry kind is {KIND_UNAVAILABLE}'
              elif LEDGER_ENTRY.get('ntfy_sent_at'):
                  if send_instant_fits_slot(LEDGER_ENTRY, LEDGER_ENTRY.get('ntfy_sent_at')):
                      LEDGER_REASON = 'entry records ntfy_sent_at'
                  else:
                      LEDGER_REASON = ('entry ntfy_sent_at '
                                       f'{LEDGER_ENTRY.get("ntfy_sent_at")!r} cannot '
                                       'belong to this slot — not treated as a send')
              else:
                  LEDGER_REASON = ('entry state is %r with no recorded instant'
                                   % (LEDGER_ENTRY.get('state'),))

          # THE BRANCH IS A NAME, NOT A BOOLEAN, AND IT IS PRINTED BEFORE ANY
          # SIDE EFFECT. Four decisions, four names, because the only question
          # anyone reads this log for is "which of these happened" and two of
          # them sharing a name cannot answer it. `fail_open` is the default and
          # it is the important one: the ledger was not consulted, or was
          # consulted and could not say, and the file rule did not stand the
          # ladder down — so the ladder runs, which is the direction an outage
          # must never be able to push it.
          branch = 'fail_open'
          if trigger == 'supersede':
              branch = 'supersede_runs'
          elif verdict == NO_ARM:
              branch = 'verified_failure'
          elif (armed_by_file or verdict == ARM) and not dry_run and not prebuild and not ntfy_dry_run:
              branch = 'noop_ledger' if verdict == ARM else 'noop_marker'
          elif armed_by_file or verdict == ARM:
              # Neither of these push, so no delivery record — from the marker
              # or from the ledger — may suppress either one. They are named
              # apart because "it was a dry run" and "it was a prebuild" are
              # different answers to the only question this log is read for,
              # and a reader who sees the wrong one starts debugging the wrong
              # thing.
              #
              # NAMED FROM THE TWO DISPATCH FACTS, NOT FROM `ntfy_dry_run`. That
              # variable is DERIVED from these two — the phase step sets it from
              # exactly `phase == prebuild or dry_run` — so reading it FIRST
              # called every dry run a prebuild and left
              # `dry_run_not_suppressed` reachable only in an environment this
              # workflow cannot produce (`dry_run=true` with `ntfy_dry_run`
              # false), which is a dead arm dressed up as a live one. The two
              # inputs are independent, so `phase=prebuild` with `dry_run=true`
              # is a real third state, not a tie to break.
              if prebuild and dry_run:
                  branch = 'dry_run_prebuild_not_suppressed'
              elif prebuild:
                  branch = 'prebuild_not_suppressed'
              else:
                  branch = 'dry_run_not_suppressed'

          print(f'fallback decision for {slot} {today}: ledger={verdict} '
                f'({LEDGER_REASON}) file={armed_by_file} dry_run={dry_run} '
                f'phase={phase} ntfy_dry_run={ntfy_dry_run} '
                f'trigger={trigger or "(none)"} branch={branch}')

          if branch == 'supersede_runs':
              # digest-prebuild.yml dispatched this run to REPLACE the degraded
              # push the ledger records. Standing it down on that push's own
              # `ntfy_sent_at` would make the supersede a green run that
              # delivered nothing, and the seal job would never retry.
              print(f'{slot} {today} is a supersede dispatch — the degraded push '
                    f'it replaces is exactly what `ntfy_sent_at` records, so no '
                    f'delivery record may suppress this run')
          elif branch == 'verified_failure':
              # The Worker's own record says this slot did NOT give the owner a
              # digest. Standing the ladder down now would lose the day with
              # every job green, which is the outcome this check exists to stop.
              print(f'{slot} {today} was NOT delivered (ntfy_failed, or the only '
                    f'push was the {KIND_UNAVAILABLE} notice) — the email and '
                    f'Telegram fallback must run')
          elif branch in ('noop_ledger', 'noop_marker'):
              source = 'delivery ledger' if verdict == ARM else 'marker file'
              line = (f'{slot} digest for {today} already sent via worker '
                      f'({source}) — fallback no-op')
              print(line)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                  fh.write(f'- {line}\n')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
                  fh.write('FALLBACK_NOOP=true\n')
          elif branch == 'dry_run_prebuild_not_suppressed':
              # BOTH FACTS AT ONCE. A dispatched `phase=prebuild` dry run: it
              # publishes nothing and pushes nothing, and it is still the run
              # whose payload-only branch writes the payload the seal job reads.
              # Neither half of that may be stood down by a delivery record, so
              # this one runs for the union of the two reasons below.
              print(f'{slot} {today} is recorded as delivered, but this run is '
                    f'BOTH a DRY RUN and a PREBUILD (dry, phase payload-only): '
                    f'it pushes nothing, no delivery record may suppress it, and '
                    f'it still produces the payload the seal reads — it runs')
          elif branch == 'prebuild_not_suppressed':
              # A prebuild published the page and pushed nothing, so the same
              # delivery record that arms an ordinary run must not touch it.
              # Standing it down skips the ntfy step -- and with it the only
              # write of the payload the seal job reads -- so the artifact is
              # never sealed and the owner's 07:20 push never gets its full
              # digest, with every job in the repository green.
              print(f'{slot} {today} is recorded as delivered, but this run is a '
                    f'PREBUILD (phase, payload-only): it publishes the page and '
                    f'pushes nothing, so no delivery record may suppress it — it '
                    f'runs and produces the payload the seal reads')
          elif branch == 'dry_run_not_suppressed':
              # A dry run pushes nothing, so no delivery record — from the
              # marker or from the ledger — may suppress it. This is the
              # drift canary's own run, and skipping it would retire an
              # end-to-end check without failing anything.
              print(f'{slot} {today} is recorded as delivered, but this run is a '
                    f'DRY RUN, which no delivery record may suppress — it runs')
          else:
              print(f'{slot} {today}: nothing consulted suppresses this run, so the '
                    f'ladder runs — a KV problem must never disable the fallback')
          PY

      - name: Clean stale generated files
        if: env.FALLBACK_NOOP != 'true'
        # Runs BEFORE any timing entries are written: it removes
        # state/timings.json, so placing it after "Record checkout timing"
        # would erase the checkout entry (observed in run 32837903337).
        # Never touches state/history.json or state/digest-archive/.
        run: |
          set -eo pipefail
          rm -f state/stories.json state/stories.validated.json state/email.html state/email.txt state/candidates.json state/timings.json state/.website_ok state/.ntfy_ok state/.gmail_ok state/.telegram_ok

      - name: Record checkout timing
        if: env.FALLBACK_NOOP != 'true'
        run: |
          set -eo pipefail
          now=$(date +%s)
          echo "CHECKOUT_END=$now" >> "$GITHUB_ENV"
          STAGE_KEY=checkout STAGE_DUR=$((now - RUN_START)) python3 -c "import json,os;p='state/timings.json';os.makedirs(os.path.dirname(p) or '.',exist_ok=True);d=json.load(open(p)) if os.path.isfile(p) else {};d[os.environ['STAGE_KEY']]=int(os.environ['STAGE_DUR']);json.dump(d,open(p,'w'),indent=2)"

      - name: Setup Node.js
        if: env.FALLBACK_NOOP != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenCode CLI
        if: env.FALLBACK_NOOP != 'true'
        # Pin comes from config/opencode.json (single source of truth — never
        # hardcode a version here, never use `latest`). The 1.x/lildax note
        # applies only to the anomalyco fork, not the official opencode-ai
        # package. Provider gate requires >= min_version from the same config
        # (run 35171159132 failed on the old 0.0.0-beta-17823 pin). To bump:
        # verify the target version exists (npm view opencode-ai@<version>
        # version), update config/opencode.json, then confirm the
        # "Verify OpenCode installation" step passes.
        run: npm install -g "$(jq -r .pin config/opencode.json)"

      - name: Verify OpenCode installation
        if: env.FALLBACK_NOOP != 'true'
        # Fail-fast gate BEFORE the 35-min agent step: version floor plus a
        # flag-drift canary. v1 `run` must accept --auto/--model and must NOT
        # know --standalone (v2/opencode2-only) — two silent digest kills in
        # 2 days came from CLI/ladder/flag drift, so this gate runs first.
        run: |
          set -eo pipefail
          opencode --version
          ver="$(opencode --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          req="$(jq -r .min_version config/opencode.json)"
          [ "$(printf '%s\n%s\n' "$req" "$ver" | sort -V | head -n1)" = "$req" ] || { echo "FATAL: opencode $ver < required $req (config/opencode.json)"; exit 1; }
          help_out="$(opencode run --help 2>&1)"
          printf '%s' "$help_out" | grep -q -- --auto || { echo "FATAL: opencode run lacks --auto (config/opencode.json flags)"; exit 1; }
          printf '%s' "$help_out" | grep -q -- --model || { echo "FATAL: opencode run lacks --model (config/opencode.json flags)"; exit 1; }
          if printf '%s' "$help_out" | grep -q -- --standalone; then echo "FATAL: opencode run exposes --standalone (v2-only flag drift)"; exit 1; fi
          echo "OpenCode verify OK: $ver (min $req), flags --auto/--model present, --standalone absent"

      - name: Prepare state directory
        if: env.FALLBACK_NOOP != 'true'
        run: |
          set -eo pipefail
          mkdir -p state

      - name: Verify required files exist
        if: env.FALLBACK_NOOP != 'true'
        run: |
          set -eo pipefail
          for f in \
            config/interests.yml \
            prompts/daily-digest.md \
            templates/email.html \
            scripts/collect_news.py \
            scripts/validate_stories.py \
            scripts/enrich_media.py \
            scripts/build_email.py \
            scripts/update_history.py; do
            test -f "$f" || { echo "ERROR: required file missing: $f"; exit 1; }
          done
          END=$(date +%s)
          STAGE_KEY=setup STAGE_DUR=$((END - CHECKOUT_END)) python3 -c "import json,os;p='state/timings.json';os.makedirs(os.path.dirname(p) or '.',exist_ok=True);d=json.load(open(p)) if os.path.isfile(p) else {};d[os.environ['STAGE_KEY']]=int(os.environ['STAGE_DUR']);json.dump(d,open(p,'w'),indent=2)"

      - name: Collect news candidates (Stage-A)
        if: env.FALLBACK_NOOP != 'true'
        # Deterministic pre-collection so the agent classifies candidates
        # instead of spending its budget on 20+ searches. Never fatal: on
        # failure the agent still runs and handles empty/absent candidates
        # per its FAILURE MODE section.
        timeout-minutes: 3
        continue-on-error: true
        run: |
          set -eo pipefail
          START=$(date +%s)
          rc=0
          python3 scripts/collect_news.py \
            --out state/candidates.json \
            --interests config/interests.yml \
            --timings state/timings.json || rc=$?
          END=$(date +%s)
          STAGE_KEY=collect STAGE_DUR=$((END-START)) python3 -c "import json,os;p='state/timings.json';os.makedirs(os.path.dirname(p) or '.',exist_ok=True);d=json.load(open(p)) if os.path.isfile(p) else {};d[os.environ['STAGE_KEY']]=int(os.environ['STAGE_DUR']);json.dump(d,open(p,'w'),indent=2)"
          if [ "$rc" != "0" ]; then
            echo "::warning::Stage-A collector failed (exit $rc) — agent continues with empty/absent candidates"
          fi
          if [ ! -f state/candidates.json ]; then
            printf '{"collected_at":null,"sources_ok":[],"sources_failed":["collector_produced_no_file"],"weather_summary":"","candidates":[]}\n' > state/candidates.json
          fi
          exit 0

      - name: Check the owner profile
        if: env.FALLBACK_NOOP != 'true'
        # A malformed profile fails LOUDLY here, before the agent spends a
        # model call and before weather_advice.py can emit a perfectly
        # well-formed verdict for the wrong place. The engine's own contract
        # is that a bad profile is never defaulted (see its module docstring):
        # a defaulted profile yields plausible advice about the wrong town and
        # the owner would have no way to know. Cheap, offline, stdlib only.
        # Deliberately NOT continue-on-error: a broken profile must not be
        # able to produce a digest that looks fine and advises badly.
        run: python3 scripts/weather_advice.py --check config/profile.yml

      - name: Decide the model budget from what was collected
        if: env.FALLBACK_NOOP != 'true'
        # A run with nothing to write still produces a digest -- the prompt's
        # FAILURE MODE fixes what that digest is (research_status "limited", the
        # reason in `notes`) and forbids answering an empty collection with
        # supplemental re-collection. So this step chooses BETWEEN two walks; it
        # never skips the agent. An empty collection gets the selector's no-work
        # walk, a usable one keeps the full walk. Measured waste it removes: nine
        # October runs spent 1,168-1,936s each and produced nothing.
        #
        # ONE RETRY, AND ONLY FOR A FETCH FAILURE. A missing or unparseable file,
        # or a populated `sources_failed`, is the collector reporting that it
        # could not FETCH, and that is worth one bounded retry. An empty candidate
        # list with nothing recorded as failed is a quiet news day: re-running a
        # fetch that already succeeded cannot produce news that does not exist.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -eo pipefail

          # Prints: <no_work> <retryable> <reason>
          verdict() {
            python3 - <<'PY'
          import json
          try:
              with open('state/candidates.json', encoding='utf-8') as fh:
                  doc = json.load(fh)
          except (OSError, ValueError) as exc:
              # No readable file is the collector's hardest failure: nothing was
              # fetched, so there is certainly nothing to write.
              print('1 1 no_file_or_unparseable (%s)' % exc.__class__.__name__)
              raise SystemExit(0)
          if not isinstance(doc, dict):
              print('1 1 not_a_json_object')
              raise SystemExit(0)
          candidates = doc.get('candidates')
          failed = doc.get('sources_failed') or []
          if not isinstance(candidates, list):
              print('1 1 candidates_not_a_list')
          elif not candidates and failed:
              print('1 1 empty_candidates_with_failed_sources (%s)'
                    % ','.join(str(name) for name in failed))
          elif not candidates:
              print('1 0 empty_candidates_no_recorded_failure')
          else:
              print('0 0 usable (%d candidate(s))' % len(candidates))
          PY
          }

          read -r NO_WORK RETRYABLE REASON <<<"$(verdict)"
          if [ "$RETRYABLE" = "1" ]; then
            # The Stage-A collector is continue-on-error, so a failed fetch is a
            # warning there and silence by the time the agent starts.
            echo "::warning::Candidate collection failed ($REASON) -- retrying the collector once"
            rc=0
            timeout 180 python3 scripts/collect_news.py \
              --out state/candidates.json \
              --interests config/interests.yml \
              --timings state/timings.json || rc=$?
            [ "$rc" = "0" ] || echo "::warning::collector retry exited $rc"
            read -r NO_WORK RETRYABLE REASON <<<"$(verdict)"
          fi

          echo "MODEL_NO_WORK=$NO_WORK" >> "$GITHUB_ENV"
          if [ "$NO_WORK" = "1" ]; then
            echo "::warning::Nothing to write ($REASON): the agent runs the no-work walk and must still write a 'limited' digest, without supplemental re-collection"
            echo "### Candidate gate: nothing to write ($REASON)" >> "$GITHUB_STEP_SUMMARY"
            echo "The walk is bounded to the selector's no-work budget. The digest is still built, and the pipeline's own measured source_health block still decides the banner and the per-section status lines." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Candidate gate: $REASON -- full model walk"
          fi

      - name: Run OpenCode agent
        if: env.FALLBACK_NOOP != 'true'
        timeout-minutes: 35
        # A DEAD WALK NO LONGER COSTS THE SLOT. This step used to exit 1 on "no
        # digest", which failed the job before the unsummarised fallback below
        # could run. The fallback decides from the FILE, not from this outcome,
        # so a crashed or timed-out step is handled the same way as a clean miss.
        continue-on-error: true
        # The agent writes state/stories.json itself; stdout is only logged to
        # state/agent-log.txt for debugging and is never parsed for success.
        env:
          TODAY: ${{ env.TODAY }}
          DIGEST_TIME: ${{ steps.digest_time.outputs.time }}
          TZ: Asia/Kathmandu
          CANDIDATES_PATH: ${{ github.workspace }}/state/candidates.json
        run: |
          set -eo pipefail
          START=$(date +%s)
          ok=0
          # Each attempt is externally bounded with GNU timeout, because
          # `opencode run` has no built-in timeout. --auto prevents
          # permission-prompt hangs in non-interactive mode.
          # NOTE: --standalone is v2/opencode2-only (v1 run is already in-process), so it must NOT be passed here.
          # Model ladder: resolved DYNAMICALLY below by scripts/model_selector.py
          # (config/opencode.json supplies the seed, the live provider catalogue
          # supplies the rest) — the SAME selector the breaking path uses, so
          # health memory and discovery are shared. NEVER hardcode models here.
          #
          # THE WALK, and why it is not a fixed count. Run 39117668287 discovered
          # ten free models and walked exactly three: two hit the 600s cap, the
          # third exited 1, and the slot ended with NO digest while seven models
          # sat untried. A re-run minutes later succeeded on the first model in
          # ~5 min. So the count is gone: --all returns the whole ranked pool and
          # THIS loop bounds the walk by wall clock. A model that dies now costs
          # one per-attempt timeout instead of the whole slot.
          #
          # `--no-work` (set by the candidate gate) does not change WHAT the
          # agent must produce -- the prompt's FAILURE MODE still requires the
          # 'limited' digest -- it only stops a run with nothing to write from
          # spending the full walk on a file write. The budget itself stays in
          # model_selector.py: this step names the case, never the number.
          NO_WORK_ARGS=()
          if [ "${MODEL_NO_WORK:-0}" = "1" ]; then NO_WORK_ARGS=(--no-work); fi
          # THE LADDER IS RESOLVED PER CYCLE, not once per run. A "cycle" is one
          # pass down the ranked pool. The free pool is throttled per IP bucket,
          # so the same twelve models that all refuse in one second answer fine
          # minutes later -- and after the backoff this must re-read the pool:
          # the cooldown file is re-loaded and pruned, so a model skipped in
          # cycle 1 is eligible again in cycle 2 once its entry has expired.
          resolve_ladder() {
            # --role digest: the digest is the caller the shared-pool cooldown
            # RESERVES the pool for, so it may re-test a wall it has watched for
            # longer than the grace (see POOL_DIGEST_GRACE_SEC). Every other
            # workflow yields to it instead.
            mapfile -t models < <(python3 scripts/model_selector.py --select \
              --role digest \
              --config config/opencode.json --health state/model_health.json \
              --cache state/model_cache.json --info-out state/digest_model_select.json \
              --all "${NO_WORK_ARGS[@]}")
            # AN EMPTY LIST HAS THREE VERY DIFFERENT CAUSES and the step must name
            # the right one. "All cooled down" means the ladder is real and every
            # rung is temporarily barred; a POOL wall means the bucket refused a
            # short while ago and no id can be tried at all. Reporting either as
            # "nothing was discovered" would send the next reader to the wrong
            # file entirely.
            if [ "${#models[@]}" -eq 0 ]; then
              if [ "$(jq -r '.pool_blocked // false' state/digest_model_select.json 2>/dev/null || echo false)" = "true" ]; then
                echo "FATAL: the SHARED POOL is on cooldown -- $(jq -r '.pool.note // ""' state/digest_model_select.json 2>/dev/null). No model id can be tried: the free pool refuses before generation, so every rung would hear the same refusal. Not an empty ladder and not a broken id. The refire slot retries this edition."
              elif [ "$(jq -r '.all_cooled // false' state/digest_model_select.json 2>/dev/null || echo false)" = "true" ]; then
                echo "FATAL: every model is on a hard cooldown ($(jq -rc '.hard_cooled_down // []' state/digest_model_select.json 2>/dev/null || echo '[]')) -- no attempt can be made until one expires. This is the cooldown, not an empty ladder."
              else
                echo "FATAL: empty model ladder - nothing was discovered and config/opencode.json has no seed"
              fi
              exit 1
            fi
            python3 -c "import json;d=json.load(open('state/digest_model_select.json'));print('model ladder: source=%s provider=%s selected=%s cooled_down=%s hard_cooled_down=%s all_cooled=%s dropped_seed=%s dropped_seed_evidence=%s error=%s' % (d.get('source'),d.get('provider'),d.get('selected'),d.get('cooled_down'),d.get('hard_cooled_down'),d.get('all_cooled'),d.get('dropped_seed'),d.get('dropped_seed_evidence'),d.get('error')))" || true
          }
          resolve_ladder
          # The budget is stated ONCE, by the selector, and read back here. The
          # `// N` defaults plus the `case` guards keep this working when the
          # info file is missing or unwritable (--info-out is best-effort).
          BUDGET=$(jq -r '.total_budget_sec // 1800' state/digest_model_select.json 2>/dev/null || echo 1800)
          PER=$(jq -r '.per_attempt_sec // 360' state/digest_model_select.json 2>/dev/null || echo 360)
          MIN=$(jq -r '.min_attempt_sec // 90' state/digest_model_select.json 2>/dev/null || echo 90)
          # The no-progress window is PER MODEL and lives in the selector: the
          # watchdog is handed the model id and looks up its own measured
          # window (deepseek 60s, beam 240s, everything else 60s). A single
          # global number cannot serve both -- 60s for beam, measured at
          # 137.63s to first token, would make it unreachable forever.
          case "$BUDGET" in ''|*[!0-9]*) BUDGET=1800;; esac
          case "$PER" in ''|*[!0-9]*) PER=360;; esac
          case "$MIN" in ''|*[!0-9]*) MIN=90;; esac
          deadline=$(( $(date +%s) + BUDGET ))
          tried=0
          last_err="unknown"
          cycle=0
          contention_only=0
          pool_walled=0
          # ONE reduced-candidate retry per run, not per model: the point is to
          # re-test the SAME model on a smaller input, and a per-model allowance
          # would multiply the walk by the ladder length, which is the burn this
          # whole change exists to remove.
          reduced_retry_used=0
          # THE RETRY LADDER, and why these numbers are what they are now.
          #
          # MEASURED BURN, 2026-10-27: 112 model attempts in one day on this
          # workflow alone (181 in the week, 62% of the repo's total). The
          # multiplier was this loop: `--all` returns the whole ranked pool and
          # four cycles of it is a 48-attempt ceiling per slot, with 21 minutes of
          # sleep inside a 30-minute step.
          #
          # The premise of the backoff was that contention clears in minutes and a
          # nap outlasts it. Both halves are now handled better and cheaper: the
          # refusal is pre-generation and SHARED (so the pool cooldown records it
          # once and the walk stops), and the refire slot retries the edition with
          # a fresh 1800s budget instead of spending this one on sleep. So the
          # bound is one cycle. The machinery below is kept, not deleted: it still
          # guards the case where a cycle ends with quota refusals that did not
          # trip the pool row, and deleting a tested loop to save lines is not a
          # reduction in burn.
          RETRY_BACKOFF=(180 360 720)
          RETRY_MAX_CYCLES=1
          # AN AUTH REFUSAL IS PER MODEL UNTIL IT REPEATS. Measured 2026-10-27
          # 16:18Z: the walk stopped after attempt 10 of 12 -- abandoning six
          # quota refusals that had just proved the pool was throttled, so the
          # 3/6/12-minute backoff cycles never ran -- on an `auth` that was a
          # millisecond stamp (`.401Z`) read as a 401. One model refusing its
          # credentials is that model's entitlement; the SAME refusal from two
          # different models is the shared credential, and only that is fatal.
          AUTH_GLOBAL_MODELS=2
          # ONE attempt = one model, one candidate set. Extracted because the
          # bounded reduced-candidate retry must run the IDENTICAL pipeline: a
          # near-copy would drift, and a retry that differs from the attempt it
          # retries proves nothing about input size.
          run_digest_attempt() {
            model="$1"
            allow="$2"
            echo "=== Attempt $tried with $model (allow ${allow}s) ==="
            run_rc=0
            # The watchdog sits INSIDE `timeout`: timeout still owns the total
            # allowance, and the watchdog owns all three measured deaths -- the
            # decisive error line (~1-2s), the repeating outage (flint printed
            # the same fatal line 5x from 12.6s and burned the lot), and
            # silence, at the window the selector measured for THIS model.
            #
            # --print-logs --log-level DEBUG IS LOAD-BEARING, not debugging
            # decoration. `opencode run` prints a banner at ~5s and then NOTHING
            # until the whole message completes, so stdout can only prove
            # completion; the CLI's own log lines are the only liveness there
            # is. Without them the watchdog would judge every attempt by its
            # startup window and kill working models.
            if python3 scripts/render_prompt.py prompts/daily-digest.md | timeout "$allow" python3 scripts/model_watchdog.py \
              --model "$model" -- \
              opencode run \
              --auto \
              --print-logs \
              --log-level DEBUG \
              --model "$model" \
              2>&1 | tee state/agent-log.txt; then
              :
            else
              run_rc=$?
            fi
          }
          # Success is the FILE, not the exit code; see the note at the call.
          stories_ok() {
            [ "$run_rc" = "0" ] && [ -f state/stories.json ] \
              && python3 -c "import json,sys; json.load(open('state/stories.json'))"
          }
          digest_success() {
            printf '%s attempt=%d model=%s kind=ok rc=%s allow=%s\n' \
              "$(date -u +%FT%TZ)" "$tried" "$1" "$run_rc" "$2" \
              >> state/agent-attempts.log
            echo "Agent wrote valid state/stories.json on attempt $tried ($1)"
            python3 scripts/model_selector.py --record "$1" ok || true
            ok=1
          }
          : > state/agent-attempts.log
          while :; do
            cycle=$((cycle+1))
            if [ "$cycle" -gt 1 ]; then
              echo "Retry cycle $cycle: resetting the ladder (cooldowns re-read; entries that expired during the wait are eligible again)"
              resolve_ladder
            fi
            cycle_quota=0
            cycle_other=0
            cycle_auth=0
            for model in "${models[@]}"; do
              remaining=$(( deadline - $(date +%s) ))
              allow=$(( remaining < PER ? remaining : PER ))
              if [ "$allow" -lt "$MIN" ]; then
                echo "Budget spent: ${remaining}s left, below the ${MIN}s one attempt needs. Stopping after ${tried} of ${#models[@]} models."
                break
              fi
              tried=$((tried+1))
              rm -f state/stories.json
              run_digest_attempt "$model" "$allow"
              # SUCCESS FIRST, AND FROM THE FILE, NOT THE EXIT CODE. Classifying
              # before this check would discard a GOOD digest whose article text
              # happens to contain "rate limit" or "quota" -- the classifier reads
              # the CLI's own words, and a finished digest is full of words. One
              # row per attempt still goes to the log, with kind=ok here.
              if stories_ok; then
                digest_success "$model" "$allow"
                break
              fi
              # NO STORIES FILE, rc 0, AND THE ONE RETRY IS UNSPENT. Measured: a
              # 600s attempt on the full candidate set wrote nothing while a
              # smaller input finished in 23.7s, so the useful second attempt is
              # the SAME model on a SMALLER input -- a different model on the same
              # oversized input repeats the failure and spends the pool. Bounded
              # to one per run (`reduced_retry_used`), so it adds a single attempt
              # and can never double the walk.
              if [ "$run_rc" = "0" ] && [ "$reduced_retry_used" = "0" ] \
                && [ -f state/candidates.json ] \
                && python3 scripts/reduce_candidates.py --in state/candidates.json \
                     --out state/candidates_limited.json --per-category 1; then
                reduced_retry_used=1
                # The prompt names state/candidates.json as PRIMARY INPUT, so the
                # reduced set is swapped INTO that path and the full set restored
                # afterwards: an env var alone would leave the agent reading the
                # oversized file the retry exists to avoid.
                cp state/candidates.json state/candidates.full.json
                cp state/candidates_limited.json state/candidates.json
                tried=$((tried+1))
                rm -f state/stories.json
                echo "Attempt $tried re-tests $model on the reduced candidate set (one bounded retry per run; the full set is restored afterwards)"
                run_digest_attempt "$model" "$allow"
                mv -f state/candidates.full.json state/candidates.json
                if stories_ok; then
                  digest_success "$model" "$allow"
                  break
                fi
              fi
              # CLASSIFY a real failure, then act. `UnknownError` alone is an
              # outage and a missing model is a not-found ONLY when the marker is
              # present. The watchdog already wrote its own marker into this log,
              # so the decision is reproducible from the log alone.
              kind=$(python3 scripts/model_selector.py --classify \
                --log state/agent-log.txt --rc "$run_rc" 2>/dev/null || echo other)
              case "$kind" in
                model_not_found|quota_or_rate_limited|auth|provider_outage|slow_or_stalled|other) ;;
                *) kind="other" ;;
              esac
              printf '%s attempt=%d model=%s kind=%s rc=%s allow=%s\n' \
                "$(date -u +%FT%TZ)" "$tried" "$model" "$kind" "$run_rc" "$allow" \
                >> state/agent-attempts.log
              if [ "$kind" = "model_not_found" ] || [ "$kind" = "quota_or_rate_limited" ]; then
                echo "Circuit breaker: $model -> $kind. Skipping to the next model without spending the allowance."
                last_err="$kind on $model"
                # THE COUNTER THAT DECIDES A RETRY. Only a cycle in which EVERY
                # failure was this transient class may back off and try again:
                # a not-found is a wrong id, and repeated attempts at it are
                # exactly the 4-of-12 waste the cooldown removes.
                if [ "$kind" = "quota_or_rate_limited" ]; then
                  cycle_quota=$((cycle_quota+1))
                else
                  cycle_other=$((cycle_other+1))
                fi
                # RECORD THE REAL CLASS, never a generic "transport". The selector
                # decides what each class costs: a not-found earns a 24h hard
                # cooldown (the id is simply wrong), and a quota is recorded but
                # deliberately NOT cooled down per model, because the whole free
                # pool shares that limit.
                python3 scripts/model_selector.py --record "$model" "$kind" || true
                if [ "$kind" = "quota_or_rate_limited" ]; then
                  # THE WALK ENDS HERE, AND THE REASON IS MEASURED. The provider
                  # refuses BEFORE generation (312ms after `message=stream`, with
                  # tokens.input=0) and does it to six different ids inside 16s,
                  # so the remaining rungs cannot learn anything the first one did
                  # not. On 2026-10-27 that cost 33 of the week's 47 quota
                  # refusals. One shared-pool row is written instead -- with the
                  # provider's own Retry-After when it gave one -- so the NEXT run
                  # (and the refire slot) starts from the fact rather than
                  # rediscovering it.
                  python3 scripts/model_selector.py --pool-refused \
                    --log state/agent-log.txt || true
                  echo "Shared pool refused ($kind on $model). The refusal is pre-generation and shared by every id on this bucket, so the rest of the ladder would spend one allowance each to hear the same thing. Recording the pool cooldown and ending the walk; the refire slot retries the edition."
                  last_err="$kind on $model (shared pool)"
                  pool_walled=1
                  break
                fi
                continue
              fi
              if [ "$kind" = "auth" ]; then
                # PER MODEL, NOT PER PROVIDER -- until it repeats. See
                # AUTH_GLOBAL_MODELS above for the measurement this replaces: an
                # auth on the FIRST model that reports it aborted a walk six
                # quota refusals deep, and the backoff cycles that exist for
                # exactly that wall never got to run.
                #
                # The credential is shared, so a real bad key fails every model
                # identically; one refusal is a property of the model. So a
                # single auth is recorded, reordered and CONTINUED PAST, and
                # only AUTH_GLOBAL_MODELS distinct refusals in one cycle stop
                # the walk -- which is still fast, still names the cause, and no
                # longer costs the slot.
                cycle_auth=$((cycle_auth+1))
                # Recorded as `auth`, not `transport`: the selector cools down
                # nothing for it (quota and auth share that rule -- cooling
                # would remove the pool), but health memory should carry what
                # actually happened.
                python3 scripts/model_selector.py --record "$model" auth || true
                if [ "$cycle_auth" -ge "$AUTH_GLOBAL_MODELS" ]; then
                  echo "Circuit breaker: $model -> auth ($cycle_auth models refused the credential). That is the shared key, not one model; stopping the walk."
                  last_err="auth: $cycle_auth models rejected the credential, walk aborted"
                  cycle_other=$((cycle_other+1))
                  break
                fi
                echo "Circuit breaker: $model -> auth. One model only, so the credential is not the problem; trying the next model."
                last_err="auth on $model"
                # NOT into cycle_other: one model's refusal is not evidence the
                # pool is unusable, and counting it here would end a run whose
                # other ten refusals were quota -- the exact waste this fixes.
                continue
              fi
              cycle_other=$((cycle_other+1))
              if [ "$run_rc" = "0" ]; then
                echo "Attempt $tried finished without a valid state/stories.json"
                last_err="no stories.json"
                python3 scripts/model_selector.py --record "$model" transport || true
              else
                echo "Attempt $tried command failed (rc=$run_rc, kind=$kind)"
                if [ "$run_rc" = "124" ]; then
                  last_err="timeout"
                  python3 scripts/model_selector.py --record "$model" timeout || true
                elif [ "$kind" = "provider_outage" ]; then
                  # RECORDED AS ITSELF so the selector can count a REPEAT. A single
                  # 5xx is still recorded and still reorders the next run, but it
                  # only earns a short hard cooldown on the second hit -- one bad
                  # second must not remove a model from the walk.
                  last_err="command failed rc=$run_rc"
                  python3 scripts/model_selector.py --record "$model" provider_outage || true
                else
                  last_err="command failed rc=$run_rc"
                  python3 scripts/model_selector.py --record "$model" transport || true
                fi
              fi
            done
            # A SUCCESS ENDS THE WALK, not just this cycle.
            if [ "$ok" = "1" ]; then
              break
            fi
            # A POOL WALL ENDS THE WALK TOO, AND WITH NO NAP. The old shape slept
            # 3, then 6, then 12 minutes inside this step to outlast a throttle
            # that clears in ~43s -- spending the same 1800s walk bound that the
            # delivery stages need, to buy attempts the pool had already refused.
            # The refire slot (+5/+10/+15/+20 min) is the retry, with a fresh
            # budget and a fresh reading of the cooldown file.
            if [ "$pool_walled" = "1" ]; then
              contention_only=1
              break
            fi
            # THE RETRY DECISION IS DELIBERATELY NARROW. A cycle in which EVERY
            # failure was quota_or_rate_limited is contention, and contention is
            # the one class that clears by itself (measured: 5/5 answered in
            # 33-44s each minutes after a wall of 1s refusals). Anything else --
            # a wrong id, a timeout, a 5xx -- keeps its own cooldown and ends the
            # walk, because repeating it buys nothing and costs the slot.
            # A SINGLE `auth` IS NOT ON THAT LIST any more: it is one model's
            # refusal, it is not evidence about the pool, and counting it here is
            # what turned one misread line into a lost edition. Two of them stop
            # the walk inside the model loop instead (AUTH_GLOBAL_MODELS).
            if [ "$cycle_quota" -le 0 ] || [ "$cycle_other" -gt 0 ]; then
              break
            fi
            contention_only=1
            if [ "$cycle" -ge "$RETRY_MAX_CYCLES" ]; then
              echo "Quota contention: cycle $cycle tried ${#models[@]} models and every one returned quota_or_rate_limited; still throttled after $((cycle-1)) backoff(s), and this run's ${RETRY_MAX_CYCLES}-cycle bound is spent. Stopping the walk -- the model ids are not the problem."
              break
            fi
            # THE CLAMP THAT PROTECTS THE DELIVERY STAGES. A wait may only take
            # what still leaves one attempt's worth of time inside the walk's own
            # deadline, so the 10 minutes between this step's cap and the job's
            # 45 are never borrowed by a retry.
            remaining=$(( deadline - $(date +%s) ))
            room=$(( remaining - MIN ))
            if [ "$room" -lt 1 ]; then
              echo "Quota contention: cycle $cycle tried ${#models[@]} models and every one returned quota_or_rate_limited; only ${remaining}s of the ${BUDGET}s walk bound remain, below the ${MIN}s one attempt needs. No retry -- the bound keeps the delivery stages' time intact."
              break
            fi
            backoff=${RETRY_BACKOFF[$((cycle-1))]:-720}
            nap=$(( backoff < room ? backoff : room ))
            next_at=$(python3 -c 'import datetime,sys;print((datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(seconds=int(sys.argv[1]))).strftime("%Y-%m-%dT%H:%M:%SZ"))' "$nap" 2>/dev/null || echo "in ${nap}s")
            echo "Quota contention: cycle $cycle tried ${#models[@]} models and every one returned quota_or_rate_limited (the shared free pool throttling this egress bucket, not a broken id). Backing off ${nap}s; next retry at ${next_at}."
            sleep "$nap"
          done
          END=$(date +%s)
          STAGE_KEY=agent STAGE_DUR=$((END-START)) python3 -c "import json,os;p='state/timings.json';os.makedirs(os.path.dirname(p) or '.',exist_ok=True);d=json.load(open(p)) if os.path.isfile(p) else {};d[os.environ['STAGE_KEY']]=int(os.environ['STAGE_DUR']);json.dump(d,open(p,'w'),indent=2)"
          if [ "$ok" = "1" ] && [ "$cycle" -gt 1 ]; then
            echo "Contention cleared: the digest was produced on walk cycle ${cycle} after $((cycle-1)) backoff(s)."
          fi
          if [ "$ok" != "1" ]; then
            if [ "$pool_walled" = "1" ]; then
              # ONE LINE, AND IT NAMES THE RIGHT CAUSE. "Models are broken" would
              # be false: the ids are advertised and answer minutes later. What
              # happened is that the shared free pool refused BEFORE generation,
              # which is why the walk stopped instead of paying one allowance per
              # rung to hear it again.
              echo "Digest not built: ${tried} attempt(s) over ${cycle} cycle(s) in $(( (END-START+59) / 60 )) min. The walk stopped on the SHARED POOL's contention wall (last error: ${last_err}): the free pool refuses before generation, so every remaining rung would have heard the same refusal and spent an attempt doing it. A shared cooldown was recorded; the refire slot retries this edition with a fresh budget. This is transient throttling of the shared anonymous pool this egress sits behind -- not the account's own allowance and not broken model ids."
            elif [ "$contention_only" = "1" ]; then
              # ONE LINE, AND IT NAMES THE RIGHT CAUSE. "Models are broken" would
              # be false: the ids are advertised and answer minutes later. What
              # ran out is the walk's bound, against a per-IP throttle that this
              # runner shares with every other Azure egress address.
              echo "Digest not built: ${tried} attempt(s) over ${cycle} cycle(s) in $(( (END-START+59) / 60 )) min. Every model was refused by the free pool's CONTENTION wall (quota_or_rate_limited, last error: ${last_err}) and the walk's ${BUDGET}s bound ran out before the throttle cleared. This is transient throttling of the shared anonymous pool this egress sits behind -- not the account's own allowance and not broken model ids. The next scheduled run will retry."
            else
              echo "Digest not built: ${tried} of ${#models[@]} free models tried in $(( (END-START+59) / 60 )) min, none produced a digest (last error: ${last_err}). The next scheduled run will retry."
            fi
            tail -n 50 state/agent-log.txt || true
            exit 1
          fi

      - name: Derive the unsummarised edition
        if: env.FALLBACK_NOOP != 'true'
        # NO MODEL IN THIS STEP. When the walk above produced no usable
        # state/stories.json, the collector's own candidates are the edition:
        # headlines, links and hosts, with no summary written by anything. The
        # page, email and push all say so, so an unlabelled empty summary can
        # never be read as a real one. It is skipped whenever the agent DID
        # write stories, so a normal run is unchanged.
        env:
          TODAY: ${{ env.TODAY }}
          DIGEST_TIME: ${{ steps.digest_time.outputs.time }}
        run: |
          set -eo pipefail
          HAVE=0
          if [ -f state/stories.json ] && python3 -c "import json,sys; d=json.load(open('state/stories.json')); sys.exit(0 if isinstance(d.get('stories'), list) and d['stories'] else 1)" 2>/dev/null; then
            HAVE=1
          fi
          if [ "$HAVE" = "1" ]; then
            echo "A model-written digest exists; the unsummarised fallback is not used."
            exit 0
          fi
          if [ ! -s state/candidates.json ]; then
            echo "::warning::No collected candidates to derive from -- the empty-outcome path owns this run."
            exit 0
          fi
          # Below the floor the deriver writes NOTHING and exits 0 on purpose:
          # the existing empty-digest classification is the owner of that case.
          echo "::warning::No digest from the model walk -- deriving the unsummarised edition from the collected candidates (no AI)."
          echo "### Unsummarised edition (no AI today)" >> "$GITHUB_STEP_SUMMARY"
          START=$(date +%s)
          python3 scripts/derive_unsummarised.py \
            --candidates state/candidates.json \
            --out state/stories.json \
            --today "$TODAY" \
            --slot "$DIGEST_TIME"
          END=$(date +%s)
          STAGE_KEY=derive STAGE_DUR=$((END-START)) python3 -c "import json,os;p='state/timings.json';os.makedirs(os.path.dirname(p) or '.',exist_ok=True);d=json.load(open(p)) if os.path.isfile(p) else {};d[os.environ['STAGE_KEY']]=int(os.environ['STAGE_DUR']);json.dump(d,open(p,'w'),indent=2)"

      - name: Validate stories
        if: env.FALLBACK_NOOP != 'true'
        run: |
          set -eo pipefail
          START=$(date +%s)
          rc=0
          python3 scripts/validate_stories.py \
            --in state/stories.json \
            --out state/stories.validated.json \
            --history state/history.json \
            --today "$TODAY" \
            --config-dir config 2>&1 | tee /tmp/validate.log || rc=$?
          END=$(date +%s)
          STAGE_KEY=validate STAGE_DUR=$((END-START)) python3 -c "import json,os;p='state/timings.json';os.makedirs(os.path.dirname(p) or '.',exist_ok=True);d=json.load(open(p)) if os.path.isfile(p) else {};d[os.environ['STAGE_KEY']]=int(os.environ['STAGE_DUR']);json.dump(d,open(p,'w'),indent=2)"
          tail -n 40 /tmp/validate.log || true
          case "$rc" in
            0)
              echo "Validation passed"
              ;;
            2)
              # `::error::`, NOT `::warning::`. Exit 2 keeps its meaning ("the
              # validator produced no stories"), but downgrading it to a
              # warning is what let a zero-story run finish green: the marker
              # recorded a delivery and the fallback ladder stayed asleep. The
              # run now ends red (see "Assert digest is not empty") and the
              # empty_kind in state/stories.validated.json decides whether the
              # owner gets a priority-3 notice or a priority-5 page.
              echo "::error::No stories survived validation — building empty-digest email (exit 2)"
              echo "VALIDATE_NOTICE=no-stories-survived" >> "$GITHUB_ENV"
              echo "VALIDATE_EXIT=2" >> "$GITHUB_ENV"
              # Set ONLY on the empty case. Read by the Pages deploy's `if:`,
              # below: a zero-story digest must not publish a page at the stable
              # slot URL. The ntfy/Gmail/Telegram steps are deliberately NOT
              # gated -- a zero-story slot still ships the labelled RECAP
              # (priority 3) or DEGRADED (priority 5) notice, per the owner rule.
              echo "EMPTY_DIGEST=true" >> "$GITHUB_ENV"
              echo "### Validation notice: no stories survived; building empty-digest email" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "FATAL: validate_stories.py failed with exit code $rc"
              exit "$rc"
              ;;
          esac

      - name: Enrich stories with media (og:image/video)
        if: env.FALLBACK_NOOP != 'true'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -eo pipefail
          rc=0
          python3 scripts/enrich_media.py || rc=$?
          if [ "$rc" != "0" ]; then
            # Every non-zero exit from enrich_media.py means the input could
            # not be READ (missing / unparseable / not a list and not
            # {"stories": [...]}). Per-story enrichment failures (network,
            # missing og: tags) never change the exit code, so this is never
            # a transient hiccup and must not look like "nothing to enrich".
            # The step itself stays tolerant -- hard-failing here would skip
            # every delivery step below, since they all gate on success() --
            # so the loud signal is this annotation, which GitHub surfaces on
            # the run summary even while the step is neutral.
            echo "::error::enrich_media.py exited $rc - state/stories.validated.json was unreadable, so media enrichment was skipped (see this step's log for the file and exception)"
          fi
          exit 0

      - name: Build email
        if: env.FALLBACK_NOOP != 'true'
        run: |
          set -eo pipefail
          START=$(date +%s)
          python3 scripts/build_email.py \
            --in state/stories.validated.json \
            --out-html state/email.html \
            --out-text state/email.txt \
            --template templates/email.html
          END=$(date +%s)
          STAGE_KEY=build STAGE_DUR=$((END-START)) python3 -c "import json,os;p='state/timings.json';os.makedirs(os.path.dirname(p) or '.',exist_ok=True);d=json.load(open(p)) if os.path.isfile(p) else {};d[os.environ['STAGE_KEY']]=int(os.environ['STAGE_DUR']);json.dump(d,open(p,'w'),indent=2)"
          test -s state/email.html || { echo "FATAL: state/email.html missing or empty"; exit 1; }
          test -s state/email.txt || { echo "FATAL: state/email.txt missing or empty"; exit 1; }

      - name: Render digest HTML
        if: env.FALLBACK_NOOP != 'true'
        # Best-effort: a render failure is logged but never blocks the
        # email/Telegram/ntfy sends.
        continue-on-error: true
        env:
          DIGEST_TIME: ${{ steps.digest_time.outputs.time }}
          TODAY: ${{ env.TODAY }}
          # Belt-and-braces: the renderer already shifts to NPT (+05:45)
          # explicitly, but the footer clock must never depend on the runner's
          # local zone either.
          TZ: Asia/Kathmandu
        run: |
          set -eo pipefail
          # ONE PAGE PER (date, slot), AND IT IS ALWAYS THE NEWEST BUILD OF IT.
          #
          # scripts/render_digest.py:3002 writes
          #   out_name = "%s-%s.html" % (args.date, args.digest_time)
          # with an unconditional `open(out_path, "w")`. So two builds of one
          # slot are two writes to ONE filename, and the second erases the first
          # with nothing recorded. On the evening of 2026-10-13 that is exactly
          # what happened: the 19:25 NPT push linked to
          # `/digests/2026-10-13-evening.html`, and by the time the owner opened
          # it the 19:40 push had replaced the file with the 19:24 content. The
          # notification body and the page behind its link disagreed, and the
          # 18:44 stories it advertised (BLEACH, Character.ai, the highway
          # food-safety item) existed nowhere on the machine.
          #
          # WHY NOT SUFFIX THE FILENAME. A build-suffixed page --
          # `2026-10-13-evening-1924.html` -- is invisible to the archive.
          # render_index (scripts/render_digest.py:2630) scans out_dir with
          #   ^(\d{4}-\d{2}-\d{2})-(morning|evening)\.html$
          # and skips anything that does not match, so every displaced build
          # would silently vanish from the index the owner actually browses. It
          # would also break every link already saved from a notification. One
          # stable URL per (date, slot) is the property worth keeping: it is what
          # the owner's saved notification points at.
          #
          # SO: the page at the stable URL may only ever get NEWER, and the
          # build that loses is archived rather than destroyed. Three steps,
          # and the backup is taken BEFORE the renderer is allowed to open the
          # file for writing.
          target="docs/digests/${TODAY}-${DIGEST_TIME}.html"
          mkdir -p state/digest-archive
          backup="state/.page-backup-${TODAY}-${DIGEST_TIME}.html"
          rm -f "$backup"
          [ -f "$target" ] && cp "$target" "$backup" || true

          python3 scripts/render_digest.py \
            --digest-time ${{ steps.digest_time.outputs.time }} \
            --date ${{ env.TODAY }} \
            --email-txt state/email.txt \
            --stories-json state/stories.validated.json \
            --out-dir docs/digests \
            --index docs/index.html

          # Compare the two builds and let only the newer one own the URL.
          # The build time is scraped from the page's own footer --
          # "Generated by Personal News Informer - YYYY-MM-DD HH:MM NPT" -- so
          # the comparison needs no second source of truth and no state file
          # that could disagree with the bytes it describes.
          TARGET_PAGE="$target" BACKUP_PAGE="$backup" ARCHIVE_DIR="state/digest-archive" \
          TODAY="$TODAY" DIGEST_TIME="$DIGEST_TIME" python3 - <<'PY'
          import os, re, shutil, sys

          FOOTER = re.compile(
              r'Generated by Personal News Informer\s+[\u00b7\u2014-]\s*'
              r'(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s+NPT')

          def regenerate_index():
              """Redo docs/index.html so it describes the bytes now on disk.

              render_digest.py regenerated the index from the page it had just
              written. Every path below that puts the OLDER page back therefore
              leaves an index whose story counts and thumbnail were scraped from
              a page that is no longer there -- which is the same class of lie
              this whole step exists to prevent, one level up. render_index is
              CALLED here rather than reimplemented: scripts/render_digest.py
              owns the archive markup and this step must not grow a second
              opinion of what an archive page looks like.

              `current_time` is accepted by render_index and deliberately not
              rendered, so the value passed here cannot change the output.
              """
              try:
                  sys.path.insert(0, 'scripts')
                  import render_digest
              except ImportError as exc:
                  print('WARNING: could not regenerate the archive index (%s); '
                        'it may describe the displaced page'
                        % exc.__class__.__name__)
                  return
              ok = render_digest.render_index('docs/digests', 'docs/index.html',
                                              os.environ['TODAY'],
                                              os.environ.get('NOW_LABEL', ''))
              print('archive: index regenerated after the swap (%s)'
                    % ('ok' if ok else 'FAILED'))

          def built_at(path):
              """The page's own build time, or None when it cannot be read.

              None NEVER means "newer". An unreadable or unrecognisable page is
              reported as unknown so the caller can refuse to overwrite it,
              because the one thing this guard must never do is silently
              replace a page it could not date.
              """
              try:
                  with open(path, encoding='utf-8', errors='replace') as fh:
                      match = FOOTER.search(fh.read())
              except OSError:
                  return None
              return match.group(1) if match else None

          def archive(page, tag):
              """Keep a displaced build. Never overwrites, never raises.

              THE DESTINATION IS CREATED HERE, NOT ASSUMED. This function is the
              only thing standing between a displaced build and being erased, so
              a retention guarantee that depends on a `mkdir -p` in a different
              shell block is not a guarantee: the moment that line is edited,
              reordered or dropped, every archived build disappears and the only
              trace is the warning below. Measured on 2026-10-13 exactly that
              way --
                  WARNING: could not archive the displaced stale-build page
                  ([Errno 2] No such file or directory: .../digest-archive/...)
              -- which is a silent loss dressed as a log line.
              """
              try:
                  os.makedirs(os.environ['ARCHIVE_DIR'], exist_ok=True)
                  stamp = (built_at(page) or 'unknown').replace(':', '').replace(' ', '-')
                  name = '%s-%s-%s-%s.html' % (os.environ['TODAY'],
                                               os.environ['DIGEST_TIME'],
                                               tag, stamp)
                  out = os.path.join(os.environ['ARCHIVE_DIR'], name)
                  n = 2
                  while os.path.exists(out):
                      out = os.path.join(os.environ['ARCHIVE_DIR'],
                                         '%s-%d.html' % (name[:-5], n))
                      n += 1
                  shutil.copyfile(page, out)
                  print('archive: %s kept as %s' % (tag, out))
                  return out
              except OSError as exc:
                  print('WARNING: could not archive the displaced %s page (%s)'
                        % (tag, exc))
                  return None

          target = os.environ['TARGET_PAGE']
          backup = os.environ['BACKUP_PAGE']
          have_backup = os.path.isfile(backup) and os.path.getsize(backup) > 0

          if not have_backup:
              # First build of this slot. The page the renderer just wrote is
              # the only one that has ever existed, so there is nothing to
              # compare and nothing to keep.
              print('archive: no previous %s %s page; this build owns the URL'
                    % (os.environ['TODAY'], os.environ['DIGEST_TIME']))
              sys.exit(0)

          old_at = built_at(backup)
          new_at = built_at(target)
          print('archive: previous page built %s, this build %s'
                % (old_at or 'UNDATEABLE', new_at or 'UNDATEABLE'))

          # Unknown on either side is NOT permission to overwrite. The page that
          # is already published is the one the owner may have open, and a
          # guard that erases it on the strength of a parse failure is the same
          # defect with a different cause.
          if old_at is None or new_at is None:
              # ARCHIVE FIRST. `target` holds the build that is about to be
              # displaced; the very next line overwrites it. Archiving after the
              # copy would archive the WINNER under the loser's name and destroy
              # the build this branch exists to keep.
              archive(target, 'undateable-kept')
              shutil.copyfile(backup, target)
              regenerate_index()
              print('archive: REFUSED to replace a page this step could not date; '
                    'the previously published page is back in place')
              sys.exit(0)

          if new_at > old_at:
              # The normal case: this run is the newer build and may keep the URL.
              # The build it displaces is still kept, so nothing is destroyed.
              archive(backup, 'superseded')
              print('archive: this build (%s) is newer and owns %s' % (new_at, target))
          else:
              # The re-fire case. This build is OLDER -- on 2026-10-13 it was the
              # 18:44 prebuild artifact delivered at 19:40 -- so it may not
              # replace the newer page, and the newer page goes back.
              #
              # ARCHIVE BEFORE THE COPY, NOT AFTER IT. This is the bug this
              # branch had: `target` is the build about to be displaced, so once
              # `copyfile(backup, target)` has run the 18:44 stories exist
              # NOWHERE -- overwritten by the renderer and never copied aside.
              # Copying first and archiving `target` afterwards archived the
              # 19:24 build under the name "stale-build" and lost the real
              # displaced one. That is the owner's permanent 18:44 loss, and a
              # copy that looks like an archive is how it hid.
              archive(target, 'stale-build')
              shutil.copyfile(backup, target)
              regenerate_index()
              print('archive: REFUSED to overwrite %s (built %s) with an OLDER '
                    'build (built %s); the newer page is back in place'
                    % (os.path.basename(target), old_at, new_at))
          PY
          rm -f state/.page-backup-${TODAY}-${DIGEST_TIME}.html

      - name: Deploy digest to Cloudflare Pages
        if: env.FALLBACK_NOOP != 'true' && env.DRY_RUN != 'true' && env.EMPTY_DIGEST != 'true'
        id: deploy_website
        # PRIMARY channel. continue-on-error keeps the job alive so ntfy (also
        # primary) and the backup channels can still fire when the deploy
        # fails; website_ok is recorded via step output + state/.website_ok.
        #
        # DRY_RUN guard: a dry run must touch NOTHING outside the runner. A
        # real `wrangler pages deploy` here is the P0 leak — drift-canary.yml
        # dispatches dry_run=true for the morning slot, so a canary really
        # published the digest and set website_ok=true, which fed
        # delivered=true into the marker and made the real 01:35 UTC run
        # no-op itself out of existence. Same idiom as the ntfy/gmail/telegram
        # steps: skip the side effect and record the channel as NOT ok.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -eo pipefail
          digest_file="docs/digests/${{ env.TODAY }}-${{ steps.digest_time.outputs.time }}.html"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — digest not deployed to Cloudflare Pages"
            if [ -f "$digest_file" ]; then
              echo "would deploy: $digest_file ($(wc -c < "$digest_file") bytes)"
            else
              echo "WARNING: digest HTML not found: $digest_file — nothing would be deployed anyway"
            fi
            echo "false" > state/.website_ok
            echo "website_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f "$digest_file" ]; then
            echo "WARNING: digest HTML not found: $digest_file - website not published"
            echo "false" > state/.website_ok
            echo "website_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # wrangler pages deploy takes a DIRECTORY, not a single file. Stage
          # the ENTIRE archive (all digests + the regenerated index) so every
          # past digest and the archive listing persist together on Pages.
          stage_dir="$(mktemp -d)"
          cp -r docs/digests "$stage_dir/digests"
          cp docs/index.html "$stage_dir/index.html"
          # --- THE AUTH GUARD MUST BE PRESENT, OR THIS DEPLOY IS A LEAK ----
          #
          # WHY THIS IS AN ASSERTION AND NOT A COMMENT. This step carries
          # `continue-on-error: true` so that a failed website deploy still
          # lets ntfy and the backup channels fire. The cost of that decision
          # is that a deploy can go WRONG while the job still goes GREEN. A
          # missing or undetected functions/ directory would republish the
          # entire 72-page archive to an origin that answers 200 to anyone —
          # with no error anywhere. That is the exact outcome that already
          # happened once: a now-DELETED `digest-auth` Worker was believed to
          # gate the site, and it only proxied, so the origin was never
          # protected at all (confirmed by probe on 2026-10-02: HTTP 200,
          # 38 021 bytes, unauthenticated).
          #
          # Wrangler discovers `./functions` relative to the directory the
          # deploy command RUNS IN, which is the repo root here — not relative
          # to "$stage_dir". So the middleware must exist at the repo root, and
          # this assertion is what makes its absence loud instead of silent.
          #
          # NOTE this is the branch CLOUDFLARE FALLS BACK FROM, not the only
          # guard: a broken `_routes.json` can exempt static routes, so the
          # explicit file below is written as well rather than trusted.
          if [ ! -f functions/_middleware.js ]; then
            echo "FATAL: functions/_middleware.js is missing — this deploy would"
            echo "       republish the whole digest archive UNAUTHENTICATED at"
            echo "       https://daily-digest.example.pages.dev. Refusing to publish."
            exit 1
          fi
          if ! grep -q 'WWW-Authenticate' functions/_middleware.js; then
            echo "FATAL: functions/_middleware.js exists but does not enforce Basic auth."
            echo "       Refusing to publish an unprotected archive."
            exit 1
          fi
          # _routes.json EXPLICITLY, never left to auto-generation.
          #
          # Cloudflare auto-generates a _routes.json when it detects a
          # functions directory, and in that file "exclude" ALWAYS TAKES
          # PRIORITY OVER "include". An auto-generated exclude covering static
          # asset routes would therefore exempt the entire archive from the
          # middleware — and look perfectly healthy while doing it. `include:
          # ["/*"]` with an EMPTY `exclude` is the only shape that means "the
          # middleware guards everything", so it is committed here in reviewable
          # form instead of being inferred by whatever version of wrangler
          # happens to run.
          printf '{"version":1,"include":["/*"],"exclude":[]}' > "$stage_dir/_routes.json"
          if [ ! -s "$stage_dir/_routes.json" ]; then
            echo "FATAL: _routes.json was not written — static routes could be"
            echo "       exempted from the auth middleware. Refusing to publish."
            exit 1
          fi
          echo "auth guard present: functions/_middleware.js + _routes.json $(cat "$stage_dir/_routes.json")"
          npx wrangler pages deploy "$stage_dir" \
            --project-name daily-digest \
            --branch master
          echo "true" > state/.website_ok
          echo "website_ok=true" >> "$GITHUB_OUTPUT"

      - name: Publish to ntfy (primary)
        # PRIMARY channel. continue-on-error keeps the job alive so the backup
        # channels can still fire when the ntfy publish hard-fails; ntfy_ok is
        # recorded via step output + state/.ntfy_ok (the backup gating steps
        # check the flag file, not the step exit code). The script exits 0 even
        # on publish failure so the fallback matrix can execute.
        if: env.FALLBACK_NOOP != 'true'
        continue-on-error: true
        id: send_ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TODAY: ${{ env.TODAY }}
          DIGEST_TIME: ${{ steps.digest_time.outputs.time }}
          DRY_RUN: ${{ env.NTFY_DRY_RUN == 'true' }}
          # `supersede` is the ONLY value that changes this step's behaviour:
          # it selects the `-full` sequence id and the `ntfy_full_sent_at` guard.
          TRIGGER_SOURCE: ${{ env.TRIGGER_SOURCE }}
          # GUARD 2. The two secrets below are the SAME two the Pages deploy and
          # digest-watchdog.yml already use, so no new credential is introduced.
          # They are here so a successful push can be recorded in the same KV
          # `digest:ledger` the Worker's duplicate guard reads. Without them the
          # two arms cannot see each other and the Worker re-publishes a slot
          # this arm already delivered.
          CF_LEDGER_TOKEN: ${{ secrets.CF_PAGES_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # The namespace id, from a repository variable -- never a secret, and
          # never the placeholder in deploy/wrangler.toml.
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
          # The Pages origin for the push's click link. Not committed: the public
          # repository must not carry the real host.
          CF_ARCHIVE_ORIGIN: ${{ vars.CF_ARCHIVE_ORIGIN }}
        run: |
          set -eo pipefail
          # Rich, self-contained notification: full digest markdown, image,
          # click-to-website, tags, priority and an action button. Stdlib
          # urllib only. Posts to the NTFY_SERVER root (NOT /topic).
          python3 - <<'PY'
          import datetime, json, os, re, urllib.request

          FLAG_PATH = 'state/.ntfy_ok'

          # THE ONE PLACE THE PUSH'S HUMAN-FACING WORD IS DECIDED.
          #
          # `kind` (the SLOT) stays exactly what it was: it is the word the KV
          # key, the artifact filename and state/last_digest_sent.json are keyed
          # on, and none of those may move. What changed is the WORD THE OWNER
          # READS, which used to be `kind` and so said "Evening" on a push that
          # had fired at 02:03. It is now read out of the real instant at push
          # time -- this heredoc runs microseconds before the POST below, so
          # this IS the send time and nothing here is predicted.
          #
          # Same table and same boundaries as the web renderer's
          # LABEL_HOUR_BOUNDS in scripts/render_digest.py. Duplicated on
          # purpose, not shared: this file is a heredoc string sliced out of the
          # YAML by tests/render/test_render_honesty.py and exec'd with no repo
          # on sys.path, so an import would break all 26 ntfy tests. Both copies
          # are pinned against these same boundary hours.
          NPT_OFFSET = datetime.timedelta(hours=5, minutes=45)
          LABEL_HOUR_BOUNDS = (
              (0, 'Midnight'),      # 00:00-00:59
              (1, 'Late Night'),    # 01:00-04:59
              (5, 'Dawn'),          # 05:00-06:59
              (7, 'Morning'),       # 07:00-11:59
              (12, 'Noon'),         # 12:00-12:59
              (13, 'Afternoon'),    # 13:00-16:59
              (17, 'Evening'),      # 17:00-20:59
              (21, 'Night'),        # 21:00-23:59
          )

          # THE ICON IS A FUNCTION OF THE WORD, NEVER OF THE SLOT.
          #
          # This used to be `\u2600\ufe0f if kind == 'morning' else
          # \U0001f319` -- keyed to the SLOT -- so a digest that fired at 02:03
          # showed a sun beside the word "Night". The owner has raised
          # time-of-day labelling twice and both halves of that pair came from
          # two different clocks, which is why they could disagree.
          #
          # Keyed by `label_word`, which `npt_label()` derives from the real
          # push instant microseconds below, the icon and the word are now two
          # views of ONE instant: there is no way for them to fall apart
          # without also breaking the word itself. One entry per word in
          # LABEL_HOUR_BOUNDS -- eight of them -- so a new word cannot ship
          # without an icon, and a renamed word cannot ship with the wrong one.
          LABEL_WORD_EMOJI = {
              'Midnight': '\U0001f311',      # new moon
              'Late Night': '\U0001f319',    # crescent moon
              'Dawn': '\U0001f305',          # sunrise
              'Morning': '☀️',      # sun
              'Noon': '\U0001f31e',          # sun with face
              'Afternoon': '\U0001f324',     # sun behind small cloud
              'Evening': '\U0001f307',       # cityscape at dusk
              'Night': '\U0001f303',         # night with stars
          }

          def icon_for_word(word):
              """The icon for one label word. Loud on an unknown word.

              A missing key here would be a new word in LABEL_HOUR_BOUNDS
              without an icon, and `KeyError` at push time would cost the owner
              the whole digest. The check names the word instead, and the
              fallback is the night icon only because an unreadable word has
              not told us it was daylight.
              """
              try:
                  return LABEL_WORD_EMOJI[word]
              except KeyError:
                  print('WARNING: no icon for label word %r; using the night icon'
                        % (word,))
                  return LABEL_WORD_EMOJI['Late Night']

          def npt_label():
              """(word, 'HH:MM') for RIGHT NOW in Nepal time.

              UTC first, then the fixed +05:45. Never the runner's local clock:
              a naive local clock rendered a footer 5h45m behind the NPT cutoff
              on every digest, and in the one field the owner uses to tell
              morning from night that would be the worst place to repeat it.
              """
              npt = (datetime.datetime.now(datetime.timezone.utc).replace(
                  tzinfo=None) + NPT_OFFSET)
              word = LABEL_HOUR_BOUNDS[0][1]
              for start_hour, candidate in LABEL_HOUR_BOUNDS:
                  if npt.hour >= start_hour:
                      word = candidate
                  else:
                      break
              return word, npt.strftime('%H:%M')

          def write_flag(value):
              with open(FLAG_PATH, 'w', encoding='utf-8') as fh:
                  fh.write('true' if value else 'false')

          # ---- the ntfy read-back body -----------------------------------
          #
          # ntfy answers `GET <server>/<topic>/json?poll=1&since=all` with
          # `Content-Type: application/x-ndjson; charset=utf-8` -- NEWLINE
          # delimited JSON, one complete message object per line, NOT a JSON
          # array -- and with a ZERO-BYTE body when the topic has nothing
          # cached. Measured 2026-10-13 against ntfy.sh with a generated,
          # non-existent topic: HTTP 200, ctype=application/x-ndjson,
          # bodybytes=0.
          #
          # So `json.loads(body)` raised JSONDecodeError on EVERY call, for
          # every topic: a populated topic is many objects separated by
          # newlines (not JSON) and an empty topic is "" (not JSON either).
          # Both landed in the handler below, which printed
          #   WARNING: the sequence_id read-back failed (JSONDecodeError) -
          #            publishing anyway; a possible duplicate is the accepted cost
          # and published. This guard has never once suppressed anything.
          #
          # `poll=1` STAYS. Dropping it turns this into an unbounded long-poll
          # that holds the step open until ntfy pushes something, which for a
          # topic that receives a handful of messages a day is a hang, not a
          # read.
          def parse_ntfy_history(raw):
              body = (raw or '').strip()
              # AN EMPTY BODY IS NOT AN ERROR. It is the server's answer for
              # "nothing cached on this topic", which is the ordinary first
              # delivery of the day. Reporting it as a failure would report
              # "unknown" for the one case we know exactly -- and unknown means
              # publish.
              if not body:
                  return []
              # NDJSON. EVERY non-blank line must parse AND every one must be a
              # message object; otherwise fall through rather than keeping the
              # lines that happened to work, because a partial parse finds HALF
              # the messages on the topic -- a dedup guard that suppresses the
              # wrong things and looks like it works.
              #
              # `{"messages": [...]}` on its own line is a CONTAINER, not a
              # message: valid JSON and a valid object, so a naive "is it a
              # dict?" test accepts it as one message carrying no sequence_id,
              # and a topic whose history really does contain the sequence id
              # then reads as one unrelated message. The container shape below
              # exists to unwrap it, so it has to be recognised here.
              lines = [ln.strip() for ln in body.split('\n') if ln.strip()]
              messages = []
              every_line_is_a_message = True
              for line in lines:
                  try:
                      value = json.loads(line)
                  except ValueError:
                      every_line_is_a_message = False
                      break
                  if (not isinstance(value, dict)
                          or isinstance(value.get('messages'), list)):
                      every_line_is_a_message = False
                      break
                  messages.append(value)
              if every_line_is_a_message and len(messages) == len(lines):
                  return messages
              # One document for the whole body: a pretty-printed array, or the
              # {"messages": [...]} shape some ntfy-compatible servers return.
              parsed = json.loads(body)
              if isinstance(parsed, list):
                  return [m for m in parsed if isinstance(m, dict)]
              if isinstance(parsed, dict) and isinstance(parsed.get('messages'), list):
                  return [m for m in parsed['messages'] if isinstance(m, dict)]
              return []

          # ---- Cloudflare KV: the ledger the WORKER reads ----------------
          #
          # GUARD 2. Until 2026-10-13 this step recorded a delivery in the
          # COMMITTED state/last_digest_sent.json and nowhere else, while the
          # Worker's duplicate guard reads Cloudflare KV `digest:ledger`. The
          # two arms could not see each other, so an Actions push left no
          # `ntfy_sent_at` in KV and the Worker's very next run for that slot
          # published again. The committed marker is retired on purpose
          # (single slot, overwritten every run, never read by the Worker) and
          # that is NOT reversed here -- KV is added ALONGSIDE it.
          #
          # Read by NAME, never printed. CF_PAGES_API_TOKEN and CF_ACCOUNT_ID
          # are the same two secrets the Pages deploy and the watchdog already
          # use; this step adds no new credential.
          LEDGER_KEY = 'digest:ledger'
          KV_API = 'https://api.cloudflare.com/client/v4'
          # Same resolver as 'Fallback no-op check': the id comes from a
          # repository VARIABLE and never from deploy/wrangler.toml, whose
          # committed id is a placeholder that names no namespace.
          KV_NAMESPACE_ENV = 'CF_KV_NAMESPACE_ID'
          KV_PLACEHOLDER = 'abcdefabcdefabcdefabcdefabcdefab'
          LEDGER_RETENTION_DAYS = 7
          SCHEMA_VERSION = 1

          def kv_namespace():
              """The KV namespace id, from the CF_KV_NAMESPACE_ID variable.

              An absent, malformed or placeholder value returns '' — there is no
              fallback, because the only other place the id is written down is a
              published placeholder.
              """
              raw = (os.environ.get(KV_NAMESPACE_ENV) or '').strip()
              if not raw or not re.fullmatch(r'[0-9a-fA-F]{32}', raw):
                  return ''
              if raw.lower() == KV_PLACEHOLDER:
                  return ''
              return raw

          def kv_error_detail(exc):
              """(HTTP status, Cloudflare errors[0].code, printable label).

              The body is read ONCE. The label never quotes the request URL,
              which carries the account and namespace ids.
              """
              status = getattr(exc, 'code', None)
              code = None
              if status is not None:
                  try:
                      payload = json.loads((exc.read() or b'').decode('utf-8', 'replace'))
                      code = (payload.get('errors') or [{}])[0].get('code')
                  except Exception:
                      code = None
              printable = (f'HTTP {status}, Cloudflare code {code or "none"}'
                           if status is not None else exc.__class__.__name__)
              return status, code, printable

          def kv_configured():
              # kv_namespace() is the placeholder gate: a placeholder id makes
              # this False, so no request is attempted with it.
              return bool((os.environ.get('CF_LEDGER_TOKEN') or '').strip()
                          and (os.environ.get('CF_ACCOUNT_ID') or '').strip()
                          and kv_namespace())

          def kv_read_ledger():
              """The ledger, or None. None means "not consulted", never "empty".

              An unreadable ledger must NOT be reported as an empty one: empty
              reads as "this slot has never been delivered" and would stand the
              ladder down on a slot that may already be on the owner's phone.
              """
              namespace = kv_namespace()
              url = ('%s/accounts/%s/storage/kv/namespaces/%s/values/%s'
                     % (KV_API, os.environ.get('CF_ACCOUNT_ID', '').strip(),
                        namespace, LEDGER_KEY))
              request = urllib.request.Request(
                  url, headers={'Authorization': 'Bearer '
                                + (os.environ.get('CF_LEDGER_TOKEN') or '').strip(),
                                'Accept': 'text/plain'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read().decode('utf-8', errors='replace')
              except Exception as exc:
                  # STATUS AND CLOUDFLARE'S OWN CODE, NEVER THE URL: 10013 is a
                  # namespace that does not exist, 10009 is a key that does not
                  # exist -- and the second one means an EMPTY ledger, not a
                  # broken one, so it is answered as empty rather than unknown.
                  status, code, detail = kv_error_detail(exc)
                  if status == 404 and code == 10009:
                      print('the KV ledger key is absent (HTTP 404, Cloudflare 10009) '
                            '— treating the ledger as empty')
                      return {'schema_version': SCHEMA_VERSION, 'days': {}}
                  print('WARNING: the KV delivery ledger could not be read (%s)'
                        % detail)
                  return None
              if not raw.strip():
                  return {'schema_version': SCHEMA_VERSION, 'days': {}}
              try:
                  parsed = json.loads(raw)
              except ValueError:
                  print('WARNING: the KV delivery ledger is not JSON')
                  return None
              if not isinstance(parsed, dict):
                  return None
              if not isinstance(parsed.get('days'), dict):
                  parsed['days'] = {}
              return parsed

          def kv_slot_entry(ledger, date, slot):
              """The slot's own ledger entry, or None. Never raises."""
              try:
                  day = ledger.get('days', {}).get(date)
                  entry = day.get(slot) if isinstance(day, dict) else None
              except AttributeError:
                  return None
              return entry if isinstance(entry, dict) else None

          # WHEN EACH SLOT'S DIGEST IS DUE, IN UTC -- and therefore the earliest
          # instant a send for that slot can honestly be recorded at. 07:20 and
          # 19:20 NPT are the Worker's delivery moments (Nepal is UTC+05:45 with
          # no DST), so 01:35 and 13:35 UTC. This is not a new schedule invented
          # here: every slot in the committed ledger carries exactly these as its
          # own `scheduled_instant` (2026-10-12T01:35:00Z, 2026-10-12T13:35:00Z).
          SLOT_DUE_UTC = {'morning': (1, 35), 'evening': (13, 35)}

          # HOW EARLY A RECORDED SEND MAY BE before it is a mislabel rather than
          # clock skew between the Worker and this runner. The same 60 seconds
          # the punctuality module already calls "on time" (ON_TIME_S in
          # scripts/delivery_ledger.py) -- reused rather than re-chosen, so the
          # repository has one answer to "how close is close enough" instead of
          # two that can drift apart.
          SLOT_EARLY_SLACK_S = 60

          def instant_or_none(text):
              """An ISO-8601 instant as an aware UTC datetime, or None.

              Never raises: the caller is a ledger write that must not die
              because a record it is inspecting is malformed.
              """
              raw = str(text or '').strip()
              if not raw:
                  return None
              if raw.endswith('Z') or raw.endswith('z'):
                  raw = raw[:-1] + '+00:00'
              try:
                  moment = datetime.datetime.fromisoformat(raw)
              except ValueError:
                  return None
              if moment.tzinfo is None:
                  return None
              return moment.astimezone(datetime.timezone.utc)

          def slot_due_instant(date, slot):
              """The UTC instant `slot` on `date` is due, or None if unknowable."""
              hour_minute = SLOT_DUE_UTC.get(slot)
              if hour_minute is None:
                  return None
              try:
                  day = datetime.date.fromisoformat(str(date))
              except (TypeError, ValueError):
                  return None
              return datetime.datetime(day.year, day.month, day.day,
                                       hour_minute[0], hour_minute[1],
                                       tzinfo=datetime.timezone.utc)

          def slot_holding_instant(date, sent):
              """Which slot's window `sent` falls in, as "<date> <slot>", or ''.

              The bucket under inspection CLAIMS one (date, slot). This answers
              the other half of the question -- which slot the instant could
              actually belong to -- so the report names both ends of the
              contradiction instead of only the end that is wrong. Walked
              backwards from the bucket's own date, nearest slot first.
              """
              try:
                  day = datetime.date.fromisoformat(str(date))
              except (TypeError, ValueError):
                  return ''
              for offset in (0, 1, 2, 3):
                  candidate = (day - datetime.timedelta(days=offset)).isoformat()
                  for name in ('evening', 'morning'):
                      due = slot_due_instant(candidate, name)
                      if due is not None and sent >= due:
                          return '%s %s' % (candidate, name)
              return ''

          def ledger_mislabel(entry, date, slot):
              """A send instant that precedes its own slot, described, or ''.

              THE CLASS THIS CATCHES, and why the rule below could not. On
              2026-10-18 the ledger held `evening` with
              `ntfy_sent_at: 2026-10-17T18:25:19Z` -- a send recorded 19h09m
              BEFORE the 19:20 NPT slot it is filed under had begun. The
              correction below never saw it: that rule fires on `ntfy_failed`
              beside a delivery claim, and this entry carried `ntfy_failed`
              nowhere at all. A bucket is a claim about ONE slot, so an instant
              outside that slot's own window is a mislabel whatever `state` and
              `kind` say -- which is the next variant of the same lie.

              FAIL-OPEN, AND ONLY WHERE THERE IS NOTHING TO READ. An
              `unavailable` or `failed` bucket carries no `ntfy_sent_at`, and a
              bucket the seal has just created carries build fields only;
              neither claims a push, so neither is reported. An unparseable
              instant is reported as nothing either: this arm proves a
              contradiction between two instants, and a value it cannot read is
              not that proof.

              EARLY ONLY. A LATE digest is measured as late and rendered as late
              on purpose (scripts/delivery_ledger.py), so lateness is not this
              arm's business; only a send that PRECEDES its own slot is
              impossible, and that is the only thing reported.
              """
              if not isinstance(entry, dict):
                  return ''
              sent = instant_or_none(entry.get('ntfy_sent_at'))
              if sent is None:
                  return ''
              due = slot_due_instant(date, slot)
              if due is None:
                  return ''
              if sent >= due - datetime.timedelta(seconds=SLOT_EARLY_SLACK_S):
                  return ''
              gap = int((due - sent).total_seconds())
              return ('%s %s records ntfy_sent_at=%s (%s NPT), which PRECEDES the '
                      'due instant of the slot it is filed under: %s = %s NPT, '
                      '%dh%02dm earlier. A send cannot belong to a slot that had '
                      'not begun, and this instant falls in %s. FLAGGED, NOT '
                      'CORRECTED: KV is authoritative for delivery (D-008), so a '
                      'wrong historical record is reported and left as it is.'
                      % (date, slot, str(entry.get('ntfy_sent_at')),
                         (sent + NPT_OFFSET).strftime('%Y-%m-%d %H:%M'),
                         due.strftime('%Y-%m-%dT%H:%M:%SZ'),
                         (due + NPT_OFFSET).strftime('%H:%M'),
                         gap // 3600, (gap % 3600) // 60,
                         slot_holding_instant(date, sent)
                         or 'no slot in this ledger'))

          def flag_mislabelled_buckets(ledger):
              """Report every STORED bucket whose send precedes its own slot.

              `enforce_ledger_honesty` sees ONE entry -- the one this run is
              about to write. A lie already sitting in KV is never that entry, so
              without this it would stay invisible until something happened to
              rewrite that exact slot. This walks the ledger the run just read,
              and that is what lets the arm SEE the 2026-10-18 evening record
              rather than only stop the next one being created.

              REPORTS ONLY: it edits nothing and returns nothing. KV is
              authoritative for delivery and retiring a wrong historical entry is
              the owner's decision, not this step's -- so the same bucket is
              reported on every run until it is retired, which is the intended
              cost of not rewriting history.
              """
              days = ledger.get('days') if isinstance(ledger, dict) else None
              if not isinstance(days, dict):
                  return
              for date in sorted(days):
                  slots = days.get(date)
                  if not isinstance(slots, dict):
                      continue
                  for slot in sorted(slots):
                      mislabel = ledger_mislabel(slots.get(slot), date, slot)
                      if mislabel:
                          print('::error::LEDGER HONESTY VIOLATION (stored): %s'
                                % mislabel)

          def enforce_ledger_honesty(entry, date, slot, now):
                  """The SAME invariant the Worker enforces in commitDigestLedger.

                  THE DEFECT. On 2026-10-14 and 2026-10-15 the ledger recorded
                  evening slots as `state=sent kind=delivered` while carrying
                  `ntfy_failed=true` with a 429/timeout -- a digest the owner
                  never received, recorded as one he did. The archive and the
                  ledger both asserted success.

                  WHY THIS ARM NEEDS ITS OWN COPY. This entry is a MERGE
                  (`entry.update(patch)`) onto whatever the Worker already
                  wrote, and this arm runs from a DIFFERENT IP with its own
                  read-modify-write. So the contradiction can be produced here,
                  or preserved here, or reintroduced here -- the Worker's
                  invariant runs on the Worker and cannot reach a write this
                  heredoc makes. Two writers, one ledger, one rule.

                  Duplicated rather than shared because this heredoc is sliced
                  out of the YAML and exec'd with no repo on sys.path, which is
                  the same constraint that duplicates LABEL_HOUR_BOUNDS above.
                  It is pinned against the Worker's copy by
                  tests/workflows/test_workflow_lint.py.

                  LOUD. A correction prints ::error::, because a delivery record
                  that needs correcting is a real defect and this repo does not
                  soften honesty signals into warnings that scroll past.
                  """
                  # THE TEMPORAL ARM RUNS FIRST, AND INDEPENDENTLY OF the arm
                  # below: a mislabel needs no `ntfy_failed` to be one, and the
                  # arm below returns early for every entry that has none.
                  mislabel = ledger_mislabel(entry, date, slot)
                  if mislabel:
                      print('::error::LEDGER HONESTY VIOLATION (temporal): %s'
                            % mislabel)
                  if entry.get('ntfy_failed') is not True:
                      # Direction 2: a real success outranks the failure
                      # metadata of every earlier attempt at this same slot,
                      # which otherwise sticks to the entry forever.
                      if entry.get('state') == 'sent':
                          entry.pop('ntfy_quota_exhausted', None)
                          entry.pop('error', None)
                          entry.pop('honesty_downgraded_at', None)
                      return
                  if entry.get('state') != 'sent' and entry.get('kind') != 'delivered':
                      return
                  print('::error::LEDGER HONESTY VIOLATION CORRECTED for %s %s: '
                        'this slot recorded a VERIFIED ntfy failure '
                        '(ntfy_failed=true, http_status=%s, attempts=%s, error=%s) '
                        'alongside a delivery claim (state=%s, kind=%s). The owner '
                        'did NOT receive this digest. Downgrading the record to '
                        'failed so the slot reads as undelivered.'
                        % (date, slot, entry.get('http_status'), entry.get('attempts'),
                           entry.get('error'), entry.get('state'), entry.get('kind')))
                  entry['state'] = 'failed'
                  entry['ntfy_failed'] = True
                  # `kind` is left alone on purpose: it classifies what was
                  # BUILT, and the digest did build. Only `state` is the
                  # delivery verdict.
                  entry.pop('ntfy_sent_at', None)
                  entry.pop('first_ntfy_sent_at', None)
                  entry['honesty_downgraded_at'] = now

          def kv_record_delivery(date, slot, patch, clear=(),
                                 inherit_stored_kind=False):
              """Read-modify-write the slot's delivery record. NEVER raises.

              This runs AFTER the push succeeded. A failure here costs the
              record of a delivery that DID happen -- which is exactly the state
              the sequence_id read-back is there to cover -- so it is reported
              loudly and swallowed. It must never raise: this step's caller
              reads state/.ntfy_ok on the next line, so a non-zero exit would
              discard a delivered digest's own result and fire the Gmail backup
              against a push that already landed.

              `clear` names fields the patch REMOVES rather than overwrites, and
              it is not cosmetic: this is a merge onto whatever is already
              stored, so an earlier attempt's `ntfy_failed`/`http_status` would
              survive a later success. `enforce_ledger_honesty` then sees
              ntfy_failed=true beside state=sent and DOWNGRADES the record it
              was just told is delivered, deleting ntfy_sent_at again -- the
              success erases its own proof.
              """
              try:
                  ledger = kv_read_ledger()
                  if ledger is None:
                      return False
                  # SEE WHAT IS ALREADY STORED, before this run's own patch is
                  # merged into it. Reported, never repaired -- see the function.
                  flag_mislabelled_buckets(ledger)
                  now = (datetime.datetime.now(datetime.timezone.utc)
                             .replace(microsecond=0).isoformat()
                             .replace('+00:00', 'Z'))
                  day = ledger['days'].setdefault(date, {})
                  entry = dict(day.get(slot) or {})
                  # A STAND-DOWN DID NOT BUILD THE MESSAGE IT FOUND, SO IT DOES
                  # NOT GET TO CLASSIFY IT. `kind` says what was built, and an
                  # entry that already carries one has that evidence; stamping
                  # `delivered` over it claimed a healthy digest for a slot whose
                  # only push was a fallback (2026-10-26 evening: kind
                  # fallback_last_good, ntfy_sent_at 12:34:19Z, due 13:35Z).
                  if inherit_stored_kind and entry.get('kind'):
                      patch = {k: v for k, v in patch.items() if k != 'kind'}
                  entry.update(patch)
                  for key in clear:
                      entry.pop(key, None)
                  entry.setdefault('first_ntfy_sent_at', patch.get('ntfy_sent_at', now))
                  enforce_ledger_honesty(entry, date, slot, now)
                  day[slot] = entry
                  cutoff = (datetime.date.fromisoformat(date)
                            - datetime.timedelta(days=LEDGER_RETENTION_DAYS - 1)
                            ).isoformat()
                  for key in [k for k in ledger['days'] if str(k) < cutoff]:
                      del ledger['days'][key]
                  ledger['schema_version'] = SCHEMA_VERSION
                  ledger['as_of'] = now
                  ledger['pruned_before'] = cutoff
                  url = ('%s/accounts/%s/storage/kv/namespaces/%s/values/%s'
                         % (KV_API, os.environ.get('CF_ACCOUNT_ID', '').strip(),
                            kv_namespace(), LEDGER_KEY))
                  request = urllib.request.Request(
                      url, data=json.dumps(ledger, ensure_ascii=False).encode('utf-8'),
                      headers={'Authorization': 'Bearer '
                               + (os.environ.get('CF_LEDGER_TOKEN') or '').strip(),
                               'Content-Type': 'application/json',
                               'Accept': 'text/plain'},
                      method='PUT')
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                  print('KV %s recorded for %s %s (HTTP %s)'
                        % (', '.join(sorted(patch)), date, slot, status))
                  return True
              except Exception as exc:
                  # NAMED AS "KV write FAILED" ON PURPOSE. The success line
                  # reads "KV <fields> recorded for ...", so a reader scanning
                  # the step log has to be able to pair the two, and a token
                  # that has been mis-scoped for months is otherwise invisible:
                  # the digest still goes out, so nothing else in this run ever
                  # says so. This line is the only place it is ever said.
                  _, _, detail = kv_error_detail(exc)
                  print('::error::KV write FAILED (%s). This push was DELIVERED '
                        'but the Worker\'s duplicate guard cannot see it, so the '
                        'next run for %s %s may publish a second copy. The push '
                        'itself is not in doubt. Grant CF_PAGES_API_TOKEN the '
                        'Account > KV Storage > Write permission and confirm the '
                        'namespace id in the CF_KV_NAMESPACE_ID repository variable.'
                        % (detail, date, slot))
                  return False

          def iso_utc(moment):
              """An aware datetime in the ledger's instant format."""
              return (moment.astimezone(datetime.timezone.utc)
                      .replace(microsecond=0).isoformat().replace('+00:00', 'Z'))

          def message_epoch(message):
              """A read-back message's own `time` as epoch seconds, or -1."""
              try:
                  return int(message.get('time'))
              except (AttributeError, TypeError, ValueError):
                  return -1

          def message_sent_at(message):
              """The read-back message's OWN `time` as a ledger instant, or None.

              ntfy publishes `time` as epoch seconds. This is the only evidence
              of WHEN the delivery that is already on the topic happened:
              `ntfy_sent_at` is compared against the slot's due instant, so
              "now" -- the moment this run noticed the message -- would date a
              19:20 push at 19:55 and is not the delivery's instant.
              """
              try:
                  return iso_utc(datetime.datetime.fromtimestamp(
                      int(message.get('time')), datetime.timezone.utc))
              except (AttributeError, TypeError, ValueError, OSError, OverflowError):
                  return None

          def record_delivery(date, slot, sequence_id, sent_at, supersede,
                              inherit_stored_kind=False):
              """THE ONE RECORD A CONFIRMED DELIVERY WRITES. Both arms call it.

              The two arms are the publish that just returned, and the
              stand-down that found this slot's message already on the topic.
              They write the SAME shape on purpose: nothing downstream can tell
              which arm produced an entry, and a stand-down that recorded
              nothing (2026-10-26 evening) left a delivered slot reading
              `pending` for the rest of the day.

              `sent_at` is the delivery's own instant, never "now" on the
              stand-down arm -- see message_sent_at().

              The ONE difference between the arms is `inherit_stored_kind`: the
              stand-down found a message it did not build, so it keeps whatever
              `kind` the slot already records instead of asserting `delivered`.
              """
              if not kv_configured():
                  print('WARNING: CF_PAGES_API_TOKEN / CF_ACCOUNT_ID or the '
                        'KV namespace id is unavailable, so this delivery '
                        'was NOT recorded in the KV ledger and the '
                        'Worker\'s duplicate guard cannot see it. The '
                        'sequence_id read-back above is the only thing '
                        'standing between this slot and a double push.')
                  return False
              if supersede:
                  # `ntfy_sent_at` is deliberately NOT set here. The Worker's
                  # ledger guard suppresses on it, and the degraded push this
                  # replaces already set it.
                  return kv_record_delivery(date, slot, {
                      'ntfy_full_sent_at': sent_at,
                      'full_sequence_id': sequence_id,
                  })
              patch = {
                  'sequence_id': sequence_id,
                  'state': 'sent',
                  'kind': 'delivered',
              }
              if sent_at:
                  patch['ntfy_sent_at'] = sent_at
              # The failure markers of every earlier attempt at this slot go:
              # with ntfy_failed still true, enforce_ledger_honesty downgrades
              # this record and deletes the ntfy_sent_at it just wrote.
              return kv_record_delivery(
                  date, slot, patch, clear=('ntfy_failed', 'http_status'),
                  inherit_stored_kind=inherit_stored_kind)

          def main():
              topic = (os.environ.get('NTFY_TOPIC') or '').strip()
              server = (os.environ.get('NTFY_SERVER') or '').strip()
              if not topic or not server:
                  print('NTFY_TOPIC or NTFY_SERVER not set — ntfy unavailable (ntfy_ok=false)')
                  write_flag(False)
                  return
              if not (server.startswith('http://') or server.startswith('https://')):
                  print('WARNING: NTFY_SERVER "%s" does not start with http:// or https:// — ntfy unavailable (ntfy_ok=false)' % server)
                  write_flag(False)
                  return

              dry_run = os.environ.get('DRY_RUN', 'false').lower() == 'true'
              today = os.environ.get('TODAY', '')
              kind = os.environ.get('DIGEST_TIME', 'digest')
              # `supersede` is dispatched ONLY by digest-prebuild.yml's seal job,
              # and only after it has latched `full_artifact_available_at` and
              # `supersede_sequence_id` in KV. It means: an earlier push for this
              # slot went out degraded, a complete digest has since been built,
              # and THIS push is the replacement. Everything below keys on it.
              trigger_source = (os.environ.get('TRIGGER_SOURCE') or '').strip()
              # Resolved HERE, not at the publish step below, because the title
              # block above reads it and the dry-run return below happens before
              # the publish step. A name bound at the point of use is a
              # `NameError`/`UnboundLocalError` in exactly the branch that prints
              # the payload for every test in the repo.
              is_supersede = (trigger_source == 'supersede')

              # The word the owner reads, and the clock it was read at. Both
              # from the real instant, taken ONCE so the three title shapes
              # below cannot disagree with each other. `kind` is untouched.
              #
              # NAMED `send_label`, NOT `label`. This heredoc already uses the
              # bare name `label` for two other, unrelated things -- a story's
              # chip label in `story_md` and a category name in `build_digest`.
              # Both are function-local so they cannot clobber this one today,
              # but a push title that silently became "WORLD — MAJOR EVENTS" is
              # exactly the kind of wrong-claim bug this file is built to
              # prevent, and it would take someone hoisting a variable out of
              # one of those two functions to cause it.
              label_word, label_clock = npt_label()
              send_label = '%s Digest · %s' % (label_word, label_clock)

              # --- Load validated stories ---
              stories = []
              source_health = None
              notes = ''
              data = {}
              try:
                  with open('state/stories.validated.json', encoding='utf-8') as fh:
                      data = json.load(fh)
                  if isinstance(data, dict):
                      raw = data.get('stories') or []
                      if isinstance(raw, list):
                          stories = [s for s in raw if isinstance(s, dict)]
                      if isinstance(data.get('source_health'), dict):
                          source_health = data['source_health']
                      notes = str(data.get('notes') or '')
              except Exception as exc:
                  print('WARNING: could not read state/stories.validated.json: %s' % exc)

              # The fallback edition declares itself in the payload; the push is
              # the surface a reader sees first, so the title says it in words.
              unsummarised = str(data.get('edition_kind') or '') == 'unsummarised'

              # --- Weather verdicts (scripts/weather_advice.py) ---
              # The engine writes a top-level `weather_advice` list into
              # state/candidates.json; the validated payload may also carry
              # one. Both are read, validated payload first. ABSENCE IS NORMAL
              # AND SILENT: the engine returns [] precisely to mean "say
              # nothing at all", so an empty list must never become a
              # placeholder or a "couldn't fetch weather" line on the push.
              candidates = {}
              try:
                  with open('state/candidates.json', encoding='utf-8') as fh:
                      cand = json.load(fh)
                  if isinstance(cand, dict):
                      candidates = cand
              except FileNotFoundError:
                  pass
              except Exception as exc:
                  print('WARNING: could not read state/candidates.json: %s' % exc)

              # --- Honesty (FROZEN CONTRACT B/C, code-driven, not agent-driven) ---
              # 'unknown' is the PERMANENT correct value when source_health is
              # absent (legacy build, missing/corrupt candidates.json): an
              # outage is never allowed to look like a normal day.
              HEALTH_BANNER = {
                  'partial': '⚠️ Some sources failed — this digest may be missing items.',
                  'degraded': '⚠️ Some sources were unreachable — this digest may be missing items.',
                  'empty': '⚠️ Some sources answered, but returned nothing usable — treat this digest as incomplete.',
                  'unknown': '⚠️ Source check unavailable — this digest may be missing items.',
              }
              NOTE_LIMIT = 240
              GOOGLE_NEWS_RE = re.compile(
                  r'https?://(?:[a-z0-9\-]+\.)*news\.google\.com/rss/articles/', re.I)

              def health_state(health):
                  state = str((health or {}).get('state') or '').strip().lower()
                  return state if state in ('ok', 'partial', 'degraded', 'empty') else 'unknown'

              def hosts_down(health):
                  critical = (health or {}).get('critical')
                  if not isinstance(critical, dict):
                      return []
                  raw = critical.get('hosts_down')
                  if not isinstance(raw, list):
                      return []
                  return [h.strip() for h in raw if isinstance(h, str) and h.strip()]

              def capped_note(raw_notes, limit=NOTE_LIMIT):
                  text = str(raw_notes or '').strip()
                  text = re.sub(r'^Collector:\s*', '', text, flags=re.IGNORECASE)
                  # The same class as `Collector:`: a `feed:<slug>` source ID is
                  # build vocabulary, not a source the reader can visit. Verbatim
                  # from reader_note_text in scripts/render_digest.py.
                  text = re.sub(r'\bfeed:[A-Za-z0-9._-]+\s*', '', text).strip()
                  if not text:
                      return ''
                  if len(text) > limit:
                      text = text[:limit - 1].rstrip() + '\u2026'
                  return '\u26a0\ufe0f Research note: %s' % text

              def article_url(story):
                  """Primary link, unwrapping a Google News RSS redirect.

                  Prefers a supporting source that is NOT ITSELF a Google News
                  redirect. The old first-match version returned the first
                  supporting source whatever it was, so a story whose
                  `supporting_sources` were three more redirects still
                  rendered a redirect - the exact defect that cost ~900 bytes
                  on one story. Non-Google first, any second, the raw
                  redirect last.
                  """
                  url = (story.get('source_url') or '').strip()
                  if not GOOGLE_NEWS_RE.search(url):
                      return url, False
                  fallback = ''
                  for s in story.get('supporting_sources') or []:
                      if isinstance(s, dict):
                          cand = str(s.get('url') or '').strip()
                          if not cand:
                              continue
                          if not GOOGLE_NEWS_RE.search(cand):
                              return cand, True
                          if not fallback:
                              fallback = cand
                  return (fallback or url), True

              def banner_md(health, raw_notes):
                  """Banner lines for the ntfy body (markdown, no decoration)."""
                  lines = [HEALTH_BANNER.get(health_state(health), '')]
                  hosts = hosts_down(health)
                  if hosts:
                      shown = ', '.join(hosts[:3])
                      if len(hosts) > 3:
                          shown += ' (+%d more)' % (len(hosts) - 3)
                      lines.append('Down: %s' % shown)
                  note = capped_note(raw_notes)
                  if note:
                      lines.append(note)
                  return '\n'.join(ln for ln in lines if ln)

              # ----------------------------------------------------------------
              # Freshness (FROZEN CONTRACT C, 2026-09-30). This push carried NO
              # freshness line at all: zero occurrences of `cutoff` or
              # "Information checked through" in this heredoc, while
              # scripts/render_digest.py:1365 called cutoff_line() and
              # build_email.py carried it. So the push silently dropped the
              # claim AND its qualifiers -- "some sources were unreachable",
              # "incomplete: some sources returned nothing usable" -- which is
              # the same cross-surface divergence class this owner already
              # suffered once. Driven by the SAME `source_health` state as the
              # banner above, from the SAME `data_cutoff_npt` field
              # scripts/validate_stories.py writes.
              #
              # DUPLICATED LITERALLY from scripts/render_digest.py, exactly as
              # the personal layer below is duplicated from render_digest.py
              # and build_email.py. tests/workflows/test_workflow_lint.py
              # (NtfyCutoffDriftTests) holds these literals to
              # render_digest's, so a divergence fails a test instead of
              # shipping silently.
              # ----------------------------------------------------------------
              CUTOFF_SUFFIX = {
                  'ok': '',
                  'partial': ' · some sources failed',
                  'degraded': ' · some sources were unreachable',
                  'empty': ' (incomplete: some sources returned nothing usable)',
              }
              CUTOFF_UNKNOWN = ('⚠️ Freshness unverified — no '
                                'source was confirmed reachable')

              def cutoff_line(cutoff, health, scheduled='', generated_at=''):
                  """FROZEN CONTRACT C: the honest freshness line."""
                  state = health_state(health)
                  if state == 'unknown':
                      return CUTOFF_UNKNOWN
                  if not cutoff:
                      return ''
                  line = 'Information checked through: %s NPT' % cutoff
                  suffix = CUTOFF_SUFFIX.get(state, '')
                  if suffix:
                      line += suffix
                  if scheduled and generated_at:
                      gen_hhmm = (generated_at.strip()[-5:]
                                  if len(generated_at.strip()) >= 5
                                  else generated_at)
                      line += ' (scheduled %s · runner started %s)' % (scheduled, gen_hhmm)
                  return line

              # 'unknown' is the PERMANENT correct value when source_health is
              # absent, so the freshness line degrades to the honest
              # "unverified" wording rather than to a timestamp nobody can
              # stand behind. An absent/empty data_cutoff_npt yields '' and the
              # line is simply omitted -- never a bare label, never a dash.

              # ----------------------------------------------------------------
              # The personal layer: `Your day` + weather.
              #
              # DUPLICATED LITERALLY from scripts/render_digest.py and
              # scripts/build_email.py. The push is a fourth, separate
              # implementation of the same contract; tests/render
              # (test_render_personal.py) holds all four to identical literals,
              # so a divergence fails a test instead of shipping.
              #
              # It only SELECTS already-screened strings - the validator's
              # `for_you` and the deterministic engine's `text`. No model call,
              # no re-wording, no re-ranking.
              # ----------------------------------------------------------------
              FOR_YOU_LABEL = 'For you'
              YOUR_DAY_LABEL = 'Your day'
              WEATHER_LABEL = 'Weather'
              NOTHING_TODAY = 'Nothing needs you today.'
              FOR_YOU_MAX = 3
              WEATHER_MAX = 2
              ACTION_CATEGORIES = (
                  'action', 'education_tu', 'college_local', 'bank_local',
                  'tech_career', 'local_city',
              )
              # `Your day` is capped at 3 LINES, on every surface. It is NOT
              # capped at a byte count of its own: the push's byte ceiling is
              # PERSONAL_MAX_BYTES below, which is measured on the RENDERED
              # block (heading + bullets included) and is therefore the correct
              # outer bound. An inner byte cap strictly tighter than the outer
              # one only ever did one thing - silently drop a deadline line
              # while hundreds of bytes of the real ceiling were still free.
              # See the note on your_day_lines below.
              YOUR_DAY_MAX_LINES = 3
              WEATHER_MAX_BYTES = 400
              PERSONAL_MAX_BYTES = 1000

              def weather_advice_lines(*payloads):
                  """Verbatim advice `text` values, in the ENGINE'S order.

                  The engine already sorted by severity; re-sorting here would
                  be a second, divergent severity rule. [] means say nothing.
                  """
                  for payload in payloads:
                      if not isinstance(payload, dict):
                          continue
                      raw = payload.get('weather_advice')
                      if not isinstance(raw, (list, tuple)) or not raw:
                          continue
                      texts = []
                      for item in raw:
                          text = item if isinstance(item, str) else (
                              str((item or {}).get('text') or '').strip()
                              if isinstance(item, dict) else '')
                          if text:
                              texts.append(text)
                      if texts:
                          return texts
                  return []

              def parse_day(value):
                  """'YYYY-MM-DD' (or anything starting with it) as a date.

                  An unparseable deadline is NOT treated as today or tomorrow:
                  guessing would put a possibly-months-away line into a box
                  whose whole purpose is to remove noise. A date parse failure
                  is therefore a silent skip, not a crash - a missing
                  `for_you` or a malformed deadline must never cost the owner
                  the rest of the push.
                  """
                  text = str(value or '').strip()
                  if len(text) < 10:
                      return None
                  try:
                      return datetime.date(int(text[0:4]), int(text[5:7]),
                                           int(text[8:10]))
                  except ValueError:
                      return None

              def due_stories(items, today):
                  """[(index, title, due_iso)] due today or tomorrow."""
                  out = []
                  for index, s in enumerate(items or []):
                      if not isinstance(s, dict):
                          continue
                      day = parse_day(s.get('deadline'))
                      if day is None or today is None:
                          continue
                      if day == today or day == today + datetime.timedelta(days=1):
                          title = str(s.get('title') or '').strip() or '(untitled)'
                          out.append((index, title, day.isoformat()))
                  out.sort(key=lambda row: (row[2], row[0]))
                  return out

              def for_you_lines(items, skip_indexes=()):
                  """Up to FOR_YOU_MAX `for_you` lines, best first.

                  Obligation-bearing category, then the pipeline's priority
                  descending, then input order. A story without a `for_you` is
                  skipped SILENTLY - no placeholder, no empty label. Stories
                  already shown as a deadline line are excluded so a 3-line
                  box never repeats one story.
                  """
                  skip = set(skip_indexes or ())
                  ranked = []
                  for index, s in enumerate(items or []):
                      if index in skip or not isinstance(s, dict):
                          continue
                      text = str(s.get('for_you') or '').strip()
                      if not text:
                          continue
                      try:
                          prio = int(s.get('priority') or 0)
                      except (TypeError, ValueError):
                          prio = 0
                      ranked.append((0 if s.get('category') in ACTION_CATEGORIES
                                      else 1, -prio, index, text))
                  ranked.sort()
                  return [row[3] for row in ranked[:FOR_YOU_MAX]]

              def cap_lines(lines, max_lines=None, max_bytes=None, keep_first=False):
                  """Trim to a line count and a UTF-8 byte count.

                  keep_first=True means a non-empty input always yields a
                  non-empty output: `Your day` must never shed every line and
                  then claim nothing needs him while a deadline is live. The
                  weather block leaves it off - there, silence is the answer.
                  """
                  out, used = [], 0
                  for line in lines:
                      if max_lines is not None and len(out) >= max_lines:
                          break
                      cost = len(line.encode('utf-8')) + 1
                      if out and max_bytes is not None and used + cost > max_bytes:
                          break
                      if (not out and max_bytes is not None
                              and cost > max_bytes and not keep_first):
                          break
                      out.append(line)
                      used += cost
                  return out

              def your_day_lines(items, wea, date_val, include_weather=True):
                  """`Your day` body lines, in priority order. Never empty.

                  DEADLINES FIRST, always: a time-critical obligation must
                  never be crowded out by weather. Then the surviving
                  `for_you` lines, then weather.

                  `include_weather` is the no-duplication switch. The ntfy
                  call site passes False because the push renders the weather
                  in its own labelled block; the flag exists so the contract
                  is stated at the call site instead of implied by a default.

                  WHY THERE IS NO BYTE CAP IN HERE
                  --------------------------------
                  This block used to be capped at 3 lines AND 700 bytes, on
                  this surface only. At ~260 bytes for a long deadline line
                  that fired on the THIRD line of an ordinary three-deadline
                  day: the push showed 2 `Your day` lines where the website
                  and the email showed 3, and the personal layer as rendered
                  was 545 bytes against a 1000-byte ceiling. The deadline that
                  vanished was the nearest one.

                  The push still has a hard 4096-byte budget and still honours
                  it, because PERSONAL_MAX_BYTES below is the ceiling and it is
                  measured on the RENDERED block. This block contributes one
                  ordering and one line count, identical to the other three
                  surfaces, and nothing else. `Your day` line selection must
                  not depend on which surface is reading it.
                  """
                  today = parse_day(date_val)
                  due = due_stories(items, today)
                  lines = ['%s - due %s' % (title, due_iso)
                           for _index, title, due_iso in due]
                  lines += for_you_lines(items, [row[0] for row in due])
                  if include_weather:
                      lines += list(wea or [])[:WEATHER_MAX]
                  if not lines:
                      # The same rule as the Python renderers: with no core
                      # line of its own and the weather being rendered in its
                      # own block below, return NOTHING rather than printing
                      # `Nothing needs you today.` directly above a "Take an
                      # umbrella" line that plainly does need him. personal_md
                      # skips an empty block.
                      if wea and not include_weather:
                          return []
                      return [NOTHING_TODAY]
                  return cap_lines(lines, YOUR_DAY_MAX_LINES, keep_first=True)

              def weather_block_lines(wea):
                  """Weather block body lines, or NOTHING when empty."""
                  if not wea:
                      return []
                  return cap_lines(list(wea)[:WEATHER_MAX], WEATHER_MAX,
                                   WEATHER_MAX_BYTES)

              # --- Category metadata (fixed order mirrors build_email.py SECTIONS) ---
              CATEGORY_ORDER = [
                  'action', 'world_major', 'local_city', 'education_tu',
                  'college_local', 'bank_local', 'nepal', 'gaming',
                  'anime', 'manga_manhwa_manhua', 'tech_career',
              ]
              CATEGORY_EMOJI = {
                  'action': '\u26a1',
                  'world_major': '\U0001f30d',
                  'local_city': '\U0001f3e0',
                  'education_tu': '\U0001f393',
                  'college_local': '\U0001f3eb',
                  'bank_local': '\U0001f3e6',
                  'nepal': '\U0001f1f3\U0001f1f5',
                  'gaming': '\U0001f3ae',
                  'anime': '\U0001f38c',
                  'manga_manhwa_manhua': '\U0001f4da',
                  'tech_career': '\U0001f4bc',
              }
              CATEGORY_LABEL = {
                  'action': 'ACTION / IMPORTANT',
                  'world_major': 'WORLD \u2014 MAJOR EVENTS',
                  'local_city': 'LOCAL & CITY',
                  'education_tu': 'TU / BSC CSIT',
                  'college_local': 'COLLEGE',
                  'bank_local': 'MY BANK',
                  'nepal': 'IMPORTANT NEPAL',
                  'gaming': 'GAMING',
                  'anime': 'ANIME',
                  'manga_manhwa_manhua': 'MANGA \u00b7 MANHWA \u00b7 MANHUA',
                  'tech_career': 'TECH / CAREER / OPPORTUNITIES',
              }

              # --- Website digest URL (click target) ---
              # The Pages ORIGIN, directly. Basic auth is enforced AT the
              # origin by functions/_middleware.js, so the origin is itself
              # the only host that can ask for the password - and it asks with
              # the ONE username the middleware accepts (the owner's email).
              #
              # This used to point at the `digest-auth` Worker, which proxied
              # here. That produced TWO prompts with TWO different usernames
              # (`digest` at the Worker, the owner's email here), so the owner
              # could not log in from the notification at all. The Worker was
              # deleted 2026-10-03. Do NOT reintroduce a proxy in front of the
              # origin: it cannot add protection the origin does not already
              # have, and it can only add a second identity prompt.
              # THE ORIGIN IS NOT COMMITTED. scripts/check_public_sanitisation.py
              # forbids the real Pages host in this repository, so it comes from
              # the CF_ARCHIVE_ORIGIN repository variable. The fallback below is
              # the committed placeholder and is NOT reachable -- it is kept only
              # so a missing variable degrades to today's behaviour instead of a
              # crash, and it says so in the log.
              archive_origin = (os.environ.get('CF_ARCHIVE_ORIGIN') or '').strip().rstrip('/')
              if not archive_origin:
                  archive_origin = 'https://daily-digest.example.pages.dev'
                  print('WARNING: CF_ARCHIVE_ORIGIN is unset, so this push links to the '
                        'placeholder host, which is not reachable. Set the repository '
                        'variable to the real Pages origin.')
              pages_url = '%s/digests/%s-%s.html' % (archive_origin, today, kind)

              # --- Build full digest markdown (HARD LIMIT 4096 bytes) ---
              MAX_BYTES = 4096

              # Honesty banner goes FIRST and is never truncated away: the
              # whole point is that an outage cannot be scrolled past. It is
              # also OUTSIDE the personal-layer budget below, so a squeeze on
              # the personal layer can never eat it.
              banner = banner_md(source_health, notes)
              banner_prefix = (banner + '\n\n') if banner else ''

              # Freshness line, immediately after the honesty banner and
              # OUTSIDE every byte budget below -- exactly like the banner. It
              # is a claim about how current the push is, so a squeeze on the
              # personal layer or on the story fill must never be able to eat
              # it. `head_prefix` is the concatenation the body is built from;
              # the banner still leads it, so the honesty contract outranks the
              # freshness contract.
              freshness = cutoff_line(
                  str(data.get('data_cutoff_npt') or '').strip(), source_health)
              if not freshness:
                  print('WARNING: no freshness line in this push '
                        '(cutoff=%r health=%r)'
                        % (data.get('data_cutoff_npt'), health_state(source_health)))
              freshness_prefix = (freshness + '\n\n') if freshness else ''
              head_prefix = banner_prefix + freshness_prefix

              # --- The personal layer, under its own byte ceiling ---
              # THE NO-DUPLICATION RULE (mirrored verbatim in
              # scripts/render_digest.py and scripts/build_email.py; the three
              # must not drift).
              #
              #   INVARIANT: no weather string appears TWICE in one rendered
              #   output, and the weather is never silently absent.
              #
              # THE SPLIT IS THE SAME ON ALL FOUR SURFACES: `Your day` holds
              # deadlines and `for_you` lines, and the weather appears exactly
              # once, in its own clearly-labelled block.
              #
              # It was tempting to put the weather INSIDE `Your day` here and
              # drop the extra block, because a push is tight and the header
              # is the only part that gets read. That is wrong here, and the
              # reason is mechanical: YOUR_DAY_MAX_LINES above is 3, and
              # your_day_lines caps from the END, so weather placed in that
              # block is clipped off the moment the owner has three deadlines
              # or for_you lines - i.e. on exactly the busiest days, the days
              # the weather matters most. The weather vanished from 14
              # consecutive digests once already, silently. One `**Weather**`
              # heading is 11 bytes of a 4096-byte budget; a rule that loses
              # the weather is not worth 11 bytes.
              def personal_md(yd_lines, wx_lines):
                  blocks = []
                  if yd_lines:
                      head = '**%s**' % YOUR_DAY_LABEL
                      body = '\n'.join('- %s' % ln for ln in yd_lines)
                      blocks.append('%s\n%s' % (head, body))
                  if wx_lines:
                      head = '**%s**' % WEATHER_LABEL
                      body = '\n'.join('- %s' % ln for ln in wx_lines)
                      blocks.append('%s\n%s' % (head, body))
                  return '\n\n'.join(blocks)

              # Priority order, fixed ONCE here because both the personal
              # layer and the story fill need it. Validator pre-sorts by
              # priority desc; re-sorted defensively. Ties keep input order.
              ordered = sorted(stories, key=lambda s: -(s.get('priority') or 0))

              weather = weather_advice_lines(data, candidates)
              # The personal layer is built from `stories` in ITS ORIGINAL
              # ORDER, not from `ordered`. `ordered` is the priority sort for
              # the STORY FILL only.
              #
              # `due_stories` sorts by (due_date, input_index), so the input
              # index is the tiebreak between two deadlines on the SAME day.
              # Feeding it a priority-sorted list silently renumbers that index
              # and therefore changes WHICH deadlines survive the 3-line cap:
              # the push was keeping a different three from the website, with a
              # lower-priority deadline shown and a higher-priority one
              # missing. `Your day` selection must not depend on a sort that
              # only the story fill needs.
              yd = your_day_lines(stories, weather, today, include_weather=False)
              wx = weather_block_lines(weather)
              personal = personal_md(yd, wx)

              # PERSONAL MAX_BYTES. Drop order is explicit and is NOT a
              # guess: weather advice first, then `Your day` from the bottom.
              # Deep story text is the most redundant thing in the body (the
              # push links to the website, which carries everything), so
              # stories are dropped before either of these, further down. The
              # honesty banner is not in this budget and is never touched.
              while personal and len(personal.encode('utf-8')) > PERSONAL_MAX_BYTES:
                  if wx:
                      wx = wx[1:]
                      personal = personal_md(yd, wx)
                  elif len(yd) > 1:
                      yd = yd[1:]
                      personal = personal_md(yd, wx)
                  else:
                      yd, wx = [], []
                      personal = ''
                      break
              personal_prefix = (personal + '\n\n') if personal else ''

              # --- At a glance: the orientation layer --------------------------
              # WHY THIS BLOCK EXISTS. The push is read on a phone. A phone
              # shows the TITLE and roughly the first line of the body, and the
              # title used to carry an emoji, a date and a count -- so a
              # collapsed notification said "a digest exists" and nothing else:
              # not what is in it, not whether it is worth opening, and not
              # whether it is non-empty. Everything below this block already
              # existed and was already correct; it was simply invisible until
              # the owner expanded the notification.
              #
              # WHAT IT IS NOT: a replacement. `Your day`, the weather block,
              # the full grouped digest and the truncation note all still
              # render, unchanged and in the same order, underneath.
              #
              # WHAT IT MAY NOT DO, and why each rule exists:
              #   * It may not lead the honesty banner or the freshness line.
              #     Both live in `head_prefix`, outside every byte budget in
              #     this body, and this block is placed strictly AFTER them.
              #     An outage can never be pushed down by an orientation layer.
              #   * It may not repeat the weather. The no-duplication invariant
              #     above is frozen, and tests/render/test_render_personal.py
              #     counts every weather string exactly once in the pre-digest
              #     region. The `**Weather**` block sits directly beneath this
              #     one, so the weather is still inside the collapsed preview --
              #     once, which is the only number the contract allows.
              #   * It may not invent anything. Every value is read off
              #     `ordered`, `source_health` and `today`: the same objects the
              #     digest below is built from. No re-fetch, no re-render, no
              #     model call.
              #   * It may not restate a story TITLE. This one is not a
              #     preference, it is a live contract:
              #     tests/render/test_render_personal.py:733 splits the body on
              #     blank lines and requires every story title to appear in
              #     EXACTLY ONE block, because a title printed twice is the most
              #     redundant content in the body (the same argument the story
              #     fill makes when it drops deep story text). So the glance
              #     reports the SHAPE of the digest -- counts, obligations, the
              #     mix -- and the headlines themselves stay in their own story
              #     blocks, where the owner finds them with the summary and the
              #     link attached. A glance line that named three stories would
              #     buy ~200 bytes of duplication and break that contract.
              #   * It may not look healthy when it is not. With 0 stories it
              #     says so in its own first line instead of printing an empty
              #     category mix, because an empty mix reads as "nothing new",
              #     and "nothing new" is a claim this repository refuses to make
              #     without a source check behind it.
              GLANCE_LABEL = 'At a glance'
              GLANCE_MAX_CATEGORIES = 5
              GLANCE_MAX_BYTES = 420

              # PRESENTATION ONLY. The category KEY is the contract; this map
              # exists because the full CATEGORY_LABEL strings ("WORLD — MAJOR
              # EVENTS", "TECH / CAREER / OPPORTUNITIES") cost more of a phone's
              # preview than one orientation line can spend. A key with no entry
              # here falls back to the key itself AND says so on the run log, so
              # a new category can never be silently mislabelled here.
              CATEGORY_SHORT = {
                  'action': 'action item',
                  'world_major': 'world',
                  'local_city': 'Local',
                  'education_tu': 'TU',
                  'college_local': 'College',
                  'bank_local': 'bank',
                  'nepal': 'Nepal',
                  'gaming': 'gaming',
                  'anime': 'anime',
                  'manga_manhwa_manhua': 'manga',
                  'tech_career': 'tech',
              }

              def glance_mix_line(subset):
                  """`2 gaming · 1 TU · 1 Nepal`, biggest section first.

                  Sorted by COUNT, not by the digest's section order: the point
                  of this line is to say where the day's news is, and on a day
                  with one story in five sections every count is 1, so section
                  order alone would spend the whole line saying "1, 1, 1, 1, 1"
                  and push the sixth section off the end. Ties keep
                  CATEGORY_ORDER, so the same digest always renders the same
                  line.
                  """
                  counts = {}
                  for s in subset:
                      cat = s.get('category', '')
                      counts[cat] = counts.get(cat, 0) + 1
                  rank = dict((cat, i) for i, cat in enumerate(CATEGORY_ORDER))
                  ranked = sorted(counts.items(),
                                  key=lambda kv: (-kv[1], rank.get(kv[0], 99), kv[0]))
                  for cat, _n in ranked:
                      if cat not in CATEGORY_SHORT:
                          print('WARNING: category %r has no glance short label; '
                                'the glance line will show the raw key'
                                % cat)
                  parts = ['%d %s' % (n, CATEGORY_SHORT.get(cat, cat))
                           for cat, n in ranked[:GLANCE_MAX_CATEGORIES]]
                  if len(ranked) > GLANCE_MAX_CATEGORIES:
                      parts.append('+%d more'
                                   % (len(ranked) - GLANCE_MAX_CATEGORIES))
                  return ' · '.join(parts)

              def glance_obligation_line(subset):
                  """Live obligations, counted the way `Your day` counts them.

                  `due_stories` is the SAME helper and the same today/tomorrow
                  window the personal block below uses, so the glance and
                  `Your day` cannot disagree about how many deadlines are live --
                  two blocks counting independently is how a push ends up saying
                  "nothing needs you" three lines under "1 deadline due".
                  """
                  bits = []
                  n_due = len(due_stories(subset, parse_day(today)))
                  if n_due:
                      bits.append('%d deadline%s due today or tomorrow'
                                  % (n_due, '' if n_due == 1 else 's'))
                  n_personal = sum(1 for s in subset
                                   if str(s.get('for_you') or '').strip())
                  if n_personal:
                      bits.append('%d of %d are about you'
                                  % (n_personal, len(subset)))
                  return ' · '.join(bits)

              def glance_block(subset):
                  """The at-a-glance block, or '' when there is nothing to say.

                  GLANCE_MAX_BYTES with an explicit drop order: the obligation
                  line goes first, then the extra categories. The category MIX is
                  never dropped -- a glance block that no longer says what is in
                  the digest is not an orientation layer, it is a second title.
                  """
                  head = '**%s**' % GLANCE_LABEL
                  if not subset:
                      # NOT a healthy-looking empty block. An empty category mix
                      # reads as "nothing new", and an empty digest has two very
                      # different causes, so this block separates them using the
                      # same source_health that produced the banner above it.
                      lines = ['- **0 stories** cleared filtering — nothing to '
                               'read below.']
                      state = health_state(source_health)
                      if state == 'ok':
                          lines.append('- Sources answered — a quiet news day, '
                                       'not a failure.')
                      else:
                          lines.append('- Source health is **%s** — this may be '
                                       'an outage, not a quiet day.' % state)
                      return '%s\n%s' % (head, '\n'.join(lines))
                  base = []
                  mix = glance_mix_line(subset)
                  if mix:
                      base.append('- %s' % mix)
                  obligations = glance_obligation_line(subset)
                  if obligations:
                      base.append('- %s' % obligations)
                  out = '%s\n%s' % (head, '\n'.join(base)) if base else ''
                  if obligations and len(out.encode('utf-8')) > GLANCE_MAX_BYTES:
                      base = base[:1]
                      out = '%s\n%s' % (head, '\n'.join(base))
                  return out

              glance = glance_block(ordered)
              glance_prefix = (glance + '\n\n') if glance else ''

              def story_md(s):
                  parts = []
                  label = (s.get('label') or '').strip()
                  title = (s.get('title') or '').strip()
                  prefix = '[%s] ' % label if label else ''
                  parts.append('**%s%s**' % (prefix, title))
                  summary = re.sub(r'\s+', ' ', (s.get('summary') or '').strip())
                  if summary:
                      parts.append(summary)
                  # DISPLAY-ONLY and OPTIONAL. Absent means NO line at all -
                  # not a bare label, not a dash. The condition is the fix.
                  for_you = str(s.get('for_you') or '').strip()
                  if for_you:
                      parts.append('_%s: %s_' % (FOR_YOU_LABEL, for_you))
                  markers = []
                  if s.get('deadline'):
                      markers.append('\U0001f4c5 Deadline: %s' % s['deadline'])
                  if s.get('event_date'):
                      markers.append('event: %s' % s['event_date'])
                  if s.get('reliability'):
                      markers.append(s['reliability'])
                  if markers:
                      parts.append('_%s_' % ' · '.join(markers))
                  # ONE LINK PER STORY, deliberately. This push is a teaser
                  # for the website, which carries every link; three Google
                  # News redirects for one story is ~900 bytes of the 4096 and
                  # is the mechanical reason the body truncates. article_url()
                  # already prefers a non-Google supporting_sources URL, so the
                  # single link is the real publisher's whenever one exists.
                  # The email path is unchanged and keeps all of them: it is
                  # the archive surface, where bytes are not scarce.
                  url, via_google = article_url(s)
                  if url:
                      parts.append('\U0001f517 [Read article](%s)%s'
                                   % (url, ' _via Google News_' if via_google else ''))
                  return '\n'.join(parts)

              def empty_hosts_of(entry):
                  raw = (entry or {}).get('empty_hosts')
                  if not isinstance(raw, list):
                      return []
                  return [h.strip() for h in raw if isinstance(h, str) and h.strip()]

              def health_state(health):
                  if not isinstance(health, dict):
                      return 'unknown'
                  state = str(health.get('state') or '').strip().lower()
                  return state if state in ('ok', 'partial', 'degraded', 'empty') else 'unknown'

              def status_is_untracked(cat, health):
                  """True when `cat` is absent from a health map we can trust.

                  THE B3a BRANCH, ADDED HERE TO MATCH THE OTHER TWO SURFACES.
                  This heredoc used to raise the B3 alarm for EVERY empty
                  section, including the ones nothing was ever configured to
                  check -- which is why the push filled with "may be incomplete"
                  for sections that have no source at all. scripts/render_digest.py
                  and scripts/build_email.py both split that case out as B3a and
                  made it quiet; without the same split here, the same fact was
                  reported three different ways, which is exactly what the comment
                  in build_email.py warns against.

                  UNTRACKED, not UNKNOWN: a present by_category plus a
                  non-`unknown` state means the collector ran and had nothing to
                  check. A missing/malformed health object, or state == unknown,
                  keeps the honest B3 alarm.
                  """
                  if not isinstance(health, dict):
                      return False
                  if health_state(health) == 'unknown':
                      return False
                  by_cat = health.get('by_category')
                  if not isinstance(by_cat, dict):
                      return False
                  return cat not in by_cat

              def section_status(cat, count, health):
                  """FROZEN CONTRACT B - one line per section, never silence.

                  Returns (line, alarm). The TONE is the second value because
                  build_digest needs it: the owner's rule is that a quiet empty
                  section is not displayed at all, while an alarm always is.
                  Literals are verbatim from scripts/render_digest.py and
                  scripts/build_email.py; all three are changed together.
                  """
                  by_cat = (health or {}).get('by_category')
                  entry = by_cat.get(cat) if isinstance(by_cat, dict) else None
                  if not isinstance(entry, dict):
                      entry = None

                  def num(key):
                      try:
                          return int((entry or {}).get(key) or 0)
                      except (TypeError, ValueError):
                          return 0

                  total, failed, skipped = num('total'), num('failed'), num('skipped')
                  if count > 0:
                      if failed > 0:
                          return ('> ⚠️ %d of %d sources for this section were unreachable.' % (failed, total), True)
                      return ('', False)
                  if entry is None:
                      if status_is_untracked(cat, health):
                          return ('> No sources are configured for this section.', False)
                      return ('> ⚠️ Source status unknown — this section may be incomplete.', True)
                  if skipped > 0:
                      return ('> ⚠️ Source status unknown — this section may be incomplete.', True)
                  if failed > 0:
                      raw_urls = entry.get('urls')
                      urls = [u.strip() for u in raw_urls
                              if isinstance(u, str) and u.strip()][:2] \
                          if isinstance(raw_urls, list) else []
                      if not urls:
                          return ('> ⚠️ Source status unknown — this section may be incomplete.', True)
                      return ('> ⚠️ Source unreachable — check %s' % ' or '.join(urls), True)
                  # B6: the sources were CHECKED and returned nothing usable.
                  # This is not B4's confident "nothing new", and the push
                  # must not borrow B4's confidence: a category whose hosts
                  # answered with garbage says so. Literal is identical to
                  # scripts/render_digest.py and scripts/build_email.py.
                  if empty_hosts_of(entry):
                      return ('> Nothing new from this source today (checked — the source returned nothing usable).', False)
                  return ('> Nothing new from this source today.', False)

              def section_is_hidden(count, alarm):
                  """True when a section is quiet AND empty, so nothing renders.

                  THE OWNER'S RULE: "if there is no news then do not display
                  Gaming - Nothing new from this source. just don't display it."

                  This push used to `continue` on `if not items`, which hid the
                  quiet sections correctly but ALSO hid the alarms - a source
                  the owner tracks going dark produced no line at all. Only the
                  quiet half is hidden now.
                  """
                  return count <= 0 and not alarm

              def build_digest(subset):
                  grouped = {}
                  for s in subset:
                      grouped.setdefault(s.get('category', ''), []).append(s)
                  blocks = []
                  for cat in CATEGORY_ORDER:
                      items = grouped.get(cat) or []
                      status, alarm = section_status(cat, len(items), source_health)
                      if section_is_hidden(len(items), alarm):
                          continue
                      emoji = CATEGORY_EMOJI.get(cat, '')
                      label = CATEGORY_LABEL.get(cat, cat)
                      head = '## %s %s' % (emoji, label) if emoji else '## %s' % label
                      body = [head]
                      if status:
                          body.append(status)
                      body.append('\n\n'.join(story_md(s) for s in items))
                      blocks.append('\n\n'.join(body))
                  return '\n\n'.join(blocks)


              # --- RECAP: a zero-story digest still ships something ---------
              # OWNER RULE: a digest with zero new stories ships a clearly
              # labelled recap of the most important items from the last 24
              # hours, marked as recap and NOT new. A bare "empty" push at
              # normal priority is forbidden.
              #
              # WHY IT LIVES HERE AND NOT IN validate_stories.py: feeding recap
              # rows back as `stories` would make them count toward the cap,
              # the event tracker, `for_you`, the delivery marker AND
              # update_history - it would re-consume items the owner already
              # has AND mark a zero-story slot delivered, which suppresses the
              # empty-digest retry ladder. A recap is a PRESENTATION of
              # history, so it is assembled here, at push time, from history,
              # and it changes nothing the pipeline counts.
              # The icon follows the WORD, which follows the clock. Both read from the
              # one `label_word` computed at push time above, so the icon and
              # the word are the same fact stated twice.
              emoji = icon_for_word(label_word)
              RECAP_MAX_ITEMS = 5

              def recap_pick(rows, want):
                  # Most important already-sent rows for one `date_sent`.
                  # Ranked by the SAME CATEGORY_ORDER the digest renders in,
                  # so a recap can never promote something the digest would
                  # have buried, then newest-appended first (history.json is
                  # append-ordered).
                  hit = [(i, r) for i, r in enumerate(rows)
                         if isinstance(r, dict)
                         and r.get('date_sent') == want
                         and str(r.get('title') or '').strip()]
                  hit.sort(key=lambda pair: (
                      CATEGORY_ORDER.index(pair[1]['category'])
                      if pair[1].get('category') in CATEGORY_ORDER
                      else len(CATEGORY_ORDER), -pair[0]))
                  return [r for _i, r in hit][:RECAP_MAX_ITEMS]

              def recap_rows(day_val):
                  # Returns (when, rows); `when` is None when there is no
                  # recap material at all.
                  #
                  # WINDOW, STATED HONESTLY. history.json records `date_sent`
                  # as a DATE, not a timestamp, so "the last 24 hours" cannot
                  # be computed exactly and must never be CLAIMED exactly.
                  # Two tiers, and the push says which one it used: `today`
                  # first (every one of those rows really is inside the last
                  # 24 hours for this slot), and only if that is empty,
                  # `yesterday` - labelled as yesterday rather than dressed
                  # up as 24h old.
                  try:
                      with open('state/history.json', encoding='utf-8') as fh:
                          blob = json.load(fh)
                  except (OSError, ValueError):
                      return None, []
                  rows = blob.get('stories') if isinstance(blob, dict) else blob
                  if not isinstance(rows, list):
                      return None, []
                  picked = recap_pick(rows, day_val)
                  if picked:
                      return 'today', picked
                  try:
                      prev = (datetime.date.fromisoformat(day_val)
                              - datetime.timedelta(days=1)).isoformat()
                  except (TypeError, ValueError):
                      return None, []
                  picked = recap_pick(rows, prev)
                  return ('yesterday', picked) if picked else (None, [])

              # Validator pre-sorts by priority desc; re-sorted defensively
              # above (before the personal layer, which needs the same order).

              # `empty_tags_extra` is appended to the tag list further down for
              # EVERY digest, recap or not, so it must be bound on BOTH paths.
              # Naming it only inside the empty branch made every ordinary
              # digest raise NameError at the tag loop - caught by running this
              # suite against the pre-fix heredoc, not by reading it.
              empty_tags_extra = []

              if not ordered:
                  recap_when, recap_items = recap_rows(today)
                  recap_tail = ('Nothing new cleared filtering for this slot '
                                '- nothing above is new.')
                  degraded_tail = ('**DEGRADED** - nothing new cleared '
                                   'filtering for this slot, and there is no '
                                   'recap material to fall back on. This is a '
                                   'delivery failure notice, not a quiet news '
                                   'day.')
                  recap_body = None
                  recap_lines = []
                  if recap_items:
                      head = ('**RECAP \u2014 not new.** Nothing cleared '
                              'filtering for this slot; these are the items '
                              'already pushed %s.' % recap_when)
                      recap_lines = ['- %s' % str(r.get('title') or '').strip()
                                     for r in recap_items]
                      while recap_lines:
                          cand_body = head + '\n' + '\n'.join(recap_lines)
                          cand = (head_prefix + glance_prefix
                                  + (cand_body + '\n\n')
                                  + personal_prefix + recap_tail)
                          if len(cand.encode('utf-8')) <= MAX_BYTES:
                              recap_body = cand_body
                              break
                          recap_lines.pop()
                  if recap_body is not None:
                      empty_title = '%s %s RECAP \u00b7 %s \u00b7 %d %s' % (
                          emoji, send_label, today, len(recap_lines),
                          'item' if len(recap_lines) == 1 else 'items')
                      empty_priority = 3
                      empty_tags_extra = ['arrows_counterclockwise']
                      message = (head_prefix + glance_prefix
                                 + (recap_body + '\n\n')
                                 + personal_prefix + recap_tail)
                  else:
                      empty_title = ('%s %s Digest \u00b7 %s \u00b7 degraded, '
                                     '0 items') % (
                          emoji, send_label, today)
                      empty_priority = 5
                      empty_tags_extra = ['warning']
                      message = (head_prefix + glance_prefix + personal_prefix
                                 + degraded_tail)
              else:
                  notice = '\n\n_Truncated — full digest: %s_' % pages_url
                  # Drop the lowest-priority stories first: the push links to
                  # the website, which carries every story in full, so deep
                  # story text is the most redundant content in the body.
                  message = ''
                  for k in range(len(ordered), 0, -1):
                      candidate = head_prefix + glance_prefix + personal_prefix \
                          + build_digest(ordered[:k])
                      if len(candidate.encode('utf-8')) + len(notice.encode('utf-8')) \
                              <= MAX_BYTES:
                          message = candidate + notice
                          break
                  if not message:
                      # Not even one story fits beside the banner and the
                      # personal layer. The banner still leads: the honesty
                      # contract outranks the content. The glance survives this
                      # squeeze on purpose -- it is bounded at GLANCE_MAX_BYTES,
                      # so keeping it costs a fixed ~420 bytes while a dropped
                      # story costs the owner the whole digest.
                      message = head_prefix + glance_prefix + personal_prefix + notice

              # --- Priority: 4 when something needs him; 5 ONLY for a CRITICAL
              # host down ---
              # Reserved on purpose: one failed Google News query must never
              # train the owner to ignore priority 5.
              # `high` is computed HERE rather than beside the tags because the
              # title below now has to say IN WORDS what this number used to
              # say only in music. One computation, two surfaces: a title can
              # never claim an escalation the payload does not carry, and the
              # priority can never move without the title explaining it.
              high = any(s.get('category') == 'action' or (s.get('priority') or 0) >= 8
                         for s in ordered)
              critical_down = (health_state(source_health) == 'degraded'
                               and hosts_down(source_health))
              priority = 5 if critical_down else (4 if high else 3)
              if not ordered:
                  priority = 5 if critical_down else empty_priority

              # --- Tags: "newspaper" + one emoji per category present ---
              tags = ['newspaper']
              seen = set()
              for s in ordered:
                  cat = s.get('category', '')
                  if cat in CATEGORY_EMOJI and cat not in seen:
                      tags.append(CATEGORY_EMOJI[cat])
                      seen.add(cat)

              if critical_down:
                  priority = 5
                  tags.append('rotting_light')
              for _extra in empty_tags_extra:
                  if _extra not in tags:
                      tags.append(_extra)

              # --- Title: emoji by slot, date, item count, AND WHY ---
              # WHY THE LAST CLAUSE EXISTS. `high` used to raise the push to
              # priority 4 and say NOTHING. A priority-4 phone notification is
              # visibly louder than the day before it, and the only way the owner
              # could tell what he had earned for it was to open the push and
              # read the body -- on a phone. So the escalation is now stated in
              # the title, in the same words for the same condition.
              #
              # THE COUNT IS NOT OPTIONAL and its FORMAT IS FROZEN:
              # tests/render/test_render_honesty.py:748 pins `4 items` in the
              # title, and `N item`/`N items` is the owner's own wording.
              if not ordered:
                  title = empty_title
              elif unsummarised:
                  # THE COUNT MAKES ROOM FOR THE LABEL, not the other way round.
                  # "unsummarised edition (no AI today)" is 35 characters and the
                  # title has 72; keeping `N items` as well pushes the one fact
                  # that changes how the whole push must be read off the shade.
                  title = '%s %s \u00b7 %s \u00b7 unsummarised edition (no AI today)' % (
                      emoji, send_label, today)
              else:
                  title = '%s %s \u00b7 %s \u00b7 %d %s' % (
                      emoji, send_label, today, len(ordered),
                      'item' if len(ordered) == 1 else 'items')

              # TITLE_MAX_CHARS. A phone notification truncates the title in the
              # shade, and a title clipped mid-word (`... 3 deadlines due t`)
              # is worse than one that dropped the clause entirely -- so the
              # clause is only added while the WHOLE title still fits. Measured
              # in characters, because that is what the shade counts.
              TITLE_MAX_CHARS = 72
              if high:
                  # What actually earned the escalation, in the owner's own
                  # vocabulary: an obligation with a date beats a raw priority
                  # number, because "due today" is the thing he can act on.
                  n_action = sum(1 for s in ordered if s.get('category') == 'action')
                  n_due = len(due_stories(ordered, parse_day(today)))
                  if n_due:
                      reason = ('%d deadline%s due' % (n_due, '' if n_due == 1 else 's'))
                  elif n_action:
                      reason = 'action needed'
                  else:
                      reason = 'high-priority'
                  # The 0-story case never reaches here: `high` is False on an
                  # empty digest, so the title honestly reads `0 items` and
                  # says nothing false about urgency. The glance block carries
                  # the "this is empty, not quiet" line instead.
                  if len(title) + len(reason) + 3 <= TITLE_MAX_CHARS:
                      title = '%s \u00b7 %s' % (title, reason)

              # THE SUPERSEDE IS LABELLED, IN WORDS, ON THE PHONE.
              #
              # D-003 (`.project/`, status IDEA, approval pending) contemplates a
              # partial push followed by a full one, and it requires the FIRST
              # push to be a labelled partial. What actually happened on the
              # evening of 2026-10-13 is that neither push said anything about
              # the other: the owner received two different evening digests with
              # different titles, priorities and item counts, and no way to tell
              # which was which.
              #
              # The `-full` sequence id is what makes them two notifications
              # instead of one being ERASED (ntfy replaces a message published
              # under a sequence id it has already seen). This is the other half:
              # the replacement says, in the title the shade shows, that it is a
              # replacement. Without it the id contract is internally consistent
              # and the owner's phone still shows two same-shaped evening digests.
              if is_supersede:
                  reason_full = 'full digest'
                  if len(title) + len(reason_full) + 3 <= TITLE_MAX_CHARS:
                      title = '%s \u00b7 %s' % (title, reason_full)
                  if 'arrows_counterclockwise' not in empty_tags_extra:
                      empty_tags_extra.append('arrows_counterclockwise')

              # --- Attach: top story image URL, if any ---
              attach = None
              if ordered:
                  img = ordered[0].get('image')
                  if isinstance(img, dict) and img.get('url'):
                      attach = img['url'].strip()

              payload = {
                  'topic': topic,
                  'title': title,
                  'message': message,
                  'tags': tags,
                  'priority': priority,
                  'click': pages_url,
                  'actions': [{'action': 'view', 'label': 'Open digest', 'url': pages_url}],
              }
              if attach:
                  payload['attach'] = attach

              if dry_run:
                  print('DRY RUN \u2014 ntfy notification not sent')
                  print('Payload preview:')
                  print(json.dumps(payload, ensure_ascii=False, indent=2))
                  # U6: hand this exact payload to digest-prebuild.yml's seal
                  # step, which builds the artifact the Worker's delivery arm
                  # reads. A prebuild runs the notification path in payload-only
                  # mode, so this branch is the ONLY place the payload exists.
                  #
                  # TO A FILE, NEVER TO STDOUT. `run_ntfy()` in
                  # tests/render/test_render_honesty.py decodes the JSON that
                  # follows "Payload preview:" out of this step's stdout, so a
                  # second JSON document here would be the single change in this
                  # whole unit that breaks 26 existing ntfy tests. A file write
                  # produces no stdout at all, so that parser is untouched.
                  with open('state/ntfy_payload.json', 'w', encoding='utf-8') as fh:
                      json.dump(payload, fh, ensure_ascii=False)
                  print('message bytes: %d (limit %d)' % (len(message.encode('utf-8')), MAX_BYTES))
                  write_flag(False)
                  return

              # --- POST to the NTFY_SERVER root (NOT /topic) ---
              url = server.rstrip('/') + '/'
              body = json.dumps(payload).encode('utf-8')

              # THE SLOT IDENTITY, AND IT MUST MATCH THE WORKER'S EXACTLY.
              #
              # ntfy does NOT deduplicate a caller-supplied message id -- and
              # it does not deduplicate `sequence_id` either; it STORES it, and
              # a cached message is readable back with
              # `GET <server>/<topic>/json?poll=1&since=all`. That is measured,
              # not assumed (see the delivery-guard comment in
              # deploy/cloudflare-worker.js), and it is the whole reason the
              # dedup below is OUR logic and not the server's.
              #
              # Both arms must therefore carry ONE identity for a slot or they
              # cannot recognise each other. The Worker computes this as
              # `dmn-<date>-<slot>` and sends it as `X-Sequence-Id`; this step
              # derives the identical string from the SAME two inputs (TODAY and
              # DIGEST_TIME), so a message this arm publishes is attributable to
              # the same slot as a message the Worker published or tried to.
              slot_seq = 'dmn-%s-%s' % (today, kind)
              # --- THE SEQUENCE ID, AND WHICH ONE THIS PUSH IS ---
              #
              # `digestFullSequenceId` in deploy/cloudflare-worker.js is
              # `digestSequenceId(date, slot) + '-full'`, and digest-prebuild.yml's
              # seal step already latches `supersede_sequence_id` under exactly
              # that value before it dispatches this workflow at
              # trigger_source=supersede. So the id the seal promised is the id
              # this step must send.
              #
              # UNTIL 2026-10-13 IT DID NOT. This step sent `slot_seq` -- the
              # BASE id -- for the supersede as well, and ntfy's contract is
              # "publish with the same sequence ID and clients replace the
              # previous notification". So the repair push meant to REPLACE a
              # degraded notice was instead erased by it: at 19:40 NPT on
              # 2026-10-13 this arm published under `dmn-2026-10-13-evening` and
              # ntfy removed the 19:25 notification the owner had already read.
              # One line, and it was the entire duplicate-delivery defect.
              push_seq = slot_seq + '-full' if is_supersede else slot_seq

              # ---- THE LEDGER GUARD, AND WHY IT READS DIFFERENT FIELDS ----
              #
              # ONE DELIVERY PER (date, slot) -- with exactly one exception, and
              # the exception is not a loophole, it is the repair.
              #
              # An ORDINARY push is suppressed when the ledger already records
              # `ntfy_sent_at` for this slot: something has already gone out for
              # this date and slot, so a second push is the defect the owner
              # reported on 2026-10-13, not a feature.
              #
              # The SUPERSEDE push reads `ntfy_full_sent_at` instead, and MUST.
              # Every degraded kind (partial, fallback_last_good, unavailable)
              # sets `ntfy_sent_at`, because a push happened; guarding on it
              # would make the repair unreachable on precisely the slots it
              # exists for, and a complete digest would sit sealed and never
              # sent. That asymmetry is pinned by tests/digest/test_supersede_push.py
              # on the dispatch side, and it is the same rule here.
              #
              # A ledger we could not read is NOT an empty ledger. `kv_read_ledger`
              # returns None for that case and the guard stands aside: the
              # read-back below still runs, and a push always happens.
              if kv_configured():
                  ledger = kv_read_ledger()
                  previous = kv_slot_entry(ledger, today, kind) if ledger else None
                  guard_field = 'ntfy_full_sent_at' if is_supersede else 'ntfy_sent_at'
                  if previous and previous.get(guard_field):
                      print('KV %s already records %s for %s %s (sequence_id %s) - '
                            'NOT publishing a second copy'
                            % (guard_field, previous.get('kind', 'a push'),
                               today, kind, previous.get('sequence_id', push_seq)))
                      write_flag(True)
                      return
              try:
                  readback_raw = urllib.request.urlopen(urllib.request.Request(
                      server.rstrip('/') + '/' + topic + '/json?poll=1&since=all'),
                      timeout=15).read().decode('utf-8', errors='replace')
                  # THE PARSE IS INSIDE THIS TRY, AND IT MUST STAY INSIDE. This
                  # is not tidiness, it is the fail-OPEN contract: a body that is
                  # neither NDJSON nor one whole document is "we do not know",
                  # which means publish, exactly like a transport failure.
                  #
                  # Hoisting the parse into an `else:` clause -- which the 2026-10-13
                  # half-finished refactor did -- makes an unparseable body
                  # escape `main()` and land on the FATAL handler at the bottom,
                  # which writes ntfy_ok=false and pushes NOTHING. A silent miss
                  # is the one outcome this module says is worse than a
                  # duplicate, and it would have arrived on the first malformed
                  # cache body. The pre-2026-10-13 shape had `json.loads()`
                  # inside this try for the same reason, and its log line --
                  #   the sequence_id read-back failed (JSONDecodeError)
                  # -- is only reachable from inside it.
                  readback = parse_ntfy_history(readback_raw)
              except Exception as exc:
                  # Fail OPEN, deliberately. An unreadable cache must not stop a
                  # delivery: the cost is a possible duplicate, the benefit is
                  # never a silent miss, and this module's delivery contract
                  # says a MISS is the worse outcome.
                  #
                  # THE CLASS NAME ONLY, NEVER THE MESSAGE. The URL above
                  # contains the topic, which is a publish/subscribe capability:
                  # anyone holding it can read the owner's alert stream AND
                  # publish into it. A transport exception string can quote the
                  # URL it was handed, so this prints the class and nothing else.
                  readback = None
                  print('WARNING: the sequence_id read-back failed (%s) - '
                        'publishing anyway; a possible duplicate is the accepted '
                        'cost' % exc.__class__.__name__)
              if isinstance(readback, list):
                  seen = [m for m in readback
                          if isinstance(m, dict) and m.get('sequence_id') == push_seq]
                  if seen:
                      # ---- A MESSAGE ON THE TOPIC IS A DELIVERY, AND IT IS
                      # ---- RECORDED HERE, FROM THE MESSAGE'S OWN CLOCK.
                      #
                      # Standing this slot down used to write state/.ntfy_ok and
                      # return, recording NOTHING -- so on 2026-10-26 evening the
                      # push whose KV write hit the 10013 bug existed on the
                      # topic and the ledger still read `pending`, and every
                      # later reader (the ladder, the watchdog, ?health=1) judged
                      # the slot undelivered. This is the same record
                      # record_delivery() writes after a real push.
                      #
                      # `since=all` returns the whole history and a slot can hold
                      # several messages under one sequence id, so take the
                      # newest: that is the one the owner's client shows.
                      message = max(seen, key=message_epoch)
                      sent_at = message_sent_at(message)
                      print('ntfy slot %s is already on the topic (read-back found '
                            '%d message(s), newest at %s) - NOT publishing a second copy'
                            % (push_seq, len(seen), sent_at or 'an unreadable instant'))
                      if not sent_at:
                          print('WARNING: the read-back message carries no readable '
                                '`time`, so this delivery is recorded without an '
                                'instant and the ladder will still see it as unproven')
                      record_delivery(today, kind, message.get('sequence_id') or push_seq, sent_at, is_supersede,
                                      inherit_stored_kind=True)
                      write_flag(True)
                      return
              try:
                  req = urllib.request.Request(url, data=body, headers={
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                      'Markdown': 'yes',
                      'X-Sequence-Id': push_seq,
                  })
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      result = json.loads(resp.read().decode('utf-8', errors='replace'))
                  if isinstance(result, dict) and result.get('id'):
                      print('ntfy notification sent to topic %r (id=%s)' % (topic, result['id']))
                      # GUARD 2. This is the write the two arms needed. Until
                      # 2026-10-13 an Actions push left NO trace in KV, so the
                      # Worker's duplicate guard could not see it: at 19:25 NPT
                      # this arm pushed the evening digest, and the Worker's
                      # 19:40 re-fire pushed the OLDER prebuild artifact over it
                      # under the same sequence id, which ntfy resolves by
                      # REPLACING the notification the owner had already read.
                      # Recording `ntfy_sent_at` here is what makes the Worker's
                      # own ledger guard able to suppress that second push.
                      #
                      # It is recorded AFTER the push is confirmed, never before:
                      # a `pending` record written by a run that then dies would
                      # suppress the next run's real digest, which is a silent
                      # miss. An at-least-once guarantee with a possible
                      # duplicate is the honest shape here; exactly-once is not
                      # available across "ntfy has it" and "KV has it".
                      #
                      # The SAME call the stand-down arm above makes, with the
                      # clock this push really happened at.
                      record_delivery(today, kind, push_seq,
                                      iso_utc(datetime.datetime.now(
                                          datetime.timezone.utc)),
                                      is_supersede)
                      write_flag(True)
                  else:
                      desc = str(result.get('description') or result) if isinstance(result, dict) else str(result)
                      print('ntfy reported: %s' % desc[:200])
                      write_flag(False)
              except Exception as exc:
                  print('WARNING: ntfy publish failed (ntfy_ok=false): %s' % exc)
                  write_flag(False)

          try:
              main()
          except Exception as exc:
              print('FATAL: unexpected ntfy step error (ntfy_ok=false): %s' % exc)
              write_flag(False)
          PY
          ntfy_ok="$(cat state/.ntfy_ok 2>/dev/null || echo false)"
          echo "ntfy_ok=$ntfy_ok" >> "$GITHUB_OUTPUT"

      - name: Send digest via Gmail (backup)
        # BACKUP channel: fires only when a primary (website or ntfy) failed.
        # Best-effort: a Gmail failure is recorded (state/.gmail_ok) but never
        # blocks the marker write / history / commit steps.
        #
        # `&& env.PHASE != 'prebuild'` IS MANDATORY, NOT DEFENSIVE. A prebuild
        # runs the notification path in payload-only mode, so state/.ntfy_ok is
        # written `false` BY DESIGN -- which is precisely the condition these two
        # backups fire on. Without this term the 06:50 prebuild would see
        # ntfy_ok=false, decide a primary had failed, and email the owner a
        # half-built digest twice a day, before the slot it is meant to precede.
        if: env.FALLBACK_NOOP != 'true' && (steps.deploy_website.outputs.website_ok != 'true' || steps.send_ntfy.outputs.ntfy_ok != 'true') && env.PHASE != 'prebuild'
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER }}
          DIGEST_TIME: ${{ steps.digest_time.outputs.time }}
          TODAY: ${{ env.TODAY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -eo pipefail
          START=$(date +%s)
          if [ "$DRY_RUN" = "true" ]; then
            END=$(date +%s)
            STAGE_KEY=send STAGE_DUR=$((END-START)) python3 -c "import json,os;p='state/timings.json';os.makedirs(os.path.dirname(p) or '.',exist_ok=True);d=json.load(open(p)) if os.path.isfile(p) else {};d[os.environ['STAGE_KEY']]=int(os.environ['STAGE_DUR']);json.dump(d,open(p,'w'),indent=2)"
            echo "DRY RUN — email not sent"
            echo "false" > state/.gmail_ok
            exit 0
          fi
          python3 - <<'PY'
          import os, smtplib, json
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          def write_flag(value):
              with open('state/.gmail_ok', 'w', encoding='utf-8') as fh:
                  fh.write('true' if value else 'false')

          try:
              kind = os.environ['DIGEST_TIME'].lower()
              today = os.environ['TODAY']
              html_path = 'state/email.html'
              text_path = 'state/email.txt'
              for path in (text_path, html_path):
                  if not os.path.isfile(path) or os.path.getsize(path) == 0:
                      print(f'FATAL: required email part missing or empty: {path}')
                      write_flag(False)
                      raise SystemExit(1)
              html_body = open(html_path, encoding='utf-8').read()
              text_body = open(text_path, encoding='utf-8').read()
              if '</html>' not in html_body.lower():
                  print('FATAL: email.html is not a complete HTML document - refusing to send')
                  write_flag(False)
                  raise SystemExit(1)

              msg = MIMEMultipart('alternative')
              # The subject is the lock-screen line for this channel; an
              # unsummarised edition must never arrive looking like a normal one.
              edition_tag = ''
              try:
                  with open('state/stories.validated.json', encoding='utf-8') as fh:
                      if json.load(fh).get('edition_kind') == 'unsummarised':
                          edition_tag = ' - unsummarised edition (no AI today)'
              except Exception as exc:
                  print(f'WARNING: could not read edition_kind for the subject: {exc}')
              msg['Subject'] = f'Daily Media News - {kind} - {today}{edition_tag}'
              receiver = os.environ.get('GMAIL_RECEIVER') or os.environ['GMAIL_USER']
              msg['From'] = os.environ['GMAIL_USER']
              msg['To'] = receiver
              msg.attach(MIMEText(text_body, 'plain', 'utf-8'))
              msg.attach(MIMEText(html_body, 'html', 'utf-8'))
              try:
                  with smtplib.SMTP('smtp.gmail.com', 587) as s:
                      s.starttls()
                      s.login(os.environ['GMAIL_USER'], os.environ['GMAIL_APP_PASSWORD'])
                      s.send_message(msg)
              except smtplib.SMTPException as exc:
                  print(f'FATAL: SMTP send failed: {exc}')
                  write_flag(False)
                  raise SystemExit(1)
              print('EMAIL SENT to', receiver)
              write_flag(True)
          except SystemExit:
              raise
          except Exception as exc:
              print(f'FATAL: unexpected Gmail error: {exc}')
              write_flag(False)
              raise SystemExit(1)
          PY
          END=$(date +%s)
          STAGE_KEY=send STAGE_DUR=$((END-START)) python3 -c "import json,os;p='state/timings.json';os.makedirs(os.path.dirname(p) or '.',exist_ok=True);d=json.load(open(p)) if os.path.isfile(p) else {};d[os.environ['STAGE_KEY']]=int(os.environ['STAGE_DUR']);json.dump(d,open(p,'w'),indent=2)"

      - name: Send Telegram digest (backup)
        # BACKUP channel: fires only when BOTH primaries (website AND ntfy)
        # failed. Best-effort: failures are logged and recorded
        # (state/.telegram_ok) but never block the marker write / history /
        # commit steps.
        #
        # `&& env.PHASE != 'prebuild'` for the same reason as the Gmail backup
        # above, and it is the same mandatory term: a prebuild reports ntfy_ok
        # false on purpose, which is exactly this step's trigger.
        if: env.FALLBACK_NOOP != 'true' && steps.deploy_website.outputs.website_ok != 'true' && steps.send_ntfy.outputs.ntfy_ok != 'true' && env.PHASE != 'prebuild'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TODAY: ${{ env.TODAY }}
          DIGEST_TIME: ${{ steps.digest_time.outputs.time }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          # Best-effort: Telegram failure is logged but never blocks the
          # workflow. Uses stdlib urllib only (no extra dependencies).
          # Sends the FULL digest from state/email.txt (plain-text version
          # of the email), split into chunks that respect Telegram's
          # 4096-char-per-message limit.
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          TG_MAX = 4000  # leave margin below Telegram's 4096 limit

          def write_flag(value):
              with open('state/.telegram_ok', 'w', encoding='utf-8') as fh:
                  fh.write('true' if value else 'false')

          import html as _html_mod

          def _clean_url_for_telegram(url):
              """Replace Google News redirect URLs with a clickable HTML link."""
              if url and "news.google.com/rss/articles" in url:
                  return '<a href="%s">\U0001f4f0 Read article</a>' % _html_mod.escape(url, quote=True)
              return '<a href="%s">\U0001f517 Read article</a>' % _html_mod.escape(url or "", quote=True)

          _GNEWS_URL_RE = re.compile(r'https?://news\.google\.com/rss/articles/\S+')

          def _clean_telegram_text(text):
              """HTML-escape the digest, then replace Google News redirect URLs
              and bare HTTP(S) URLs with clickable HTML links."""
              text = _html_mod.escape(text)
              def _replace_gnews(match):
                  return _clean_url_for_telegram(match.group(0))
              lines = text.split("\n")
              cleaned = []
              for line in lines:
                  if _GNEWS_URL_RE.search(line):
                      line = _GNEWS_URL_RE.sub(_replace_gnews, line)
                  else:
                      line = re.sub(
                          r'((?:https?://)[^\s<>&"]+)',
                          lambda m: _clean_url_for_telegram(m.group(1)),
                          line)
                  cleaned.append(line)
              return "\n".join(cleaned)

          token = (os.environ.get("TELEGRAM_BOT_TOKEN") or "").strip()
          if not token:
              print("No TELEGRAM_BOT_TOKEN — skipping Telegram digest")
              write_flag(False)
              raise SystemExit(0)

          dry_run = os.environ.get("DRY_RUN", "false").lower() == "true"
          today = os.environ.get("TODAY", "")
          kind = os.environ.get("DIGEST_TIME", "digest")

          # --- Discover chat_id via getUpdates (LAST chat.id) ------
          chat_id = (os.environ.get("TELEGRAM_CHAT_ID") or "").strip()
          if not chat_id:
              try:
                  url = "https://api.telegram.org/bot%s/getUpdates" % token
                  req = urllib.request.Request(url, headers={"Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode("utf-8", errors="replace"))
                  last_id = None
                  for upd in (data.get("result") or []):
                      chat = (upd.get("message") or {}).get("chat") or {}
                      if isinstance(chat, dict) and chat.get("id") is not None:
                          last_id = chat["id"]
                  if last_id is not None:
                      chat_id = str(last_id)
              except Exception as exc:
                  print("Telegram chat_id discovery failed: %s" % exc)

          if not chat_id:
              print("No chat_id available — skipping Telegram digest")
              write_flag(False)
              raise SystemExit(0)

          # --- Read full digest from email.txt ------
          digest_text = ""
          try:
              with open("state/email.txt", encoding="utf-8") as fh:
                  digest_text = fh.read().strip()
          except Exception as exc:
              print("WARNING: could not read state/email.txt: %s" % exc)

          if not digest_text:
              print("state/email.txt is empty or missing — skipping Telegram digest")
              raise SystemExit(0)

          # Clean Google News redirect URLs for tidy Telegram display
          digest_text = _clean_telegram_text(digest_text)

          # Prepend a header so the recipient knows what this is
          header = "\U0001f4f0 Daily Media News \u2014 %s (%s)\n%s\n" % (
              kind, today, "\u2500" * 30)
          full_text = header + digest_text

          if dry_run:
              print("DRY RUN — Telegram digest not sent")
              print("Telegram preview (first %d chars):\n%s" % (TG_MAX, full_text[:TG_MAX]))
              if len(full_text) > TG_MAX:
                  print("... (%d more chars)" % (len(full_text) - TG_MAX))
              write_flag(False)
              raise SystemExit(0)

          # --- Split into chunks respecting line boundaries ------
          chunks = []
          remaining = full_text
          while len(remaining) > TG_MAX:
              # Find last newline within the limit to avoid mid-line breaks
              split_at = remaining.rfind("\n", 0, TG_MAX)
              if split_at <= 0:
                  # No newline found — hard-break at limit
                  split_at = TG_MAX
              else:
                  split_at += 1  # include the newline
              chunks.append(remaining[:split_at])
              remaining = remaining[split_at:]
          if remaining:
              chunks.append(remaining)

          # --- Send via Telegram sendMessage API (one call per chunk) ------
          url = "https://api.telegram.org/bot%s/sendMessage" % token
          sent = 0
          for idx, chunk in enumerate(chunks):
              try:
                  payload = json.dumps({
                      "chat_id": chat_id,
                      "text": chunk,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True,
                  }).encode("utf-8")
                  req = urllib.request.Request(url, data=payload, headers={
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  })
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      result = json.loads(resp.read().decode("utf-8", errors="replace"))
                  if isinstance(result, dict) and result.get("ok") is True:
                      sent += 1
                  else:
                      desc = str(result.get("description") or result) if isinstance(result, dict) else str(result)
                      print("Telegram sendMessage chunk %d reported: %s" % (idx + 1, desc[:200]))
              except Exception as exc:
                  print("WARNING: Telegram chunk %d failed (non-blocking): %s" % (idx + 1, exc))

          write_flag(sent > 0)
          print("Telegram digest sent to chat %s — %d/%d chunks delivered" % (
              chat_id, sent, len(chunks)))
          PY

      - name: Record delivery status
        # Writes state/last_digest_sent.json with the channels schema:
        # {date, time, stories, empty_digest, channels: {...}, delivered}.
        # delivered=true when at least one primary OR backup channel succeeded
        # AND THE DIGEST ACTUALLY HAD STORIES.
        # The fallback no-op guard reads this file and skips only when the
        # marker matches date+time AND delivered=true AND stories>0 AND
        # dry_run is absent or false. A delivered=false marker means every
        # channel failed; a STORIES==0 marker means there was nothing to
        # deliver; a dry_run marker means nothing was sent at all. In all three
        # cases the fallback must run.
        #
        # A PREBUILD IS A FOURTH CASE, AND IT IS THE ONE THAT BREAKS THE LADDER
        # SILENTLY. `phase: prebuild` runs the notification path in payload-only
        # mode, so it pushes nothing -- yet the deploy step really did publish
        # the page, so website_ok is genuinely true here. Left alone, a prebuild
        # at 06:50 would write delivered=true for a digest the owner has NOT been
        # sent; the 07:50 `Fallback no-op check` would read that marker, arm
        # FALLBACK_NOOP, and stand the entire fallback ladder down -- with every
        # job in the repository green. So a prebuild forces delivered=false AND
        # forces every channel flag false, below, and stamps phase on the marker
        # so the file says WHY it is not a delivered slot.
        if: env.FALLBACK_NOOP != 'true'
        env:
          DIGEST_TIME: ${{ steps.digest_time.outputs.time }}
          TODAY: ${{ env.TODAY }}
          DRY_RUN: ${{ env.DRY_RUN }}
          PHASE: ${{ env.PHASE }}
          TZ: Asia/Kathmandu
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import datetime, json, os

          def flag_ok(name):
              try:
                  with open('state/.%s_ok' % name, encoding='utf-8') as fh:
                      return fh.read().strip().lower() == 'true'
              except OSError:
                  return False

          slot = os.environ['DIGEST_TIME']
          today = os.environ['TODAY']
          dry_run = os.environ.get('DRY_RUN', 'false').lower() == 'true'
          # U6. Anything other than the declared choice is treated as `full`,
          # because `full` is the safe direction for the DEPLOY side and the
          # 'Determine date, digest time and trigger source' step has already
          # exited 1 on an unrecognised phase -- this is a belt for a step that
          # can be read on its own.
          phase = (os.environ.get('PHASE') or 'full').strip().lower() or 'full'
          prebuild = phase == 'prebuild'
          # A dry run delivered NOTHING by definition. Every per-channel flag
          # is forced False here, not just the ones the guards happen to
          # cover, so a future step that writes `true` into a flag file under
          # a dry run still cannot produce delivered=true.
          #
          # A PREBUILD DELIVERED NOTHING EITHER, for the same structural reason:
          # it published the page and committed the archive but pushed no
          # notification, and `website_ok` is a fact about the SITE, not about
          # the owner. Forcing the flags false here is what stops a real page
          # deploy from being read as "the owner has their digest".
          if prebuild:
              website_ok = ntfy_ok = gmail_ok = telegram_ok = False
          else:
              website_ok = False if dry_run else flag_ok('website')
              ntfy_ok = False if dry_run else flag_ok('ntfy')
              gmail_ok = False if dry_run else flag_ok('gmail')
              telegram_ok = False if dry_run else flag_ok('telegram')
          # A channel that delivered an EMPTY digest has not delivered a
          # digest. The count is the validator's own `stories` list, not the
          # agent's claim, and `empty_kind` is the frozen classification of
          # WHY it is empty (quiet_day vs broken).
          stories = 0
          stories_known = False
          empty_digest = False
          empty_kind = None
          empty_evidence = ''
          broken_input = False
          try:
              with open('state/stories.validated.json', encoding='utf-8') as fh:
                  validated = json.load(fh)
              # A READABLE BUT STRUCTURALLY WRONG file is BROKEN INPUT, not a
              # quiet day. `stories` must be a LIST: the validator always writes
              # one -- `"stories": []` on a genuinely quiet day -- so a missing
              # or non-list value is the same false-quiet-day class as an
              # unreadable file, and it may not arm the retry ladder either.
              kept = validated.get('stories') if isinstance(validated, dict) else None
              if isinstance(kept, list):
                  stories = len(kept)
                  stories_known = True
                  empty_kind = validated.get('empty_kind')
                  empty_evidence = str(validated.get('empty_evidence') or '')
                  empty_digest = str(validated.get('stories_outcome') or '') == 'empty'
              else:
                  broken_input = 'readable JSON with no `stories` list'
          except (OSError, ValueError) as exc:
              broken_input = 'unreadable or unparseable (%s)' % exc
          if broken_input:
              # LOUD, and sticky for the rest of the run: the reason is exported
              # so the "Assert digest is not empty" step at the end fails the
              # job on it. The ladder is still left alone (stories_known stays
              # False), so this annotates WITHOUT breaking the retry contract.
              print('::error::state/stories.validated.json is BROKEN input - %s'
                    % broken_input)
              env_file = os.environ.get('GITHUB_ENV')
              if env_file:
                  with open(env_file, 'a', encoding='utf-8') as fh:
                      fh.write('STORIES_VALIDATED_BROKEN=true\n')
          # An unreadable or structurally-wrong file is not a zero-story digest,
          # so it may not claim "empty".
          empty_digest = empty_digest or (stories_known and stories == 0)
          # THE HARD TERM. `stories > 0` is what stops a zero-story run from
          # writing delivered=true, and therefore what stops the NEXT run for
          # the same slot from arming FALLBACK_NOOP on this run's marker.
          delivered = (not dry_run) and (not prebuild) and (stories > 0) and (
              website_ok or ntfy_ok or gmail_ok or telegram_ok)
          data = {
              'date': today,
              'time': slot,
              'stories': stories,
              'empty_digest': bool(empty_digest),
              'empty_kind': empty_kind,
              'channels': {
                  'website': website_ok,
                  'ntfy': ntfy_ok,
                  'gmail': gmail_ok,
                  'telegram': telegram_ok,
              },
              'delivered': delivered,
              'dry_run': dry_run,
              # WHY THIS MARKER EXISTS AND WHY IT IS NOT OPTIONAL. `delivered`
              # alone cannot say WHICH of the reasons produced it, and 'prebuild'
              # is the reason that would otherwise look exactly like a delivered
              # slot to every reader that does not know this history. Stamped on
              # every marker, both phases, so the file is self-describing.
              'phase': phase,
          }
          path = 'state/last_digest_sent.json'
          tmp = path + '.tmp'
          with open(tmp, 'w', encoding='utf-8') as fh:
              json.dump(data, fh, indent=2)
              fh.write('\n')
          os.replace(tmp, path)
          print('recorded delivery status: %s' % json.dumps(data))

          # -- The empty-digest retry ladder (FROZEN CONTRACT 1d) ----------
          # state/digest_retry.json is the ONLY handoff to
          # digest-watchdog.yml's `empty_digest_retry` job. It is written here
          # because this step is the one that knows the story count, and it is
          # committed below so the watchdog (a different workflow, a different
          # runner) can read it.
          #
          # `attempts` counts empty digests observed for THIS (date, slot).
          # A different slot or date starts a fresh ladder. `next_retry_at_npt`
          # is +15 min after the first empty and +45 min after the second, so
          # a genuinely quiet day costs three runs spread over an hour rather
          # than three runs in three minutes.
          retry_path = 'state/digest_retry.json'
          now_npt = datetime.datetime.now().strftime('%Y-%m-%d %H:%M')
          if not stories_known:
              print('story count unavailable — leaving the retry ladder alone')
          elif not empty_digest:
              if os.path.exists(retry_path):
                  print('digest produced %d stories — clearing the retry ladder' % stories)
                  os.remove(retry_path)
          else:
              attempts = 1
              started = now_npt
              if os.path.exists(retry_path):
                  try:
                      with open(retry_path, encoding='utf-8') as fh:
                          prev = json.load(fh)
                      if (isinstance(prev, dict)
                              and prev.get('date') == today
                              and prev.get('slot') == slot):
                          attempts = int(prev.get('attempts') or 0) + 1
                          started = str(prev.get('started_at_npt') or now_npt)
                      else:
                          print('retry ladder for a different slot/date — starting a new one')
                  except (OSError, ValueError, TypeError) as exc:
                      print('could not read %s (%s) — starting a new ladder' % (retry_path, exc))
              gap = 15 if attempts <= 1 else 45
              try:
                  started_dt = datetime.datetime.strptime(started, '%Y-%m-%d %H:%M')
              except ValueError:
                  started_dt = datetime.datetime.strptime(now_npt, '%Y-%m-%d %H:%M')
              retry = {
                  'schema_version': 1,
                  'slot': slot,
                  'date': today,
                  'attempts': attempts,
                  'last_empty_kind': empty_kind or 'quiet_day',
                  'last_empty_evidence': empty_evidence,
                  'started_at_npt': started,
                  'next_retry_at_npt': (started_dt + datetime.timedelta(minutes=gap)
                                        ).strftime('%Y-%m-%d %H:%M'),
                  'max_attempts': 3,
              }
              with open(retry_path, 'w', encoding='utf-8') as fh:
                  json.dump(retry, fh, indent=2)
                  fh.write('\n')
              print('empty digest (%s) recorded: %s' % (empty_kind, json.dumps(retry)))
          PY

      - name: Update story history
        if: env.FALLBACK_NOOP != 'true'
        # Runs after the delivery steps (primary + backup) and the
        # delivery-status record; history is updated regardless of which
        # channel delivered (or after dry-run completion).
        run: |
          set -eo pipefail
          python3 scripts/update_history.py \
            --stories state/stories.validated.json \
            --history state/history.json \
            --state state/active_stories.json

      - name: Upload digest artifacts
        if: always() && env.FALLBACK_NOOP != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-${{ steps.digest_time.outputs.time }}-${{ github.run_id }}
          # THE RENDERED WEB PAGE IS IN THIS LIST, and it is the last entry on
          # purpose. digest-prebuild.yml's seal asserts the archive scrapers'
          # markup and hashes the file into html_sha256, and it refuses to seal
          # unless page_url addresses that same page -- but the page was never
          # in the artifact, so the seal asserted the EMAIL (which carries none
          # of that markup) and red-lined 12 runs out of 12. Adding it here is
          # what makes the assertion, the hash and the click target describe
          # the same bytes.
          #
          # NO COMMENT LINES INSIDE THE `path:` BLOCK. upload-artifact splits it
          # into glob patterns and every line -- including a `#` one -- becomes
          # a search path, which would silently feed the archive-root
          # calculation. Check 20 in tests/workflows/test_workflow_lint.py
          # strips them; the action would not. That divergence is exactly how
          # a guard agrees with itself while production disagrees.
          #
          # THIS ENTRY ALSO MOVES THE ARCHIVE ROOT, which is expected and is
          # why the seal job was updated with it: with a path under `docs/`,
          # the LCA of the whole list is the WORKSPACE ROOT, so each file now
          # unpacks under its own directory (`prebuild/state/...`,
          # `prebuild/docs/digests/...`) instead of flat. Check 20 derives the
          # root from this same list, so the two cannot drift apart unnoticed.
          path: |
            state/email.html
            state/email.txt
            state/stories.validated.json
            state/agent-log.txt
            state/ntfy_payload.json
            docs/digests/${{ env.TODAY }}-${{ steps.digest_time.outputs.time }}.html
          retention-days: 7
          if-no-files-found: warn

      - name: Summarize digest
        if: env.FALLBACK_NOOP != 'true'
        env:
          TZ: Asia/Kathmandu
          TRIGGER_SOURCE: ${{ env.TRIGGER_SOURCE }}
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json, os, time
          notice = os.environ.get('VALIDATE_NOTICE', '')
          count = 0
          try:
              with open('state/stories.validated.json', encoding='utf-8') as fh:
                  data = json.load(fh)
              if isinstance(data, dict):
                  data = data.get('stories', [])
              if isinstance(data, list):
                  count = len(data)
          except Exception as exc:
              print(f'Could not count stories: {exc}')
          timings = {}
          try:
              with open('state/timings.json', encoding='utf-8') as tfh:
                  loaded = json.load(tfh)
              if isinstance(loaded, dict):
                  timings = loaded
          except Exception as exc:
              print(f'Could not read timings: {exc}')
          # Persist which path delivered this run (worker dispatch vs
          # github-schedule fallback) alongside the stage timings.
          timings['trigger_source'] = os.environ.get('TRIGGER_SOURCE', 'unknown')
          try:
              run_start = int(os.environ.get('RUN_START') or 0)
              if run_start > 0:
                  timings['total'] = int(time.time()) - run_start
                  with open('state/timings.json', 'w', encoding='utf-8') as tfh:
                      json.dump(timings, tfh, indent=2)
          except Exception as exc:
              print(f'Could not record total: {exc}')
          order = ['checkout', 'setup', 'collect', 'agent', 'validate',
                   'build', 'send', 'total']
          rows = [(k, timings[k]) for k in order
                  if isinstance(timings.get(k), (int, float))]
          rows += [(k, v) for k, v in sorted(timings.items())
                   if k not in order and k != 'by_source'
                   and isinstance(v, (int, float))]
          print(f'Digest story count: {count}')
          for k, v in rows:
              print(f'timing {k}: {v}s')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('## Daily Media News\n\n')
              fh.write(f'- Digest stories: {count}\n')
              fh.write(f"- Trigger source: {timings.get('trigger_source', 'unknown')}\n")
              if notice:
                  fh.write(f'- Validation notice: {notice}\n')
              if rows:
                  fh.write('\n### Stage timings\n\n| stage | seconds |\n|---|---|\n')
                  for k, v in rows:
                      fh.write(f'| {k} | {v} |\n')
          PY

      - name: Archive digest copy
        if: env.FALLBACK_NOOP != 'true'
        run: |
          set -eo pipefail
          mkdir -p state/digest-archive
          # THIS FILENAME WAS A COLLISION, AND IT IS THE SAME DEFECT AS THE PAGE.
          #
          # `${DIGEST_TIME}-${TODAY}.html` is one name per (slot, date), so the
          # second build of a slot MOVED its email over the first one's with no
          # record. On the evening of 2026-10-13 the 19:40 re-fire archived over
          # the 19:25 email: the 18:44 stories (BLEACH, Character.ai, the
          # highway food-safety item) were removed from the archive the moment the
          # duplicate push they caused landed.
          #
          # Nothing reads these by name -- they are a retained copy, not an index
          # -- so the fix is to stop destroying: the build time comes from the
          # email's own footer, the same source of truth the page swap uses, and
          # an existing name is never overwritten.
          ARCHIVE_DIR="state/digest-archive" DIGEST_TIME="$DIGEST_TIME" \
          TODAY="$TODAY" python3 - <<'PY'
          import os, re, shutil

          FOOTER = re.compile(
              r'Generated by Personal News Informer\s+[\u00b7\u2014-]\s*'
              r'(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s+NPT')

          def built_at(path):
              try:
                  with open(path, encoding='utf-8', errors='replace') as fh:
                      match = FOOTER.search(fh.read())
              except OSError:
                  return None
              return match.group(1) if match else None

          src = 'state/email.html'
          if not os.path.isfile(src):
              print('WARNING: state/email.html is absent; nothing archived')
              raise SystemExit(0)
          # The archive is this step's WHOLE job, so it creates its own
          # destination rather than trusting the `mkdir -p` two lines above it.
          # Without the directory `shutil.move` raises FileNotFoundError and the
          # step dies holding nothing -- measured 2026-10-13:
          #   FileNotFoundError: 'state/email.html' -> '.../digest-archive/<name>.html'
          os.makedirs(os.environ['ARCHIVE_DIR'], exist_ok=True)
          # UNDATED IS STILL ARCHIVED, under a name that cannot collide. An
          # unparseable footer must not cost the owner the build.
          stamp = (built_at(src) or 'undated').replace(':', '').replace(' ', '-')
          base = '%s-%s-%s' % (os.environ['TODAY'], os.environ['DIGEST_TIME'], stamp)
          dest = os.path.join(os.environ['ARCHIVE_DIR'], base + '.html')
          n = 2
          while os.path.exists(dest):
              dest = os.path.join(os.environ['ARCHIVE_DIR'],
                                  '%s-%d.html' % (base, n))
              n += 1
          shutil.move(src, dest)
          print('archived email build to %s' % dest)
          PY
          find state/digest-archive -type f -name '*.html' -mtime +14 -delete
          ls -la state/digest-archive

      - name: Clean transient state files
        if: env.FALLBACK_NOOP != 'true'
        # These were uploaded as artifacts above; they are removed here so the
        # bot commit below never includes them (.gitignore is outside this
        # change's scope). The bot commit stages history.json +
        # digest-archive/ plus state/active_stories.json when it exists.
        run: |
          set -eo pipefail
          rm -f state/stories.json state/stories.validated.json state/email.txt state/agent-log.txt state/candidates.json state/candidates_limited.json state/candidates.full.json state/timings.json state/.website_ok state/.ntfy_ok state/.gmail_ok state/.telegram_ok state/ntfy_payload.json

      - name: Commit state changes
        # DRY_RUN guard: `git push` is an outward-facing side effect, so a dry
        # run must not write to master either. Without this a canary pushes a
        # dry_run marker plus regenerated docs/digests/ + docs/index.html into
        # the repository even though it published nothing.
        if: env.FALLBACK_NOOP != 'true' && env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # U8. The delivery-ledger mirror block below reads these two, and
          # they are the SAME values every other step in this job uses — the
          # slot this run built and the Nepal date it is filed under. A mirror
          # written against a different pair would file a build under the wrong
          # slot, which is the exact mis-attribution U8 exists to remove.
          DIGEST_TIME: ${{ steps.digest_time.outputs.time }}
          TODAY: ${{ env.TODAY }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # DEFECT 2. The checkout sets persist-credentials: false, so
          # GITHUB_TOKEN is NOT in .git/config and the `--auto` agent step
          # cannot find it. It is injected here instead, for the network
          # commands only, via `git -c`: it reaches the process argv, never the
          # filesystem, and is gone when the step ends. `auth` stays empty if
          # the token is unset, degrading to a plain unauthenticated push
          # instead of a syntax error.
          auth=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)")
          else
            echo "::warning::GITHUB_TOKEN is empty -- pull/push will run unauthenticated"
          fi
          # U8. THE GIT MIRROR OF THE DELIVERY LEDGER, refreshed by this run.
          #
          # DIRECTION OF TRUTH, which is the rule this whole block exists to
          # keep: KV IS AUTHORITATIVE FOR DELIVERY and git never decides whether
          # a push happened; GIT IS AUTHORITATIVE FOR BUILD. This run is the
          # only witness to its own build, so it writes the build half. It
          # writes NOTHING into the delivery half.
          #
          # WHY IT MAY NOT CREATE A SLOT ENTRY, and this is the part that is
          # easy to get wrong. A slot entry with no `ntfy_sent_at` reads as
          # MISSED, so writing one here — even a perfectly truthful build-only
          # record — would let a GitHub-side run declare a delivery that the
          # Worker never made. That is exactly the authority this file does not
          # have. So: if the mirror does not exist, this run writes no mirror
          # (digest-prebuild.yml's mirror step owns creating it, from the KV it
          # just read); if it does exist, this run refreshes the build fields
          # ONLY on entries KV already created.
          #
          # IT DOES NOT DELETE ANYTHING EITHER. A day that ages out is the
          # mirror step's prune to make, against the same retention the Worker
          # applies; this block never removes a day.
          SLOT="$DIGEST_TIME" TODAY="$TODAY" python3 - <<'PY'
          import json, os

          MIRROR = 'state/digest_slot_ledger.json'
          slot = os.environ['SLOT']
          today = os.environ['TODAY']

          try:
              with open('state/stories.validated.json', encoding='utf-8') as fh:
                  validated = json.load(fh)
          except (OSError, ValueError) as exc:
              print('could not read stories.validated.json (%s) - the delivery '
                    'ledger mirror keeps the build fields it already has' % exc)
              validated = {}
          if not isinstance(validated, dict):
              validated = {}
          stories = validated.get('stories')
          count = len(stories) if isinstance(stories, list) else 0
          health = validated.get('source_health')
          health_state = (str(health.get('state') or '').strip().lower()
                          if isinstance(health, dict) else 'unknown')

          if not os.path.isfile(MIRROR):
              print('%s does not exist yet; this run does not create it. The seal '
                    "job's mirror step owns that, because only it has read the KV "
                    'delivery ledger this record is a copy of.' % MIRROR)
              raise SystemExit(0)
          try:
              with open(MIRROR, encoding='utf-8') as fh:
                  mirror = json.load(fh)
          except (OSError, ValueError) as exc:
              print('::warning::%s is unreadable (%s) - leaving it exactly as it is '
                    'rather than rewriting a record of deliveries this run did not '
                    'witness' % (MIRROR, exc))
              raise SystemExit(0)
          if not isinstance(mirror, dict) or not isinstance(mirror.get('days'), dict):
              print('::warning::%s is not a delivery-ledger mirror; leaving it alone'
                    % MIRROR)
              raise SystemExit(0)

          day = mirror['days'].get(today)
          entry = day.get(slot) if isinstance(day, dict) else None
          if not isinstance(entry, dict):
              print('%s records no KV entry for %s %s; this run adds no build fields '
                    'to a slot it must not create' % (MIRROR, today, slot))
              raise SystemExit(0)
          entry['built_at'] = entry.get('built_at') or str(
              validated.get('generated_at_npt') or '')
          entry['story_count'] = count
          entry['source_health_state'] = health_state
          with open(MIRROR, 'w', encoding='utf-8') as fh:
              json.dump(mirror, fh, indent=2, ensure_ascii=False, sort_keys=True)
              fh.write('\n')
          print('delivery ledger mirror: build half refreshed for %s %s (%d stories, '
                'source_health=%s); delivery half untouched' % (today, slot, count,
                                                                health_state))
          PY

          git add state/history.json state/digest-archive/ state/last_digest_sent.json docs/digests/ docs/index.html
          # The empty-digest retry ladder is committed BOTH ways on purpose:
          # a new file is staged, and a deleted one (a digest that finally had
          # stories) is staged as a deletion. `git add <path>` records a
          # removal on modern git, but only when the path is known to the
          # index, hence the explicit --ignore-unmatch for the absent case.
          if [ -f state/digest_retry.json ]; then
            git add state/digest_retry.json
          else
            git rm --cached --ignore-unmatch state/digest_retry.json >/dev/null 2>&1 || true
          fi
          if [ -f state/digest_slot_ledger.json ]; then
            git add state/digest_slot_ledger.json
          fi
          if [ -f state/active_stories.json ]; then
            git add state/active_stories.json
          fi
          # state/model_cooldown.json is NOT staged here. It is owned by
          # "Persist model cooldowns" below, which runs on `always()`: a cooldown
          # recorded by a walk that then FAILED was lost here, because this step
          # is skipped on any earlier failure -- the exact run that needs it.
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update digest state and archive [skip ci]"
            # An interleaved breaking-monitor commit can land between our
            # checkout and this push; ff-only pull re-syncs or fails loudly
            # instead of a non-fast-forward rejection (mirrors
            # breaking-monitor.yml's commit step).
            # Attempt fast-forward pull; if it fails, rebase with -X theirs so
            # conflicts in the deterministic generated files (docs/digests/*.html,
            # docs/index.html, state/*.json) auto-resolve in favor of the remote
            # (theirs wins) instead of stalling the rebase on conflict markers.
            if ! git "${auth[@]}" pull --ff-only origin master; then
              echo "Fast-forward pull failed, attempting rebase (theirs wins on generated files)..."
              if ! git "${auth[@]}" pull --rebase -X theirs origin master; then
                echo "Rebase pull also failed — proceeding without pulling (may cause conflicts)"
              fi
            fi
            git "${auth[@]}" push
          fi

      - name: Persist model cooldowns
        # THE COOLDOWN HAS TO OUTLIVE THE FAILURE THAT CREATED IT. Measured in
        # run 40658585532: the shared-pool refusal was recorded correctly and
        # then thrown away, because `Commit state changes` above is skipped when
        # an earlier step fails -- and the walk that records a pool cooldown is
        # usually the walk that dies on it. Run 40539483837 lost three
        # `model_not_found` vetoes the same way. So this step runs on `always()`,
        # and it is the only writer of the cooldown file.
        #
        # `always()` alone is not enough for Check 7's rule, so it also carries
        # `continue-on-error: true`: losing the file costs one re-learned
        # refusal, while turning a finished run red would cost the owner the
        # signal that something else broke.
        #
        # SKIPPED for the same two cases the big commit is skipped for: a no-op
        # run recorded nothing, and a dry run must write nothing to master.
        if: always() && env.FALLBACK_NOOP != 'true' && env.DRY_RUN != 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          # THE ONLY TRACKED MODEL-STATE FILE. state/model_health.json and
          # state/model_cache.json sit beside it, but both are gitignored runtime
          # caches (a ranking input and a catalogue cache) and are never
          # force-added. Staging is by explicit name -- `git add -A` or
          # `git add state/` would sweep in state/email.html and anything else
          # the workspace happens to hold.
          MODEL_STATE=state/model_cooldown.json
          if [ ! -f "$MODEL_STATE" ]; then
            echo "no $MODEL_STATE was written this run"
            exit 0
          fi
          # READ IT BACK AND CHECK ITS SHAPE BEFORE STAGING. A torn write or an
          # empty file committed over a good one would un-arm every veto it held
          # and be invisible until the same engines were tried again.
          if ! python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert isinstance(d,dict) and isinstance(d.get("models",{}),dict) and isinstance(d.get("pool",{}),dict)' "$MODEL_STATE"; then
            echo "::warning::$MODEL_STATE did not read back as a cooldown document -- not committing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The checkout persists no credentials, so the token is injected for
          # the network commands only, exactly as `Commit state changes` does.
          auth=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)")
          else
            echo "::warning::GITHUB_TOKEN is empty -- pull/push will run unauthenticated"
          fi
          git add -- "$MODEL_STATE"
          if git diff --staged --quiet -- "$MODEL_STATE"; then
            echo "$MODEL_STATE unchanged; nothing to persist"
            exit 0
          fi
          git commit -m "chore: persist model cooldown state [skip ci]" -- "$MODEL_STATE"
          if ! git "${auth[@]}" pull --ff-only origin master; then
            echo "Fast-forward pull failed, attempting rebase (theirs wins on the shared cooldown file)..."
            if ! git "${auth[@]}" pull --rebase -X theirs origin master; then
              git rebase --abort >/dev/null 2>&1 || true
              echo "::warning::LOST THE COOLDOWN REBASE RACE: the rebase failed, so this run's cooldown was NOT pushed -- the next run re-learns it"
              exit 0
            fi
          fi
          if ! git "${auth[@]}" push; then
            echo "::warning::LOST THE COOLDOWN PUSH RACE: the push was rejected, so this run's cooldown was NOT pushed -- the next run re-learns it"
            exit 0
          fi
          echo "model cooldown state pushed"

      - name: Assert digest is not empty
        # The last step, deliberately AFTER "Commit state changes".
        #
        # Placement is load-bearing. It must run after the commit so that
        # state/last_digest_sent.json (delivered=false, stories=0) and
        # state/digest_retry.json are already pushed, which is what lets
        # (a) the NEXT run's no-op check refuse to arm FALLBACK_NOOP on this
        # run's marker, (b) digest-watchdog.yml's retry job see the ladder,
        # and (c) the backup channels and the state commit still run exactly
        # as they do for a normal digest. Failing earlier would have skipped
        # the Gmail/Telegram ladder — the very channels that exist for when
        # ntfy and the website do not fire.
        #
        # It has no `if: always()` on purpose: if an earlier step already
        # failed the job is red and this step has nothing to add, and an
        # `always()` step that can fail would be the Bug B shape (see
        # ALWAYS_STEP_EXEMPTIONS in tests/workflows/test_workflow_lint.py).
        if: env.FALLBACK_NOOP != 'true'
        env:
          TZ: Asia/Kathmandu
          DIGEST_TIME: ${{ steps.digest_time.outputs.time }}
          TODAY: ${{ env.TODAY }}
          RETRY_OF: ${{ env.RETRY_OF }}
        run: |
          set -eo pipefail
          python3 - <<'PY'
          import json, os, sys

          # BROKEN INPUT IS NOT A QUIET DAY, and the run must say so rather than
          # leave the reader to infer it from a Python traceback three steps
          # earlier. The marker step exports this flag when
          # state/stories.validated.json could not be READ or did not hold a
          # `stories` LIST -- in both cases the count is UNKNOWN, not zero.
          # Asserted FIRST so the job is red whichever branch below it would have
          # taken. It can never fire on a legitimate empty day: the validator
          # always writes a list, `"stories": []`, on a genuine quiet/RECAP run,
          # so that path never sets the flag.
          if os.environ.get('STORIES_VALIDATED_BROKEN') == 'true':
              print('::error::state/stories.validated.json was BROKEN input on this '
                    'run: the story count is UNKNOWN, so the empty digest below is '
                    'an artifact of unreadable input, NOT evidence of a quiet day')
              sys.exit(1)

          slot = os.environ.get('DIGEST_TIME', '')
          today = os.environ.get('TODAY', '')
          marker = {}
          try:
              with open('state/last_digest_sent.json', encoding='utf-8') as fh:
                  marker = json.load(fh)
          except (OSError, ValueError) as exc:
              print('could not read the delivery marker: %s' % exc)
          try:
              stories = int(marker.get('stories', 0) or 0)
          except (TypeError, ValueError):
              stories = 0
          if stories > 0:
              print('digest_assert: %d stories delivered for %s/%s — nothing to assert'
                    % (stories, slot, today))
              raise SystemExit(0)

          kind = marker.get('empty_kind') or 'quiet_day'
          evidence = ''
          attempts = 0
          try:
              with open('state/stories.validated.json', encoding='utf-8') as fh:
                  evidence = str(json.load(fh).get('empty_evidence') or '')
          except (OSError, ValueError):
              pass
          try:
              with open('state/digest_retry.json', encoding='utf-8') as fh:
                  attempts = int(json.load(fh).get('attempts') or 0)
          except (OSError, ValueError, TypeError):
              pass

          # The marker was written with delivered=false, so FALLBACK_NOOP can
          # never be armed from this run. Say so explicitly, because "the run
          # is red AND the next run will still deliver" is the whole promise.
          print('delivery marker: delivered=%s stories=%d — FALLBACK_NOOP is NOT armed'
                % (marker.get('delivered'), stories))
          print('retry ladder: attempt %d of 3 (empty_kind=%s)' % (attempts, kind))
          if evidence:
              print('evidence: %s' % evidence)
          if kind == 'quiet_day':
              print('::error::digest is empty (quiet day): 0 stories for %s %s '
                    'after %d attempt(s) — the fallback ladder will retry'
                    % (slot, today, attempts))
          else:
              print('::error::digest BROKEN: 0 usable stories for %s %s '
                    '(empty_kind=%s) — the fallback ladder will fire now'
                    % (slot, today, kind))
          if os.environ.get('RETRY_OF'):
              print('this run was itself a retry of %s' % os.environ['RETRY_OF'])
          sys.exit(1)
          PY

      - name: Hand this run to the seal
        # A. THE BUILD NAMES ITS OWN RUN ID, so no second job has to sit and
        # watch this one. `workflow_dispatch` returns no run id -- which is the
        # whole reason digest-prebuild.yml used to keep a 50-minute dispatcher
        # alive just to learn it -- but a run always knows its own.
        #
        # LAST, AND ONLY ON A SUCCESSFUL PREBUILD. The seal needs the artifact
        # "Upload digest artifacts" has already uploaded, so this cannot run
        # before it; and an empty digest exits above, so a run with nothing to
        # seal never dispatches one. The seal re-reads the conclusion as its
        # own first step, which makes this gate the cheap half of a two-sided
        # check rather than the only one.
        if: success() && env.PHASE == 'prebuild'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SLOT: ${{ steps.digest_time.outputs.time }}
          SLOT_DATE: ${{ env.TODAY }}
        run: |
          set -eo pipefail
          if [ -z "$SLOT" ] || [ -z "$SLOT_DATE" ]; then
            echo "::error::the slot or its Nepal date did not reach this step, so the seal cannot be told which artifact to look for. Refusing to dispatch a seal that would have to guess."
            exit 1
          fi
          # The `gh api` form, not `gh workflow run`, deliberately: it is the
          # exact shape the deleted dispatch job used, and tests/digest/
          # digest_prebuild_cron.test.js censuses every file that dials the
          # prebuild and only recognises this one.
          gh api -X POST \
            "$API/repos/$REPO/actions/workflows/digest-prebuild.yml/dispatches" \
            -f ref=master \
            -f "inputs[run_id]=$RUN_ID" \
            -f "inputs[digest_time]=$SLOT" \
            -f "inputs[slot_date]=$SLOT_DATE"
          echo "seal dispatched for $SLOT/$SLOT_DATE, run $RUN_ID"