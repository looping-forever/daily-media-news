<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>Daily Media News &mdash; {{DATE}}</title>
  <style type="text/css">
    .chip { display:inline-block; background-color:#e5e7eb; color:#374151; border-radius:9999px; padding:1px 8px; font-size:11px; font-weight:bold; }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6; -webkit-text-size-adjust:100%;">
  <!-- Outer wrapper: full-width light-gray backdrop -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:16px 8px;">
        <!-- Card: max 600px, white, rounded -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; border:1px solid #e5e7eb; font-family:Arial, Helvetica, sans-serif; color:#111827;">
          <!-- Header -->
          <tr>
            <td style="padding:20px 24px 12px 24px; border-bottom:2px solid #111827;">
              <div style="font-size:20px; font-weight:bold; color:#111827; margin:0;">Daily Media News</div>
              <div style="font-size:13px; color:#6b7280; margin-top:4px;">
                <span>{{DIGEST_TIME}}</span> briefing &middot; {{DATE}} &middot; {{STORY_COUNT}} item(s)
              </div>
              <div style="font-size:12px; color:#6b7280; margin-top:4px;">{{DATA_CUTOFF}}</div>
            </td>
          </tr>
          <!-- Optional research-status banner (injected only when research_status == limited) -->
          <tr>
            <td style="padding:0 24px;">
              {{RESEARCH_NOTICE}}
            </td>
          </tr>
          <!-- Body: rendered sections -->
          <tr>
            <td style="padding:8px 24px 16px 24px;">
              {{SECTIONS}}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:14px 24px 18px 24px; border-top:1px solid #e5e7eb; background-color:#f9fafb; border-radius:0 0 8px 8px;">
              <div style="font-size:11px; color:#9ca3af; line-height:1.5;">
                Personal briefing generated by daily-media-news &middot; filtered for spoilers, duplicates and depressing local crime items &middot; Example City, Example District, Nepal
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
